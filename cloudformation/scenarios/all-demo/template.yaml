    Value: !GetAtt AiContactCentre.Outputs.CompanionUrl

  AiContactCentrePstnNumber:
    Description: AI Contact Centre PSTN claim number
    Value: !GetAtt AiContactCentre.Outputs.PstnNumber

  LocalgovImsAdminPortalUrl:
    Description: LocalGov IMS admin portal URL (Windows EC2 + IIS)
    Value: !GetAtt LocalgovIms.Outputs.AdminPortalUrl

  LocalgovImsPaymentPortalUrl:
    Description: LocalGov IMS payment portal URL
    Value: !GetAtt LocalgovIms.Outputs.PaymentPortalUrl

  LocalgovImsAdminUsername:
    Description: LocalGov IMS admin username
    Value: !GetAtt LocalgovIms.Outputs.AdminUsername

  LocalgovImsAdminPassword:
    Description: LocalGov IMS admin password
    Value: !GetAtt LocalgovIms.Outputs.AdminPassword

  MinuteUrl:
    Description: Minute AI transcription URL (clean URL; requires an active session cookie)
    Value: !GetAtt Minute.Outputs.MinuteUrl

  MinuteLoginUrl:
    Description: Minute AI single-use login URL — visit once to set a 7-day session cookie
