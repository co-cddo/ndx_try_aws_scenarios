    Properties:
      TemplateURL: !Sub 'https://${TemplateBucket}.s3.${TemplateBucketRegion}.amazonaws.com/scenarios/ai-contact-centre/template.yaml'
      Parameters:
        Environment: !Ref Environment
        ExistingPhoneNumberArn: !Ref AiccExistingPhoneNumberArn
