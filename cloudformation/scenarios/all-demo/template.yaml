AWSTemplateFormatVersion: '2010-09-09'
Description: |
  NDX:Try - All Demo
  Deploys all 16 NDX:Try scenarios as nested stacks for demonstrations and the
  scenario-regression smoke pack. Each child stack is an independent scenario
  deployed in parallel.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Template Configuration
        Parameters:
          - TemplateBucket
          - TemplateBucketRegion
          - Environment
      - Label:
          default: Scenario-specific credentials (override at deploy time)
        Parameters:
          - GovUkPayApiKey
          - OSVectorTilesApiKey
          - DprImageUri
          - DprCouncilConfig

Parameters:
  Environment:
    Type: String
    Default: sandbox
    AllowedValues:
      - sandbox
      - development
      - production
    Description: Deployment environment passed to all child stacks

  TemplateBucket:
    Type: String
    Default: ndx-try-isb-blueprints-568672915267
    Description: S3 bucket name containing the scenario templates

  TemplateBucketRegion:
    Type: String
    Default: us-east-1
    Description: Region of the S3 bucket containing the scenario templates

  # The five scenarios with parameters: most have non-empty defaults in their
  # own templates and survive empty pass-through. Two (localgov-ims and
  # bops-planning) need real values for full functionality; passing empty
  # strings yields a deployed-but-degraded scenario which is acceptable for
  # smoke. Override at deploy time for full functionality.
  GovUkPayApiKey:
    Type: String
    Default: ''
    NoEcho: true
    Description: GOV.UK Pay sandbox API key (localgov-ims). Empty = payment portal will reject transactions but the rest of the stack still deploys.

  OSVectorTilesApiKey:
    Type: String
    Default: ''
    NoEcho: true
    Description: Ordnance Survey vector tiles API key (bops-planning). Empty = map tiles will not render but the rest of the stack still deploys.

  DprImageUri:
    Type: String
    Default: 'ghcr.io/co-cddo/ndx_try_aws_scenarios-dpr:latest'
    Description: Docker image URI for digital-planning-register. Default tracks GHCR latest; pin to a digest in production.

  DprCouncilConfig:
    Type: String
    Default: '{}'
    Description: JSON council configuration for digital-planning-register. Empty JSON object uses scenario defaults.

  AiccExistingPhoneNumberArn:
    Type: String
    Default: ''
    Description: |
      Any non-empty value disables the GeoNumber claim path in ai-contact-centre.
      Smoke passes a DUMMY string here (UK DID claim quota is 5/30 days).
      Leave empty for ISB pool deploys to claim a fresh DID, as before.
  AiccExistingPhoneNumber:
    Type: String
    Default: ''
    Description: |
      E.164 number string surfaced as the AICC PstnNumber output when
      AiccExistingPhoneNumberArn is set (smoke uses "+442012345678").

Resources:
  CouncilChatbot:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub 'https://${TemplateBucket}.s3.${TemplateBucketRegion}.amazonaws.com/scenarios/council-chatbot/template.yaml'
      Parameters:
        Environment: !Ref Environment
      TimeoutInMinutes: 15
      Tags:
        - Key: Project
          Value: ndx-try
        - Key: Scenario
          Value: council-chatbot
        - Key: ParentStack
          Value: !Ref 'AWS::StackName'
        - Key: awsApplication
          Value: !GetAtt AppRegistryApplication.Arn

  FoiRedaction:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub 'https://${TemplateBucket}.s3.${TemplateBucketRegion}.amazonaws.com/scenarios/foi-redaction/template.yaml'
      Parameters:
        Environment: !Ref Environment
      TimeoutInMinutes: 15
      Tags:
        - Key: Project
          Value: ndx-try
        - Key: Scenario
          Value: foi-redaction
        - Key: ParentStack
          Value: !Ref 'AWS::StackName'
        - Key: awsApplication
          Value: !GetAtt AppRegistryApplication.Arn

  PlanningAi:
