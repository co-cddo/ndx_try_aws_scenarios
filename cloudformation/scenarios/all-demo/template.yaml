    Value: !GetAtt FixMyStreet.Outputs.AdminPassword

  PaperlessNgxUrl:
    Description: Paperless-ngx document archive URL
    Value: !GetAtt PaperlessNgx.Outputs.PaperlessUrl

  PaperlessNgxAdminUsername:
    Description: Paperless-ngx admin username
    Value: !GetAtt PaperlessNgx.Outputs.AdminUsername

  PaperlessNgxAdminPassword:
    Description: Paperless-ngx admin password
    Value: !GetAtt PaperlessNgx.Outputs.AdminPassword

  PlanXUrl:
    Description: PlanX URL
    Value: !GetAtt Planx.Outputs.PlanXUrl

  PlanXLoginUrl:
    Description: PlanX login URL
    Value: !GetAtt Planx.Outputs.PlanXLoginUrl

  PlanXDemoUsername:
    Description: PlanX demo account username
    Value: !GetAtt Planx.Outputs.DemoUsername

  PlanXDemoPassword:
    Description: PlanX demo account password
    Value: !GetAtt Planx.Outputs.DemoPassword

  BopsPlanningUrl:
    Description: BOPS Planning web URL
    Value: !GetAtt BopsPlanning.Outputs.BOPSUrl

  BopsPlanningLoginUrl:
    Description: BOPS Planning login URL
    Value: !GetAtt BopsPlanning.Outputs.BOPSLoginUrl

  BopsPlanningUsername:
    Description: BOPS Planning admin username
    Value: !GetAtt BopsPlanning.Outputs.BOPSUsername

  BopsPlanningPassword:
    Description: BOPS Planning admin password
    Value: !GetAtt BopsPlanning.Outputs.BOPSPassword

  DigitalPlanningRegisterUrl:
    Description: Digital Planning Register URL
    Value: !GetAtt DigitalPlanningRegister.Outputs.RegisterUrl

  # ========================================================================
  # SECONDARY OUTPUTS — buckets, tables, and other resources
  # ========================================================================
  ChatbotKnowledgeBaseBucket:
    Description: S3 bucket for chatbot knowledge base
    Value: !GetAtt CouncilChatbot.Outputs.KnowledgeBaseBucket

  FoiDocumentsBucket:
    Description: S3 bucket for FOI documents
    Value: !GetAtt FoiRedaction.Outputs.DocumentsBucket

  PlanningDocumentsBucket:
    Description: S3 bucket for planning documents
    Value: !GetAtt PlanningAi.Outputs.DocumentsBucket

  QuicksightDataBucket:
    Description: S3 bucket for QuickSight data
    Value: !GetAtt QuicksightDashboard.Outputs.DataBucket

  SmartCarParkSensorReadingsTable:
    Description: DynamoDB table for parking sensor readings
    Value: !GetAtt SmartCarPark.Outputs.SensorReadingsTable

  TextToSpeechAudioBucket:
    Description: S3 bucket for generated audio files
    Value: !GetAtt TextToSpeech.Outputs.AudioBucket

  # ========================================================================
  # AGGREGATE INFO
  # ========================================================================
  ScenarioInfo:
    Description: NDX:Try all-demo scenario information
    Value: !Sub |
      {
        "scenario": "all-demo",
        "environment": "${Environment}",
        "childScenarios": [
          "council-chatbot",
          "foi-redaction",
          "planning-ai",
          "quicksight-dashboard",
          "smart-car-park",
          "text-to-speech",
          "localgov-drupal",
          "simply-readable",
          "ai-contact-centre",
          "localgov-ims",
          "minute",
          "fixmystreet",
          "paperless-ngx",
          "planx",
          "bops-planning",
          "digital-planning-register"
        ],
        "note": "All 16 NDX:Try scenarios deployed as nested stacks (all-demo umbrella excluded)"
      }
