      Tags:
        - Key: Project
          Value: ndx-try
        - Key: Scenario
          Value: localgov-ims
        - Key: ParentStack
          Value: !Ref 'AWS::StackName'
        - Key: awsApplication
          Value: !GetAtt AppRegistryApplication.Arn

  Minute:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub 'https://${TemplateBucket}.s3.${TemplateBucketRegion}.amazonaws.com/scenarios/minute/template.yaml'
      Parameters: {}
      TimeoutInMinutes: 45
      Tags:
        - Key: Project
          Value: ndx-try
        - Key: Scenario
          Value: minute
        - Key: ParentStack
          Value: !Ref 'AWS::StackName'
        - Key: awsApplication
          Value: !GetAtt AppRegistryApplication.Arn

  FixMyStreet:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub 'https://${TemplateBucket}.s3.${TemplateBucketRegion}.amazonaws.com/scenarios/fixmystreet/template.yaml'
      Parameters: {}
      TimeoutInMinutes: 45
      Tags:
        - Key: Project
          Value: ndx-try
        - Key: Scenario
          Value: fixmystreet
        - Key: ParentStack
          Value: !Ref 'AWS::StackName'
        - Key: awsApplication
          Value: !GetAtt AppRegistryApplication.Arn

  PaperlessNgx:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub 'https://${TemplateBucket}.s3.${TemplateBucketRegion}.amazonaws.com/scenarios/paperless-ngx/template.yaml'
      Parameters: {}
      TimeoutInMinutes: 45
      Tags:
        - Key: Project
          Value: ndx-try
        - Key: Scenario
          Value: paperless-ngx
        - Key: ParentStack
          Value: !Ref 'AWS::StackName'
        - Key: awsApplication
          Value: !GetAtt AppRegistryApplication.Arn

  Planx:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub 'https://${TemplateBucket}.s3.${TemplateBucketRegion}.amazonaws.com/scenarios/planx/template.yaml'
      Parameters: {}
      TimeoutInMinutes: 60
      Tags:
        - Key: Project
          Value: ndx-try
