      TimeoutInMinutes: 15
      Tags:
        - Key: Project
          Value: ndx-try
        - Key: Scenario
          Value: planning-ai
        - Key: ParentStack
          Value: !Ref 'AWS::StackName'
        - Key: awsApplication
