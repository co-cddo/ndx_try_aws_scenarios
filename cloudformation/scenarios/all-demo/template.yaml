    Properties:
      TemplateURL: !Sub 'https://${TemplateBucket}.s3.${TemplateBucketRegion}.amazonaws.com/scenarios/bops-planning/template.yaml'
      Parameters:
        OSVectorTilesApiKey: !Ref OSVectorTilesApiKey
      TimeoutInMinutes: 60
      Tags:
        - Key: Project
          Value: ndx-try
        - Key: Scenario
          Value: bops-planning
        - Key: ParentStack
          Value: !Ref 'AWS::StackName'
        - Key: awsApplication
