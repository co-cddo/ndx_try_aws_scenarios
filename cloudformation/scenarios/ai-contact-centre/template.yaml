              FulfillmentCodeHook: { Enabled: true }
              SampleUtterances:
                - { Utterance: "Nie" }
                - { Utterance: "Nie, dziękuję" }
                - { Utterance: "Nie, dziękuję bardzo" }
                - { Utterance: "To wszystko" }
                - { Utterance: "Nic więcej" }
                - { Utterance: "Do widzenia" }
                - { Utterance: "Pa" }
                - { Utterance: "Dziękuję, do widzenia" }
                - { Utterance: "Skończyłem" }
                - { Utterance: "Wszystko skończone" }
            - Name: FallbackIntent
              ParentIntentSignature: AMAZON.FallbackIntent
              FulfillmentCodeHook: { Enabled: true }
  LexBotVersionV8:
    Type: AWS::Lex::BotVersion
    Properties:
      BotId: !Ref LexBot
      BotVersionLocaleSpecification:
        - LocaleId: en_US
          BotVersionLocaleDetails: { SourceBotVersion: DRAFT }
        - LocaleId: it_IT
          BotVersionLocaleDetails: { SourceBotVersion: DRAFT }
        - LocaleId: fr_FR
          BotVersionLocaleDetails: { SourceBotVersion: DRAFT }
        - LocaleId: de_DE
          BotVersionLocaleDetails: { SourceBotVersion: DRAFT }
        - LocaleId: es_ES
          BotVersionLocaleDetails: { SourceBotVersion: DRAFT }
        - LocaleId: pl_PL
          BotVersionLocaleDetails: { SourceBotVersion: DRAFT }

  LexBotAlias:
    Type: AWS::Lex::BotAlias
    Properties:
      BotId: !Ref LexBot
      BotAliasName: prod
      BotVersion: !GetAtt LexBotVersionV8.BotVersion
      BotAliasLocaleSettings:
        - LocaleId: en_US
          BotAliasLocaleSetting:
            Enabled: true
            CodeHookSpecification:
              LambdaCodeHook:
                LambdaArn: !GetAtt MultiIntentFunction.Arn
                CodeHookInterfaceVersion: '1.0'
        - LocaleId: it_IT
          BotAliasLocaleSetting:
            Enabled: true
            CodeHookSpecification:
              LambdaCodeHook:
                LambdaArn: !GetAtt MultiIntentFunction.Arn
                CodeHookInterfaceVersion: '1.0'
        - LocaleId: fr_FR
          BotAliasLocaleSetting:
            Enabled: true
            CodeHookSpecification:
              LambdaCodeHook:
                LambdaArn: !GetAtt MultiIntentFunction.Arn
                CodeHookInterfaceVersion: '1.0'
        - LocaleId: de_DE
          BotAliasLocaleSetting:
            Enabled: true
            CodeHookSpecification:
              LambdaCodeHook:
                LambdaArn: !GetAtt MultiIntentFunction.Arn
                CodeHookInterfaceVersion: '1.0'
        - LocaleId: es_ES
          BotAliasLocaleSetting:
            Enabled: true
            CodeHookSpecification:
              LambdaCodeHook:
                LambdaArn: !GetAtt MultiIntentFunction.Arn
                CodeHookInterfaceVersion: '1.0'
        - LocaleId: pl_PL
          BotAliasLocaleSetting:
            Enabled: true
            CodeHookSpecification:
              LambdaCodeHook:
                LambdaArn: !GetAtt MultiIntentFunction.Arn
                CodeHookInterfaceVersion: '1.0'

  # ============================================================
  # PHASE 6: Lambda functions (one role hub, then per-function)
  # ============================================================
  CustomResourceLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'InnovationSandbox-ndx-aicc-cr-${AWS::Region}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - { Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: sts:AssumeRole }
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: cr-broad
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - connect:*
                  - bedrock:*
                  - bedrock-agent:*
                  - bedrock-agent-runtime:*
                  - customer-profiles:*
                  # AWS IAM uses 'profile:' prefix for Customer Profiles actions,
                  # not 'customer-profiles:'. Both are needed defensively.
                  - profile:*
                  - cases:*
                  - cases-domain:*
                  - wisdom:*
                  - qconnect:*
                  # AssociateInstanceStorageConfig validates the caller has
                  # access to the resource being attached.
                  - kinesis:DescribeStream
                  - kinesis:DescribeStreamSummary
                  - kinesis:PutRecord
                  - kinesis:PutRecords
                  - kinesis:GetShardIterator
                  - kinesis:GetRecords
                  - kinesis:ListShards
                Resource: '*'
              - Effect: Allow
                # AssociateInstanceStorageConfig grants the Connect service-linked
                # role access to the Kinesis stream by adding an inline policy.
                Action:
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:CreateServiceLinkedRole
                Resource:
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/aws-service-role/connect.amazonaws.com/*'
              - Effect: Allow
                Action: [s3:PutBucketCors, s3:GetBucketCors]
                Resource: !Sub 'arn:aws:s3:::ndx-try-aicc-uploads-${AWS::AccountId}-${AWS::Region}'
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:ListBucketVersions
                  - s3:DeleteObjectVersion
                Resource:
                  - !Sub 'arn:aws:s3:::ndx-try-aicc-kb-${AWS::AccountId}-${AWS::Region}'
                  - !Sub 'arn:aws:s3:::ndx-try-aicc-kb-${AWS::AccountId}-${AWS::Region}/*'
                  - !Sub 'arn:aws:s3:::ndx-try-aicc-spa-${AWS::AccountId}-${AWS::Region}'
                  - !Sub 'arn:aws:s3:::ndx-try-aicc-spa-${AWS::AccountId}-${AWS::Region}/*'
              # Customer Profiles encrypts ObjectType data with this CMK; the
              # PutProfileObjectType call from connect-bootstrap fails without it.
              - Effect: Allow
                Action:
                  - kms:GenerateDataKey
                  - kms:GenerateDataKeyWithoutPlaintext
                  - kms:Decrypt
                  - kms:DescribeKey
                  - kms:Encrypt
                  - kms:CreateGrant
                Resource: !GetAtt CustomerProfilesKey.Arn

  CommonLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'InnovationSandbox-ndx-aicc-fn-${AWS::Region}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - { Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: sts:AssumeRole }
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: fn-permissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                  - bedrock:Retrieve
                  - bedrock:RetrieveAndGenerate
                  - bedrock:ApplyGuardrail
                  - bedrock-agent-runtime:Retrieve
                  - bedrock-agent-runtime:RetrieveAndGenerate
                Resource: '*'
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource:
                  - !Sub '${UploadBucket.Arn}/*'
                  - !Sub '${ShareBucket.Arn}/*'
              - Effect: Allow
                Action: [s3:ListBucket]
                Resource:
                  - !GetAtt UploadBucket.Arn
                  - !GetAtt ShareBucket.Arn
              - Effect: Allow
                Action: [cases:*, profile:*, customer-profiles:*]
                Resource: '*'
              - Effect: Allow
                Action:
                  - connect:StartChatContact
                  - connect:StartOutboundVoiceContact
                  - connect:StartWebRTCContact
                  - connect:StopContact
                  - connect:DescribeContact
                  - connect:DescribePhoneNumber
                  - connect:GetCurrentMetricData
                  - connect:DescribeQueue
                  - connect:UpdateContactAttributes
                  - connect:GetContactAttributes
                Resource: '*'
              - Effect: Allow
                Action: [lex:RecognizeText, lex:RecognizeUtterance]
                Resource: '*'
              - Effect: Allow
                Action:
                  - kinesisvideo:GetDataEndpoint
                  - kinesisvideo:DescribeStream
                  - kinesisvideo:GetMedia
                  - kinesis-video-media:GetMedia
                Resource: '*'
              - Effect: Allow
                Action:
                  - transcribe:StartStreamTranscription
                  - transcribe:StartStreamTranscriptionWebSocket
                Resource: '*'
              - Effect: Allow
                Action: [kms:GenerateDataKey, kms:Decrypt, kms:DescribeKey]
                Resource: !GetAtt CustomerProfilesKey.Arn
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:Query, dynamodb:UpdateItem]
                Resource: !GetAtt ContactLensCacheTable.Arn
              - Effect: Allow
                Action: [lambda:InvokeFunction]
                Resource: '*'
              - Effect: Allow
                Action:
                  - kinesis:GetRecords
                  - kinesis:GetShardIterator
                  - kinesis:DescribeStream
                  - kinesis:DescribeStreamSummary
                  - kinesis:ListShards
                  - kinesis:SubscribeToShard
                Resource: !GetAtt ContactLensStream.Arn
              - Effect: Allow
                Action: [sqs:SendMessage]
                Resource: !GetAtt ContactLensDlq.Arn

  RagFulfilmentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'ndx-try-aicc-rag-${AWS::Region}'
      CodeUri: lambdas/rag-fulfilment/
      Handler: index.lambda_handler
      Timeout: 25
      MemorySize: 1024
      Role: !GetAtt CommonLambdaRole.Arn
      Environment:
        Variables:
          KB_ID: !Ref KnowledgeBase
          GUARDRAIL_ID: !Ref Guardrail
          MODEL_ARN: !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.nova-lite-v1:0'
          DDB_TABLE_NAME: !Ref ContactLensCacheTable
          MULTI_INTENT_FN_NAME: !Ref MultiIntentFunction
          CASES_DOMAIN_ID: !Ref CasesDomain
          CONNECT_INSTANCE_ID: !Ref ConnectInstance

  MultiIntentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'ndx-try-aicc-multi-intent-${AWS::Region}'
      CodeUri: lambdas/multi-intent-decomposer/
      Handler: index.lambda_handler
      Timeout: 15
      Role: !GetAtt CommonLambdaRole.Arn
      Environment: { Variables: { MULTI_INTENT_MODEL_ID: !Ref GenerationModelId } }

  LocalizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'ndx-try-aicc-localizer-${AWS::Region}'
      CodeUri: lambdas/localizer/
      Handler: index.lambda_handler
      Timeout: 8
      MemorySize: 256
      Role: !GetAtt CommonLambdaRole.Arn
      Environment:
        Variables:
          MODEL_ARN: !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/${GenerationModelId}'

  LanguageDetectFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'ndx-try-aicc-language-detect-${AWS::Region}'
      CodeUri: lambdas/language-detect/
      Handler: index.lambda_handler
      # Two execution modes (see index.py docstring): the synchronous
      # orchestrator path returns in well under a second; the async worker
      # path takes up to ~14s because Transcribe streaming runs at 1x
      # real-time on the server side and we cap audio at 12s. Set timeout
      # generously so worker invocations always finish.
      Timeout: 60
      MemorySize: 512
      Role: !GetAtt CommonLambdaRole.Arn
      Environment:
        Variables:
          CONNECT_INSTANCE_ID: !Ref ConnectInstance

  MultiIntentLexInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt MultiIntentFunction.Arn
      Action: lambda:InvokeFunction
      Principal: lex.amazonaws.com
      SourceArn: !Sub 'arn:aws:lex:${AWS::Region}:${AWS::AccountId}:bot-alias/*'

  MultimodalDescribeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'ndx-try-aicc-multimodal-${AWS::Region}'
      CodeUri: lambdas/multimodal-describe/
      Handler: index.lambda_handler
      Timeout: 30
      MemorySize: 1024
      Role: !GetAtt CommonLambdaRole.Arn
      Environment:
        Variables:
          MULTIMODAL_MODEL_ID: !Ref GenerationModelId
          CASES_DOMAIN_ID: !Ref CasesDomain
          CASES_TEMPLATE_ID: !GetAtt CasesTemplate.TemplateId
          IMAGE_BUCKET: !Ref UploadBucket
          PROFILES_DOMAIN: !Ref CustomerProfilesDomain
          DDB_TABLE_NAME: !Ref ContactLensCacheTable

  CompanionApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'ndx-try-aicc-companion-api-${AWS::Region}'
      CodeUri: lambdas/companion-api/
      Handler: index.lambda_handler
      Role: !GetAtt CommonLambdaRole.Arn
      Environment:
        Variables:
          UPLOAD_BUCKET: !Ref UploadBucket
          MULTIMODAL_LAMBDA_ARN: !GetAtt MultimodalDescribeFunction.Arn
          MULTI_INTENT_LAMBDA_ARN: !GetAtt MultiIntentFunction.Arn
          SHARE_PDF_LAMBDA_ARN: !GetAtt SharePdfFunction.Arn
          CASES_DOMAIN_ID: !Ref CasesDomain
          DDB_TABLE_NAME: !Ref ContactLensCacheTable
          CONNECT_INSTANCE_ID: !Ref ConnectInstance
          CONNECT_CONTACT_FLOW_ID: !Ref MainContactFlow
          CASES_TEMPLATE_ID: !GetAtt CasesTemplate.TemplateId
          PROFILES_DOMAIN: !Ref CustomerProfilesDomain
          LEX_BOT_ID: !Ref LexBot
          LEX_BOT_ALIAS_ID: !GetAtt LexBotAlias.BotAliasId
          KB_ID: !Ref KnowledgeBase
          GUARDRAIL_ID: !Ref Guardrail
          GENERATION_MODEL_ARN: !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/${GenerationModelId}'
          # Static CloudFront wildcard, the CDN-specific domain check happens in
          # the Lambda via regex on request origin. Avoids a circular dependency
          # between CompanionApiFunction -> Cdn -> CompanionApiFunctionUrl.
          ALLOWED_ORIGIN_PATTERN: '^https:\/\/[a-z0-9]+\.cloudfront\.net$'
      FunctionUrlConfig:
        # AuthType: NONE because CloudFront OAC for Lambda Function URLs has a
        # signing-mismatch bug on POST + body requests as of 2026-04. We rely on
        # CloudFront's path-based routing + AWS WAF rate limiting + the Lambda's
        # internal CORS check (ALLOWED_ORIGIN_PATTERN) for protection.
        # No URL-level CORS: the Lambda handles OPTIONS preflights itself, so a
        # forged origin gets a hard 403 instead of an auto-200 from the URL layer.
        AuthType: NONE
        InvokeMode: BUFFERED

  ContactLensConsumerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'ndx-try-aicc-contact-lens-consumer-${AWS::Region}'
      CodeUri: lambdas/contact-lens-consumer/
      Handler: index.lambda_handler
      Role: !GetAtt CommonLambdaRole.Arn
      Environment: { Variables: { DDB_TABLE_NAME: !Ref ContactLensCacheTable, TTL_SECONDS: '1800' } }
      Events:
        ContactLensStream:
          Type: Kinesis
          Properties:
            Stream: !GetAtt ContactLensStream.Arn
            BatchSize: 100
            MaximumBatchingWindowInSeconds: 1
            StartingPosition: LATEST
            MaximumRetryAttempts: 2
            BisectBatchOnFunctionError: true
            FunctionResponseTypes: [ReportBatchItemFailures]
            DestinationConfig:
              OnFailure: { Destination: !GetAtt ContactLensDlq.Arn }

  PhoneFlowAssocFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'ndx-try-aicc-phone-flow-assoc-${AWS::Region}'
      CodeUri: lambdas/phone-number-flow-association/
      Handler: index.handler
      Role: !GetAtt CustomResourceLambdaRole.Arn

  SharePdfFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'ndx-try-aicc-share-pdf-${AWS::Region}'
      CodeUri: lambdas/share-pdf-builder/
      Handler: index.lambda_handler
      MemorySize: 1024
      Timeout: 60
      Role: !GetAtt CommonLambdaRole.Arn
      Environment:
        Variables:
          DDB_TABLE_NAME: !Ref ContactLensCacheTable
          SHARE_BUCKET: !Ref ShareBucket
          SHARE_PRESIGN_TTL: '86400'
          CASES_DOMAIN_ID: !Ref CasesDomain
      # Uses fpdf2 (pure Python) bundled into the Lambda zip via requirements.txt.

  DeployTimeVerificationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'ndx-try-aicc-deploy-verify-${AWS::Region}'
      CodeUri: lambdas/deploy-time-verification/
      Handler: index.handler
      Role: !GetAtt CustomResourceLambdaRole.Arn

  SeedKbFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'ndx-try-aicc-seed-kb-${AWS::Region}'
      CodeUri: lambdas/seed-kb/
      Handler: index.handler
      Timeout: 900
      Role: !GetAtt CustomResourceLambdaRole.Arn

  SeedKbInvocation:
    Type: Custom::SeedKb
    DependsOn: KnowledgeBaseDataSource
    Properties:
      ServiceToken: !GetAtt SeedKbFunction.Arn
      KnowledgeBaseId: !Ref KnowledgeBase
      DataSourceId: !GetAtt KnowledgeBaseDataSource.DataSourceId
      KbSourceBucket: !Ref KbSourceBucket
      # Forcing field: bumped via CorpusVersion parameter after `aws s3 sync` so
      # CFN re-fires this custom resource and the seed Lambda re-ingests.
      CorpusVersion: !Ref CorpusVersion

  # ============================================================
  # PHASE 7: Customer Profiles + ConnectCases
  # ============================================================
  # The CP domain MUST be named with the `amazon-connect-` prefix:
  # AmazonConnectServiceLinkedRolePolicy scopes every profile:* permission
  # (SearchProfiles, GetDomain, ListProfileObjects, etc.) to
  #   arn:aws:profile:*:*:domains/amazon-connect-*
  # so any other name breaks the agent workspace's Customer Profile widget
  # with the generic "review your Amazon Connect Role Policy" message.
  # The CTR-ingestion binding is done by IaCustomerProfilesIntegration
  # (customer-profiles:PutIntegration) so post-call CTRs auto-ingest. There
  # is no separate connect:CreateIntegrationAssociation step — Connect
  # auto-discovers the domain via the SLR once the prefix matches.
  # Phase 0.6 spike output: spikes/customer-profiles-wiring.md.
  CustomerProfilesKey:
    Type: AWS::KMS::Key
    Properties:
      Description: Customer-managed CMK for AI Contact Centre Customer Profiles domain
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - { Sid: AllowAccountRoot, Effect: Allow,
              Principal: { AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root' },
              Action: 'kms:*', Resource: '*' }
          - { Sid: AllowCustomerProfiles, Effect: Allow,
              Principal: { Service: profile.amazonaws.com },
              Action: ['kms:Encrypt', 'kms:Decrypt', 'kms:GenerateDataKey*', 'kms:DescribeKey', 'kms:CreateGrant'],
              Resource: '*' }

  CustomerProfilesDomain:
    Type: AWS::CustomerProfiles::Domain
    DependsOn: ConnectInstanceActiveWait
    Properties:
      # Prefix REQUIRED: see PHASE 7 comment above (SLR resource scoping).
      DomainName: !Sub 'amazon-connect-ndx-aicc-${AWS::AccountId}'
      DefaultExpirationDays: 30
      DefaultEncryptionKey: !GetAtt CustomerProfilesKey.Arn

  # AWS::ConnectCases::* CFN types are not available in this region/account.
  # Use a Custom resource Lambda that calls the connectcases API.
  ConnectCasesResourcesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'ndx-try-aicc-cases-cr-${AWS::Region}'
      CodeUri: lambdas/connect-cases-resources/
      Handler: index.handler
      Timeout: 60
      Role: !GetAtt CustomResourceLambdaRole.Arn

  CasesDomain:
    Type: Custom::CasesDomain
    DependsOn: CustomerProfilesDomain
    Properties:
      ServiceToken: !GetAtt ConnectCasesResourcesFunction.Arn
      Kind: Domain
      Name: !Sub 'ndx-try-aicc-${AWS::AccountId}'

  CasesFieldPhone:
    Type: Custom::CasesField
    Properties:
      ServiceToken: !GetAtt ConnectCasesResourcesFunction.Arn
      Kind: Field
      DomainId: !Ref CasesDomain
      Name: customer_phone_number
      Type: Text
      Description: Caller's phone in E.164

  CasesFieldAddress:
    Type: Custom::CasesField
    Properties:
      ServiceToken: !GetAtt ConnectCasesResourcesFunction.Arn
      Kind: Field
      DomainId: !Ref CasesDomain
      Name: address
      Type: Text
      Description: Address (placeholder-redacted)

  CasesFieldIntentCategory:
    Type: Custom::CasesField
    Properties:
      ServiceToken: !GetAtt ConnectCasesResourcesFunction.Arn
      Kind: Field
      DomainId: !Ref CasesDomain
      Name: intent_category
      Type: Text

  CasesFieldIntents:
    Type: Custom::CasesField
    Properties:
      ServiceToken: !GetAtt ConnectCasesResourcesFunction.Arn
      Kind: Field
      DomainId: !Ref CasesDomain
      Name: intents
      Type: Text

  CasesFieldSafeguardingFlag:
    Type: Custom::CasesField
    Properties:
      ServiceToken: !GetAtt ConnectCasesResourcesFunction.Arn
      Kind: Field
      DomainId: !Ref CasesDomain
      Name: safeguarding_flag
      Type: Boolean

  CasesFieldMultimodalSummary:
    Type: Custom::CasesField
    Properties:
      ServiceToken: !GetAtt ConnectCasesResourcesFunction.Arn
      Kind: Field
      DomainId: !Ref CasesDomain
      Name: multimodal_summary
      Type: Text

  CasesFieldAttachmentsSummary:
    Type: Custom::CasesField
    Properties:
      ServiceToken: !GetAtt ConnectCasesResourcesFunction.Arn
      Kind: Field
      DomainId: !Ref CasesDomain
      Name: attachments_summary
      Type: Text

  CasesFieldSeverity:
    Type: Custom::CasesField
    Properties:
      ServiceToken: !GetAtt ConnectCasesResourcesFunction.Arn
      Kind: Field
      DomainId: !Ref CasesDomain
      Name: severity
      Type: Text

  CasesLayout:
    Type: Custom::CasesLayout
    Properties:
      ServiceToken: !GetAtt ConnectCasesResourcesFunction.Arn
      Kind: Layout
      DomainId: !Ref CasesDomain
      Name: aicc-default-layout
      ContentJson: !Sub
        - '{"basic":{"topPanel":{"sections":[{"fieldGroup":{"name":"header","fields":[{"id":"${PhoneId}"},{"id":"${IntentCatId}"},{"id":"${SgFlagId}"}]}}]},"moreInfo":{"sections":[{"fieldGroup":{"name":"details","fields":[{"id":"${AddressId}"},{"id":"${IntentsId}"},{"id":"${MultiSummaryId}"},{"id":"${SeverityId}"},{"id":"${AttachSumId}"}]}}]}}}'
        - PhoneId:        !GetAtt CasesFieldPhone.FieldId
          IntentCatId:    !GetAtt CasesFieldIntentCategory.FieldId
          SgFlagId:       !GetAtt CasesFieldSafeguardingFlag.FieldId
          AddressId:      !GetAtt CasesFieldAddress.FieldId
          IntentsId:      !GetAtt CasesFieldIntents.FieldId
          MultiSummaryId: !GetAtt CasesFieldMultimodalSummary.FieldId
          SeverityId:     !GetAtt CasesFieldSeverity.FieldId
          AttachSumId:    !GetAtt CasesFieldAttachmentsSummary.FieldId

  CasesTemplate:
    Type: Custom::CasesTemplate
    Properties:
      ServiceToken: !GetAtt ConnectCasesResourcesFunction.Arn
      Kind: Template
      DomainId: !Ref CasesDomain
      Name: aicc-default-template
      LayoutId: !GetAtt CasesLayout.LayoutId
      RequiredFieldIds:
        - !GetAtt CasesFieldPhone.FieldId

  # ============================================================
  # PHASE 8: IntegrationAssociations
  # ============================================================
  IaLexBot:
    Type: AWS::Connect::IntegrationAssociation
    DependsOn: [ConnectInstanceActiveWait, LexBotAlias]
    Properties:
      InstanceId: !Ref ConnectInstance
      IntegrationType: LEX_BOT
      IntegrationArn: !GetAtt LexBotAlias.Arn

  IaRagFn:
    Type: AWS::Connect::IntegrationAssociation
    DependsOn: ConnectInstanceActiveWait
    Properties:
      InstanceId: !Ref ConnectInstance
      IntegrationType: LAMBDA_FUNCTION
      IntegrationArn: !GetAtt RagFulfilmentFunction.Arn

  IaMultiIntentFn:
    Type: AWS::Connect::IntegrationAssociation
    DependsOn: ConnectInstanceActiveWait
    Properties:
      InstanceId: !Ref ConnectInstance
      IntegrationType: LAMBDA_FUNCTION
      IntegrationArn: !GetAtt MultiIntentFunction.Arn

  IaMultimodalFn:
    Type: AWS::Connect::IntegrationAssociation
    DependsOn: ConnectInstanceActiveWait
    Properties:
      InstanceId: !Ref ConnectInstance
      IntegrationType: LAMBDA_FUNCTION
      IntegrationArn: !GetAtt MultimodalDescribeFunction.Arn

  IaOutboundCallbackFn:
    Type: AWS::Connect::IntegrationAssociation
    DependsOn: ConnectInstanceActiveWait
    Properties:
      InstanceId: !Ref ConnectInstance
      IntegrationType: LAMBDA_FUNCTION
      IntegrationArn: !GetAtt OutboundCallbackFunction.Arn

  IaLandlineCallbackFn:
    Type: AWS::Connect::IntegrationAssociation
    DependsOn: ConnectInstanceActiveWait
    Properties:
      InstanceId: !Ref ConnectInstance
      IntegrationType: LAMBDA_FUNCTION
      IntegrationArn: !GetAtt LandlineCallbackFunction.Arn

  IaProfileBuilderTriggerFn:
    Type: AWS::Connect::IntegrationAssociation
    DependsOn: ConnectInstanceActiveWait
    Properties:
      InstanceId: !Ref ConnectInstance
      IntegrationType: LAMBDA_FUNCTION
      IntegrationArn: !GetAtt ProfileBuilderTriggerFunction.Arn

  IaPhotoWatcherFn:
    Type: AWS::Connect::IntegrationAssociation
    DependsOn: ConnectInstanceActiveWait
    Properties:
      InstanceId: !Ref ConnectInstance
      IntegrationType: LAMBDA_FUNCTION
      IntegrationArn: !GetAtt PhotoWatcherFunction.Arn

  IaLocalizerFn:
    Type: AWS::Connect::IntegrationAssociation
    DependsOn: ConnectInstanceActiveWait
    Properties:
      InstanceId: !Ref ConnectInstance
      IntegrationType: LAMBDA_FUNCTION
      IntegrationArn: !GetAtt LocalizerFunction.Arn

  IaLanguageDetectFn:
    Type: AWS::Connect::IntegrationAssociation
    DependsOn: ConnectInstanceActiveWait
    Properties:
      InstanceId: !Ref ConnectInstance
      IntegrationType: LAMBDA_FUNCTION
      IntegrationArn: !GetAtt LanguageDetectFunction.Arn


  IaCasesDomain:
    Type: AWS::Connect::IntegrationAssociation
    DependsOn: [ConnectInstanceActiveWait, CasesDomain]
    Properties:
      InstanceId: !Ref ConnectInstance
      IntegrationType: CASES_DOMAIN
      IntegrationArn: !GetAtt CasesDomain.DomainArn

  # ============================================================
  # PHASE 9: Contact flows
  # ============================================================
  MainContactFlow:
    Type: AWS::Connect::ContactFlow
    DependsOn: [IaLexBot, IaRagFn, IaMultiIntentFn, IaMultimodalFn, IaCasesDomain, IaOutboundCallbackFn, IaLandlineCallbackFn, IaProfileBuilderTriggerFn, IaPhotoWatcherFn, IaLocalizerFn, HoldMusicPromptLookup, BasicQueueLookup]
    Properties:
      InstanceArn: !GetAtt ConnectInstance.Arn
      Name: ndx-try-aicc-main-flow
      Type: CONTACT_FLOW
      Content: !Sub
        - |
          {
            "Version": "2019-10-30",
            "StartAction": "Enable flow logging",
          "Metadata": {
            "entryPointPosition": { "x": 20, "y": 20 },
            "ActionMetadata": {
              "Enable flow logging": { "isFriendlyName": true, "position": { "x": 20, "y": 80 } },
              "Enable call recording": { "isFriendlyName": true, "position": { "x": 340, "y": 80 } },
              "Build customer profile async": { "isFriendlyName": true, "position": { "x": 660, "y": 80 } },
              "Set en GB language": { "isFriendlyName": true, "position": { "x": 980, "y": 80 } },
              "Set Amy en GB voice": { "isFriendlyName": true, "position": { "x": 1300, "y": 80 } },
              "Greet and get intent via Lex": { "isFriendlyName": true, "position": { "x": 1620, "y": 80 } },
              "Bedrock RAG fulfilment": { "isFriendlyName": true, "position": { "x": 1940, "y": 80 } },
              "Should disconnect": { "isFriendlyName": true, "position": { "x": 2260, "y": 80 } },
              "Awaiting photo upload": { "isFriendlyName": true, "position": { "x": 2580, "y": 80 } },
              "Tell caller to use simulator": { "isFriendlyName": true, "position": { "x": 2580, "y": 280 } },
              "Hold music poll 1 of 3": { "isFriendlyName": true, "position": { "x": 2580, "y": 480 } },
              "Poll for photo 1 of 3": { "isFriendlyName": true, "position": { "x": 2580, "y": 680 } },
              "Photo received 1 of 3": { "isFriendlyName": true, "position": { "x": 2580, "y": 880 } },
              "Hold music poll 2 of 3": { "isFriendlyName": true, "position": { "x": 2580, "y": 1080 } },
              "Poll for photo 2 of 3": { "isFriendlyName": true, "position": { "x": 2580, "y": 1280 } },
              "Photo received 2 of 3": { "isFriendlyName": true, "position": { "x": 2580, "y": 1480 } },
              "Hold music poll 3 of 3": { "isFriendlyName": true, "position": { "x": 2580, "y": 1680 } },
              "Poll for photo 3 of 3": { "isFriendlyName": true, "position": { "x": 2580, "y": 1880 } },
              "Photo received 3 of 3": { "isFriendlyName": true, "position": { "x": 2580, "y": 2080 } },
              "Read back photo case": { "isFriendlyName": true, "position": { "x": 2580, "y": 2280 } },
              "Photo timeout message": { "isFriendlyName": true, "position": { "x": 2900, "y": 2280 } },
              "Safeguarding flag set": { "isFriendlyName": true, "position": { "x": 2900, "y": 80 } },
              "Acknowledge urgent intent": { "isFriendlyName": true, "position": { "x": 2900, "y": 280 } },
              "Set basic queue": { "isFriendlyName": true, "position": { "x": 2900, "y": 480 } },
              "Any agent available": { "isFriendlyName": true, "position": { "x": 2900, "y": 680 } },
              "Tell caller transferring": { "isFriendlyName": true, "position": { "x": 3220, "y": 680 } },
              "Transfer to queue": { "isFriendlyName": true, "position": { "x": 3220, "y": 880 } },
              "Needs landline fallback": { "isFriendlyName": true, "position": { "x": 2900, "y": 880 } },
              "Ask for landline number": { "isFriendlyName": true, "position": { "x": 2900, "y": 1080 } },
              "Trigger landline callback": { "isFriendlyName": true, "position": { "x": 2900, "y": 1280 } },
              "Promise callback": { "isFriendlyName": true, "position": { "x": 3220, "y": 1080 } },
              "Trigger outbound callback": { "isFriendlyName": true, "position": { "x": 3220, "y": 1280 } },
              "Read back answer": { "isFriendlyName": true, "position": { "x": 3540, "y": 1280 } },
              "Speak and re listen via Lex": { "isFriendlyName": true, "position": { "x": 3220, "y": 80 } },
              "Fallback acknowledgement": { "isFriendlyName": true, "position": { "x": 1940, "y": 280 } },
              "Goodbye message": { "isFriendlyName": true, "position": { "x": 3540, "y": 80 } },
              "Disconnect": { "isFriendlyName": true, "position": { "x": 3860, "y": 80 } },
              "Apply caller voice": { "isFriendlyName": true, "position": { "x": 2260, "y": -120 } },
              "Set Lex locale": { "isFriendlyName": true, "position": { "x": 2260, "y": -340 } },
              "Start customer media stream": { "isFriendlyName": true, "position": { "x": 1480, "y": 80 } },
              "Detect language": { "isFriendlyName": true, "position": { "x": 1820, "y": 80 } },
              "Stop customer media stream": { "isFriendlyName": true, "position": { "x": 2120, "y": 80 } },
              "Get photo timeout text": { "isFriendlyName": true, "position": { "x": 2900, "y": 2080 } },
              "Get transferring text": { "isFriendlyName": true, "position": { "x": 3540, "y": 680 } },
              "Get promise callback text": { "isFriendlyName": true, "position": { "x": 3540, "y": 1080 } },
              "Get goodbye text": { "isFriendlyName": true, "position": { "x": 3540, "y": -120 } },
              "Get fallback ack text": { "isFriendlyName": true, "position": { "x": 1940, "y": 80 } },
              "Get ask landline text": { "isFriendlyName": true, "position": { "x": 3220, "y": 1080 } }
            }
          },
            "Actions": [
              {
                "Identifier": "Enable flow logging",
                "Type": "UpdateFlowLoggingBehavior",
                "Parameters": { "FlowLoggingBehavior": "Enabled" },
                "Transitions": { "NextAction": "Enable call recording" }
              },
              {
                "Identifier": "Enable call recording",
                "Type": "UpdateContactRecordingAndAnalyticsBehavior",
                "Parameters": {
                  "VoiceBehavior": {
                    "VoiceRecordingBehavior": {
                      "RecordedParticipants": ["Customer", "Agent"],
                      "IVRRecordingBehavior": "Enabled"
                    },
                    "VoiceAnalyticsBehavior": {
                      "Enabled": "True",
                      "AnalyticsLanguage": "en-GB",
                      "ConversationalAnalyticsRedactionConfiguration": {
                        "Enabled": "True",
                        "RedactionResults": "RedactedAndOriginal",
                        "RedactionMaskMode": "EntityType"
                      },
                      "AnalyticsModes": ["RealTime"]
                    }
                  }
                },
                "Transitions": {
                  "NextAction": "Build customer profile async",
                  "Errors": [
                    { "ErrorType": "NoMatchingError", "NextAction": "Build customer profile async" },
                    { "ErrorType": "ChannelMismatch", "NextAction": "Build customer profile async" }
                  ]
                }
              },
              {
                "Identifier": "Build customer profile async",
                "Type": "InvokeLambdaFunction",
                "Parameters": {
                  "LambdaFunctionARN": "${ProfileBuilderTriggerArn}",
                  "InvocationTimeLimitSeconds": "5"
                },
                "Transitions": {
                  "NextAction": "Set en GB language",
                  "Errors": [{ "ErrorType": "NoMatchingError", "NextAction": "Set en GB language" }]
                }
              },
              {
                "Identifier": "Set en GB language",
                "Type": "UpdateContactAttributes",
                "Parameters": {
                  "Attributes": { "LanguageCode": "en_US" },
                  "TargetContact": "Current"
                },
                "Transitions": {
                  "NextAction": "Set Amy en GB voice",
                  "Errors": [{ "ErrorType": "NoMatchingError", "NextAction": "Set Amy en GB voice" }]
                }
              },
              {
                "Identifier": "Set Amy en GB voice",
                "Type": "UpdateContactTextToSpeechVoice",
                "Parameters": { "TextToSpeechEngine": "neural", "TextToSpeechVoice": "Amy" },
                "Transitions": {
                  "NextAction": "Start customer media stream",
                  "Errors": [{ "ErrorType": "NoMatchingError", "NextAction": "Start customer media stream" }]
                }
              },
              {
                "Identifier": "Start customer media stream",
                "Type": "UpdateContactMediaStreamingBehavior",
                "Parameters": {
                  "MediaStreamingState": "Enabled",
                  "MediaStreamType": "Audio",
                  "Participants": [
                    { "ParticipantType": "Customer", "MediaDirections": ["From"] }
                  ]
                },
                "Transitions": {
                  "NextAction": "Greet and get intent via Lex",
                  "Errors": [{ "ErrorType": "NoMatchingError", "NextAction": "Greet and get intent via Lex" }]
                }
              },
              {
                "Identifier": "Greet and get intent via Lex",
                "Type": "ConnectParticipantWithLexBot",
                "Parameters": {
                  "Text": "Hello, you've reached Aldershire District Council. This is an NDX:Try session. What can I help with?",
                  "LexV2Bot": { "AliasArn": "${LexBotAliasArn}" }
                },
                "Transitions": {
                  "NextAction": "Detect language",
                  "Errors": [
                    { "ErrorType": "NoMatchingError", "NextAction": "Detect language" },
                    { "ErrorType": "NoMatchingCondition", "NextAction": "Detect language" }
                  ]
                }
              },
              {
                "Identifier": "Detect language",
                "Type": "InvokeLambdaFunction",
                "Parameters": {
                  "LambdaFunctionARN": "${LanguageDetectArn}",
                  "InvocationTimeLimitSeconds": "8"
                },
                "Transitions": {
                  "NextAction": "Stop customer media stream",
                  "Errors": [{ "ErrorType": "NoMatchingError", "NextAction": "Stop customer media stream" }]
                }
              },
              {
                "Identifier": "Stop customer media stream",
                "Type": "UpdateContactMediaStreamingBehavior",
                "Parameters": {
                  "MediaStreamingState": "Disabled",
                  "MediaStreamType": "Audio",
                  "Participants": [
                    { "ParticipantType": "Customer", "MediaDirections": ["From"] }
                  ]
                },
                "Transitions": {
                  "NextAction": "Bedrock RAG fulfilment",
                  "Errors": [{ "ErrorType": "NoMatchingError", "NextAction": "Bedrock RAG fulfilment" }]
                }
              },
              {
                "Identifier": "Bedrock RAG fulfilment",
                "Type": "InvokeLambdaFunction",
                "Parameters": {
                  "LambdaFunctionARN": "${RagArn}",
                  "InvocationTimeLimitSeconds": "8",
                  "LambdaInvocationAttributes": {
                    "user_utterance": "$.Lex.SessionAttributes.lex_input_transcript",
                    "matched_intent": "$.Lex.IntentName",
                    "decomposed_json": "$.Lex.SessionAttributes.decomposed_intents_json",
                    "safeguarding": "$.Lex.SessionAttributes.safeguarding_flag",
                    "transcribe_transcript": "$.Attributes.TranscribeTranscript"
                  }
                },
                "Transitions": {
                  "NextAction": "Apply caller voice",
                  "Errors": [{ "ErrorType": "NoMatchingError", "NextAction": "Get fallback ack text" }]
                }
              },
              {
              "Identifier": "Apply caller voice",
              "Type": "UpdateContactTextToSpeechVoice",
              "Parameters": {
              "TextToSpeechEngine": "$.Attributes.PollyEngine",
              "TextToSpeechVoice": "$.Attributes.PollyVoice"
              },
              "Transitions": {
              "NextAction": "Set Lex locale",
              "Errors": [{ "ErrorType": "NoMatchingError", "NextAction": "Set Lex locale" }]
              }
              },
              {
                "Identifier": "Set Lex locale",
                "Type": "UpdateContactData",
                "Parameters": {
                  "LanguageCode": "$.Attributes.PollyLanguage",
                  "TargetContact": "Current"
                },
                "Transitions": {
                  "NextAction": "Should disconnect",
                  "Errors": [{ "ErrorType": "NoMatchingError", "NextAction": "Should disconnect" }]
                }
              },
              {
                "Identifier": "Should disconnect",
                "Type": "Compare",
                "Parameters": { "ComparisonValue": "$.External.should_disconnect" },
                "Transitions": {
                  "NextAction": "Awaiting photo upload",
                  "Conditions": [
                    {
                      "NextAction": "Read back answer",
                      "Condition": { "Operator": "Equals", "Operands": ["true"] }
                    }
                  ],
                  "Errors": [{ "ErrorType": "NoMatchingCondition", "NextAction": "Awaiting photo upload" }]
                }
              },
              {
                "Identifier": "Awaiting photo upload",
                "Type": "Compare",
                "Parameters": { "ComparisonValue": "$.External.awaits_photo" },
                "Transitions": {
                  "NextAction": "Safeguarding flag set",
                  "Conditions": [
                    {
                      "NextAction": "Tell caller to use simulator",
                      "Condition": { "Operator": "Equals", "Operands": ["true"] }
                    }
                  ],
                  "Errors": [{ "ErrorType": "NoMatchingCondition", "NextAction": "Safeguarding flag set" }]
                }
              },
              {
                "Identifier": "Tell caller to use simulator",
                "Type": "MessageParticipant",
                "Parameters": { "Text": "$.External.answer" },
                "Transitions": { "NextAction": "Hold music poll 1 of 3" }
              },
              {
                "Identifier": "Hold music poll 1 of 3",
                "Type": "MessageParticipant",
                "Parameters": { "PromptId": "${HoldMusicPromptArn}" },
                "Transitions": {
                  "NextAction": "Poll for photo 1 of 3",
                  "Errors": [{ "ErrorType": "NoMatchingError", "NextAction": "Poll for photo 1 of 3" }]
                }
              },
              {
                "Identifier": "Poll for photo 1 of 3",
                "Type": "InvokeLambdaFunction",
                "Parameters": {
                  "LambdaFunctionARN": "${PhotoWatcherArn}",
                  "InvocationTimeLimitSeconds": "8",
                  "LambdaInvocationAttributes": {
                    "customer_phone": "$.CustomerEndpoint.Address"
                  }
                },
                "Transitions": {
                  "NextAction": "Photo received 1 of 3",
                  "Errors": [{ "ErrorType": "NoMatchingError", "NextAction": "Hold music poll 2 of 3" }]
                }
              },
              {
                "Identifier": "Photo received 1 of 3",
                "Type": "Compare",
                "Parameters": { "ComparisonValue": "$.External.found" },
                "Transitions": {
                  "NextAction": "Hold music poll 2 of 3",
                  "Conditions": [
                    {
                      "NextAction": "Read back photo case",
                      "Condition": { "Operator": "Equals", "Operands": ["true"] }
                    }
                  ],
                  "Errors": [{ "ErrorType": "NoMatchingCondition", "NextAction": "Hold music poll 2 of 3" }]
                }
              },
              {
                "Identifier": "Hold music poll 2 of 3",
                "Type": "MessageParticipant",
                "Parameters": { "PromptId": "${HoldMusicPromptArn}" },
                "Transitions": {
                  "NextAction": "Poll for photo 2 of 3",
                  "Errors": [{ "ErrorType": "NoMatchingError", "NextAction": "Poll for photo 2 of 3" }]
                }
              },
              {
                "Identifier": "Poll for photo 2 of 3",
                "Type": "InvokeLambdaFunction",
                "Parameters": {
                  "LambdaFunctionARN": "${PhotoWatcherArn}",
                  "InvocationTimeLimitSeconds": "8",
                  "LambdaInvocationAttributes": {
                    "customer_phone": "$.CustomerEndpoint.Address"
                  }
                },
                "Transitions": {
                  "NextAction": "Photo received 2 of 3",
                  "Errors": [{ "ErrorType": "NoMatchingError", "NextAction": "Hold music poll 3 of 3" }]
                }
              },
              {
                "Identifier": "Photo received 2 of 3",
                "Type": "Compare",
                "Parameters": { "ComparisonValue": "$.External.found" },
                "Transitions": {
                  "NextAction": "Hold music poll 3 of 3",
                  "Conditions": [
                    {
                      "NextAction": "Read back photo case",
                      "Condition": { "Operator": "Equals", "Operands": ["true"] }
                    }
                  ],
                  "Errors": [{ "ErrorType": "NoMatchingCondition", "NextAction": "Hold music poll 3 of 3" }]
                }
              },
              {
                "Identifier": "Hold music poll 3 of 3",
                "Type": "MessageParticipant",
                "Parameters": { "PromptId": "${HoldMusicPromptArn}" },
                "Transitions": {
                  "NextAction": "Poll for photo 3 of 3",
                  "Errors": [{ "ErrorType": "NoMatchingError", "NextAction": "Poll for photo 3 of 3" }]
                }
              },
              {
                "Identifier": "Poll for photo 3 of 3",
                "Type": "InvokeLambdaFunction",
                "Parameters": {
                  "LambdaFunctionARN": "${PhotoWatcherArn}",
                  "InvocationTimeLimitSeconds": "8",
                  "LambdaInvocationAttributes": {
                    "customer_phone": "$.CustomerEndpoint.Address"
                  }
                },
                "Transitions": {
                  "NextAction": "Photo received 3 of 3",
                  "Errors": [{ "ErrorType": "NoMatchingError", "NextAction": "Get photo timeout text" }]
                }
              },
              {
                "Identifier": "Photo received 3 of 3",
                "Type": "Compare",
                "Parameters": { "ComparisonValue": "$.External.found" },
                "Transitions": {
                  "NextAction": "Get photo timeout text",
                  "Conditions": [
                    {
                      "NextAction": "Read back photo case",
                      "Condition": { "Operator": "Equals", "Operands": ["true"] }
                    }
                  ],
                  "Errors": [{ "ErrorType": "NoMatchingCondition", "NextAction": "Get photo timeout text" }]
                }
              },
              {
                "Identifier": "Read back photo case",
                "Type": "MessageParticipant",
                "Parameters": { "Text": "$.External.acknowledgement" },
                "Transitions": { "NextAction": "Get goodbye text" }
              },
              {
              "Identifier": "Get photo timeout text",
              "Type": "InvokeLambdaFunction",
              "Parameters": {
              "LambdaFunctionARN": "${LocalizerArn}",
              "InvocationTimeLimitSeconds": "5",
              "LambdaInvocationAttributes": {
              "key": "photo_timeout",
              "language": "$.Attributes.LanguageCode"
              }
              },
              "Transitions": {
              "NextAction": "Photo timeout message",
              "Errors": [{ "ErrorType": "NoMatchingError", "NextAction": "Photo timeout message" }]
              }
              },
              {
                "Identifier": "Photo timeout message",
                "Type": "MessageParticipant",
                "Parameters": { "Text": "$.External.text" },
                "Transitions": { "NextAction": "Disconnect" }
              },
              {
                "Identifier": "Safeguarding flag set",
                "Type": "Compare",
                "Parameters": { "ComparisonValue": "$.External.safeguarding" },
                "Transitions": {
                  "NextAction": "Speak and re listen via Lex",
                  "Conditions": [
                    {
                      "NextAction": "Acknowledge urgent intent",
                      "Condition": { "Operator": "Equals", "Operands": ["true"] }
                    }
                  ],
                  "Errors": [{ "ErrorType": "NoMatchingCondition", "NextAction": "Speak and re listen via Lex" }]
                }
              },
              {
                "Identifier": "Acknowledge urgent intent",
                "Type": "MessageParticipant",
                "Parameters": { "Text": "$.External.answer" },
                "Transitions": { "NextAction": "Set basic queue" }
              },
              {
                "Identifier": "Set basic queue",
                "Type": "UpdateContactTargetQueue",
                "Parameters": { "QueueId": "${BasicQueueArn}" },
                "Transitions": {
                  "NextAction": "Any agent available",
                  "Errors": [{ "ErrorType": "NoMatchingError", "NextAction": "Needs landline fallback" }]
                }
              },
              {
                "Identifier": "Any agent available",
                "Type": "CheckMetricData",
                "Parameters": { "MetricType": "NumberOfAgentsAvailable" },
                "Transitions": {
                  "NextAction": "Needs landline fallback",
                  "Conditions": [
                    {
                      "NextAction": "Get transferring text",
                      "Condition": { "Operator": "NumberGreaterThan", "Operands": ["0"] }
                    }
                  ],
                  "Errors": [
                    { "ErrorType": "NoMatchingError", "NextAction": "Needs landline fallback" },
                    { "ErrorType": "NoMatchingCondition", "NextAction": "Needs landline fallback" }
                  ]
                }
              },
              {
              "Identifier": "Get transferring text",
              "Type": "InvokeLambdaFunction",
              "Parameters": {
              "LambdaFunctionARN": "${LocalizerArn}",
              "InvocationTimeLimitSeconds": "5",
              "LambdaInvocationAttributes": {
              "key": "transferring",
              "language": "$.Attributes.LanguageCode"
              }
              },
              "Transitions": {
              "NextAction": "Tell caller transferring",
              "Errors": [{ "ErrorType": "NoMatchingError", "NextAction": "Tell caller transferring" }]
              }
              },
              {
                "Identifier": "Tell caller transferring",
                "Type": "MessageParticipant",
                "Parameters": { "Text": "$.External.text" },
                "Transitions": { "NextAction": "Transfer to queue" }
              },
              {
                "Identifier": "Transfer to queue",
                "Type": "TransferContactToQueue",
                "Parameters": {},
                "Transitions": {
                  "NextAction": "Disconnect",
                  "Errors": [
                    { "ErrorType": "NoMatchingError", "NextAction": "Needs landline fallback" },
                    { "ErrorType": "QueueAtCapacity", "NextAction": "Needs landline fallback" }
                  ]
                }
              },
              {
                "Identifier": "Needs landline fallback",
                "Type": "Compare",
                "Parameters": { "ComparisonValue": "$.External.needs_landline" },
                "Transitions": {
                  "NextAction": "Get promise callback text",
                  "Conditions": [
                    {
                      "NextAction": "Get ask landline text",
                      "Condition": { "Operator": "Equals", "Operands": ["true"] }
                    }
                  ],
                  "Errors": [{ "ErrorType": "NoMatchingCondition", "NextAction": "Get promise callback text" }]
                }
              },
              {
              "Identifier": "Get ask landline text",
              "Type": "InvokeLambdaFunction",
              "Parameters": {
              "LambdaFunctionARN": "${LocalizerArn}",
              "InvocationTimeLimitSeconds": "5",
              "LambdaInvocationAttributes": {
              "key": "ask_landline",
              "language": "$.Attributes.LanguageCode"
              }
              },
              "Transitions": {
              "NextAction": "Ask for landline number",
              "Errors": [{ "ErrorType": "NoMatchingError", "NextAction": "Ask for landline number" }]
              }
              },
              {
                "Identifier": "Ask for landline number",
                "Type": "ConnectParticipantWithLexBot",
                "Parameters": {
                  "Text": "$.External.text",
                  "LexV2Bot": { "AliasArn": "${LexBotAliasArn}" }
                },
                "Transitions": {
                  "NextAction": "Trigger landline callback",
                  "Errors": [
                    { "ErrorType": "NoMatchingError", "NextAction": "Read back answer" },
                    { "ErrorType": "NoMatchingCondition", "NextAction": "Trigger landline callback" }
                  ]
                }
              },
              {
                "Identifier": "Trigger landline callback",
                "Type": "InvokeLambdaFunction",
                "Parameters": {
                  "LambdaFunctionARN": "${LandlineCallbackArn}",
                  "InvocationTimeLimitSeconds": "8",
                  "LambdaInvocationAttributes": {
                    "user_utterance": "$.Lex.SessionAttributes.lex_input_transcript"
                  }
                },
                "Transitions": {
                  "NextAction": "Read back answer",
                  "Errors": [{ "ErrorType": "NoMatchingError", "NextAction": "Read back answer" }]
                }
              },
              {
              "Identifier": "Get promise callback text",
              "Type": "InvokeLambdaFunction",
              "Parameters": {
              "LambdaFunctionARN": "${LocalizerArn}",
              "InvocationTimeLimitSeconds": "5",
              "LambdaInvocationAttributes": {
              "key": "promise_callback",
              "language": "$.Attributes.LanguageCode"
              }
              },
              "Transitions": {
              "NextAction": "Promise callback",
              "Errors": [{ "ErrorType": "NoMatchingError", "NextAction": "Promise callback" }]
              }
              },
              {
                "Identifier": "Promise callback",
                "Type": "MessageParticipant",
                "Parameters": { "Text": "$.External.text" },
                "Transitions": { "NextAction": "Trigger outbound callback" }
              },
              {
                "Identifier": "Trigger outbound callback",
                "Type": "InvokeLambdaFunction",
                "Parameters": {
                  "LambdaFunctionARN": "${OutboundCallbackArn}",
                  "InvocationTimeLimitSeconds": "3"
                },
                "Transitions": {
                  "NextAction": "Disconnect",
                  "Errors": [{ "ErrorType": "NoMatchingError", "NextAction": "Disconnect" }]
                }
              },
              {
                "Identifier": "Read back answer",
                "Type": "MessageParticipant",
                "Parameters": { "Text": "$.External.answer" },
                "Transitions": { "NextAction": "Disconnect" }
              },
              {
                "Identifier": "Speak and re listen via Lex",
                "Type": "ConnectParticipantWithLexBot",
                "Parameters": {
                  "Text": "$.External.prompt",
                  "LexV2Bot": { "AliasArn": "${LexBotAliasArn}" }
                },
                "Transitions": {
                  "NextAction": "Bedrock RAG fulfilment",
                  "Conditions": [
                    {
                      "NextAction": "Get goodbye text",
                      "Condition": {
                        "Operator": "Equals",
                        "Operands": ["GoodbyeIntent"]
                      }
                    }
                  ],
                  "Errors": [
                    { "ErrorType": "NoMatchingError", "NextAction": "Get goodbye text" },
                    { "ErrorType": "NoMatchingCondition", "NextAction": "Bedrock RAG fulfilment" }
                  ]
                }
              },
              {
              "Identifier": "Get fallback ack text",
              "Type": "InvokeLambdaFunction",
              "Parameters": {
              "LambdaFunctionARN": "${LocalizerArn}",
              "InvocationTimeLimitSeconds": "5",
              "LambdaInvocationAttributes": {
              "key": "fallback_ack",
              "language": "$.Attributes.LanguageCode"
              }
              },
              "Transitions": {
              "NextAction": "Fallback acknowledgement",
              "Errors": [{ "ErrorType": "NoMatchingError", "NextAction": "Fallback acknowledgement" }]
              }
              },
              {
                "Identifier": "Fallback acknowledgement",
                "Type": "MessageParticipant",
                "Parameters": { "Text": "$.External.text" },
                "Transitions": { "NextAction": "Get goodbye text" }
              },
              {
              "Identifier": "Get goodbye text",
              "Type": "InvokeLambdaFunction",
              "Parameters": {
              "LambdaFunctionARN": "${LocalizerArn}",
              "InvocationTimeLimitSeconds": "5",
              "LambdaInvocationAttributes": {
              "key": "goodbye",
              "language": "$.Attributes.LanguageCode"
              }
              },
              "Transitions": {
              "NextAction": "Goodbye message",
              "Errors": [{ "ErrorType": "NoMatchingError", "NextAction": "Goodbye message" }]
              }
              },
              {
                "Identifier": "Goodbye message",
                "Type": "MessageParticipant",
                "Parameters": { "Text": "$.External.text" },
                "Transitions": { "NextAction": "Disconnect" }
              },
              {
                "Identifier": "Disconnect",
                "Type": "DisconnectParticipant",
                "Parameters": {},
                "Transitions": {}
              }
            ]
          }
        - LexBotAliasArn: !GetAtt LexBotAlias.Arn
          LocalizerArn: !GetAtt LocalizerFunction.Arn
          LanguageDetectArn: !GetAtt LanguageDetectFunction.Arn
          RagArn: !GetAtt RagFulfilmentFunction.Arn
          OutboundCallbackArn: !GetAtt OutboundCallbackFunction.Arn
          LandlineCallbackArn: !GetAtt LandlineCallbackFunction.Arn
          BasicQueueArn: !GetAtt BasicQueueLookup.Arn
          ProfileBuilderTriggerArn: !GetAtt ProfileBuilderTriggerFunction.Arn
          PhotoWatcherArn: !GetAtt PhotoWatcherFunction.Arn
          HoldMusicPromptArn: !GetAtt HoldMusicPromptLookup.Arn

  DisconnectContactFlow:
    Type: AWS::Connect::ContactFlow
    Properties:
      InstanceArn: !GetAtt ConnectInstance.Arn
      Name: ndx-try-aicc-disconnect-flow
      Type: CONTACT_FLOW
      Content: !Sub
        - |
          {
            "Version": "2019-10-30",
            "StartAction": "Apologise for fault",
            "Metadata": {
              "entryPointPosition": {
                "x": 20,
                "y": 20
              },
              "ActionMetadata": {
                "Apologise for fault": {
                  "isFriendlyName": true,
                  "position": {
                    "x": 20,
                    "y": 80
                  }
                },
                "Disconnect on error": {
                  "isFriendlyName": true,
                  "position": {
                    "x": 340,
                    "y": 80
                  }
                },
                "Get apology text": {
                  "isFriendlyName": true,
                  "position": {
                    "x": -220,
                    "y": 80
                  }
                }
              }
            },
            "Actions": [
              {
                "Identifier": "Get apology text",
                "Type": "InvokeLambdaFunction",
                "Parameters": {
                  "LambdaFunctionARN": "${LocalizerArn}",
                  "InvocationTimeLimitSeconds": "5",
                  "LambdaInvocationAttributes": {
                    "key": "disconnect_apology",
                    "language": "$.Attributes.LanguageCode"
                  }
                },
                "Transitions": {
                  "NextAction": "Apologise for fault",
                  "Errors": [
                    {
                      "ErrorType": "NoMatchingError",
                      "NextAction": "Apologise for fault"
                    }
                  ]
                }
              },
              {
                "Identifier": "Apologise for fault",
                "Type": "MessageParticipant",
                "Parameters": {
                  "Text": "$.External.text"
                },
                "Transitions": {
                  "NextAction": "Disconnect on error"
                }
              },
              {
                "Identifier": "Disconnect on error",
                "Type": "DisconnectParticipant",
                "Parameters": {},
                "Transitions": {}
              }
            ]
          }
        
        - LocalizerArn: !GetAtt LocalizerFunction.Arn

  CallbackSimulationFlow:
    Type: AWS::Connect::ContactFlow
    Properties:
      InstanceArn: !GetAtt ConnectInstance.Arn
      Name: ndx-try-aicc-callback-simulation
      Type: CONTACT_FLOW
      Content: !Sub
        - |
          {
            "Version": "2019-10-30",
            "StartAction": "Set Amy en GB voice",
            "Metadata": {
              "entryPointPosition": {
                "x": 20,
                "y": 20
              },
              "ActionMetadata": {
                "Set Amy en GB voice": {
                  "isFriendlyName": true,
                  "position": {
                    "x": 20,
                    "y": 80
                  }
                },
                "Speak callback message": {
                  "isFriendlyName": true,
                  "position": {
                    "x": 340,
                    "y": 80
                  }
                },
                "Disconnect": {
                  "isFriendlyName": true,
                  "position": {
                    "x": 660,
                    "y": 80
                  }
                },
                "Get callback simulation text": {
                  "isFriendlyName": true,
                  "position": {
                    "x": -220,
                    "y": 80
                  }
                }
              }
            },
            "Actions": [
              {
                "Identifier": "Set Amy en GB voice",
                "Type": "UpdateContactTextToSpeechVoice",
                "Parameters": {
                  "TextToSpeechEngine": "neural",
                  "TextToSpeechVoice": "Amy"
                },
                "Transitions": {
                  "NextAction": "Get callback simulation text",
                  "Errors": [
                    {
                      "ErrorType": "NoMatchingError",
                      "NextAction": "Get callback simulation text"
                    }
                  ]
                }
              },
              {
                "Identifier": "Get callback simulation text",
                "Type": "InvokeLambdaFunction",
                "Parameters": {
                  "LambdaFunctionARN": "${LocalizerArn}",
                  "InvocationTimeLimitSeconds": "5",
                  "LambdaInvocationAttributes": {
                    "key": "callback_simulation",
                    "language": "$.Attributes.LanguageCode"
                  }
                },
                "Transitions": {
                  "NextAction": "Speak callback message",
                  "Errors": [
                    {
                      "ErrorType": "NoMatchingError",
                      "NextAction": "Speak callback message"
                    }
                  ]
                }
              },
              {
                "Identifier": "Speak callback message",
                "Type": "MessageParticipant",
                "Parameters": {
                  "Text": "$.External.text"
                },
                "Transitions": {
                  "NextAction": "Disconnect"
                }
              },
              {
                "Identifier": "Disconnect",
                "Type": "DisconnectParticipant",
                "Parameters": {},
                "Transitions": {}
              }
            ]
          }
        - LocalizerArn: !GetAtt LocalizerFunction.Arn

  PhotoWatcherFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'ndx-try-aicc-photo-watcher-${AWS::Region}'
      CodeUri: lambdas/photo-watcher/
      Handler: index.lambda_handler
      # Long-poll: holds the line while caller uses the simulator. Contact-flow
      # InvokeLambda action caps at 8s per call so we set Lambda timeout slightly
      # above that to allow internal poll loops + Connect-side retries.
      Timeout: 9
      Role: !GetAtt CommonLambdaRole.Arn
      Environment:
        Variables:
          DDB_TABLE_NAME: !Ref ContactLensCacheTable

  OutboundCallbackFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'ndx-try-aicc-outbound-callback-${AWS::Region}'
      CodeUri: lambdas/outbound-callback/
      Handler: index.lambda_handler
      Timeout: 15
      Role: !GetAtt CommonLambdaRole.Arn
      Environment:
        Variables:
          INSTANCE_ID: !Ref ConnectInstance
          CALLBACK_FLOW_ID: !Ref CallbackSimulationFlow
          SOURCE_PHONE_NUMBER: !GetAtt GeoNumber.Address

  LandlineCallbackFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'ndx-try-aicc-landline-callback-${AWS::Region}'
      CodeUri: lambdas/landline-callback/
      Handler: index.lambda_handler
      Timeout: 15
      Role: !GetAtt CommonLambdaRole.Arn
      Environment:
        Variables:
          OUTBOUND_FN_NAME: !Ref OutboundCallbackFunction

  ProfileBuilderFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'ndx-try-aicc-profile-builder-${AWS::Region}'
      CodeUri: lambdas/profile-builder/
      Handler: index.lambda_handler
      Timeout: 90
      MemorySize: 1024
      Role: !GetAtt CommonLambdaRole.Arn
      Environment:
        Variables:
          CUSTOMER_PROFILES_DOMAIN: !Ref CustomerProfilesDomain
          PROFILE_MODEL_ID: !Ref GenerationModelId
          CASES_DOMAIN_ID: !Ref CasesDomain
          CASES_TEMPLATE_ID: !Ref CasesTemplate

  ProfileBuilderTriggerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'ndx-try-aicc-profile-trigger-${AWS::Region}'
      CodeUri: lambdas/profile-builder-trigger/
      Handler: index.lambda_handler
      Timeout: 6
      Role: !GetAtt CommonLambdaRole.Arn
      Environment:
        Variables:
          CUSTOMER_PROFILES_DOMAIN: !Ref CustomerProfilesDomain
          PROFILE_BUILDER_FN: !Ref ProfileBuilderFunction

  # ============================================================
  # PHASE 12: Q in Connect (Wisdom) Assistant + KB
  # ============================================================
  WisdomAssistant:
    Type: AWS::Wisdom::Assistant
    Properties:
      Name: !Sub 'ndx-try-aicc-assistant-${AWS::Region}'
      Type: AGENT
      Description: Aldershire DC AI agent assist (Q in Connect)

  WisdomKnowledgeBase:
    Type: AWS::Wisdom::KnowledgeBase
    Properties:
      Name: !Sub 'ndx-try-aicc-qkb-${AWS::Region}'
      KnowledgeBaseType: CUSTOM
      Description: Aldershire DC service docs for live agent suggestions

  WisdomAssistantAssociation:
    Type: AWS::Wisdom::AssistantAssociation
    Properties:
      AssistantId: !GetAtt WisdomAssistant.AssistantId
      AssociationType: KNOWLEDGE_BASE
      Association:
        KnowledgeBaseId: !GetAtt WisdomKnowledgeBase.KnowledgeBaseId

  WisdomAnswerAgent:
    Type: AWS::Wisdom::AIAgent
    DependsOn: WisdomAssistantAssociation
    Properties:
      AssistantId: !GetAtt WisdomAssistant.AssistantId
      Name: !Sub 'ndx-try-aicc-answer-agent-${AWS::Region}'
      Type: ANSWER_RECOMMENDATION
      Description: Answer generation agent over the Aldershire DC KB
      Configuration:
        AnswerRecommendationAIAgentConfiguration:
          AssociationConfigurations:
            - AssociationType: KNOWLEDGE_BASE
              AssociationId: !GetAtt WisdomKnowledgeBase.KnowledgeBaseId

  IaWisdomAssistant:
    Type: Custom::ConnectBootstrap
    DependsOn: [ConnectInstanceActiveWait, WisdomAssistant, ConnectBootstrapFunction]
    Properties:
      ServiceToken: !GetAtt ConnectBootstrapFunction.Arn
      Action: ConnectIntegrationAssociation
      InstanceId: !Ref ConnectInstance
      IntegrationType: WISDOM_ASSISTANT
      IntegrationArn: !GetAtt WisdomAssistant.AssistantArn

  IaWisdomKnowledgeBase:
    Type: Custom::ConnectBootstrap
    DependsOn: [ConnectInstanceActiveWait, WisdomKnowledgeBase, ConnectBootstrapFunction]
    Properties:
      ServiceToken: !GetAtt ConnectBootstrapFunction.Arn
      Action: ConnectIntegrationAssociation
      InstanceId: !Ref ConnectInstance
      IntegrationType: WISDOM_KNOWLEDGE_BASE
      IntegrationArn: !GetAtt WisdomKnowledgeBase.KnowledgeBaseArn

  # ============================================================
  # PHASE 13: Connect / Wisdom / CP bootstrap (custom resources)
  # ============================================================
  ConnectBootstrapFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'ndx-try-aicc-connect-bootstrap-${AWS::Region}'
      CodeUri: lambdas/connect-bootstrap/
      Handler: index.handler
      Timeout: 600
      MemorySize: 512
      Role: !GetAtt CustomResourceLambdaRole.Arn

  AgentSecurityProfilePermissions:
    Type: Custom::ConnectBootstrap
    DependsOn: [ConnectInstanceActiveWait, IaWisdomAssistant, IaWisdomKnowledgeBase, IaCustomerProfilesIntegration]
    Properties:
      ServiceToken: !GetAtt ConnectBootstrapFunction.Arn
      Action: AgentSecurityProfilePermissions
      InstanceId: !Ref ConnectInstance
      SecurityProfileName: Agent
      Permissions:
        - BasicAgentAccess
        - OutboundCallAccess
        - OutboundEmail.Create
        - CustomerProfiles.View
        - CustomerProfiles.Edit
        - Cases.View
        - Cases.Create
        - Cases.Edit
        - Wisdom.View
        - ContentManagement.View
        - QConnectAIAgents.View
        - QConnectAIPrompts.View

  HoldMusicPromptLookup:
    Type: Custom::ConnectBootstrap
    DependsOn: ConnectInstanceActiveWait
    Properties:
      ServiceToken: !GetAtt ConnectBootstrapFunction.Arn
      Action: LookupPrompt
      InstanceId: !Ref ConnectInstance
      PromptName: CustomerQueue.wav

  BasicQueueLookup:
    Type: Custom::ConnectBootstrap
    DependsOn: ConnectInstanceActiveWait
    Properties:
      ServiceToken: !GetAtt ConnectBootstrapFunction.Arn
      Action: LookupQueue
      InstanceId: !Ref ConnectInstance
      QueueName: BasicQueue

  CustomerProfilesNoInferredObjectType:
    Type: Custom::ConnectBootstrap
    DependsOn: [CustomerProfilesDomain, ConnectBootstrapFunction]
    Properties:
      ServiceToken: !GetAtt ConnectBootstrapFunction.Arn
      Action: CustomerProfilesObjectType
      DomainName: !Ref CustomerProfilesDomain
      TemplateId: CTR-NoInferred
      ObjectTypeName: CTRNoInferred

  IaCustomerProfilesIntegration:
    Type: Custom::ConnectBootstrap
    DependsOn: [ConnectInstanceActiveWait, CustomerProfilesDomain]
    Properties:
      ServiceToken: !GetAtt ConnectBootstrapFunction.Arn
      Action: CustomerProfilesPutIntegration
      DomainName: !Ref CustomerProfilesDomain
      InstanceArn: !GetAtt ConnectInstance.Arn
      # The CCP / Agent Workspace Customer Profiles widget specifically requires
      # ObjectTypeName=CTR — anything else surfaces "feature hasn't been set up
      # for your organization" in the agent UI. Duplicate-prevention happens in
      # ProfileBuilder Lambda's _upsert_profile: it search_profiles by _phone
      # first, then updates the existing one rather than creating a second.
      # CTR fires post-call so by then the rich profile already exists.
      ObjectTypeName: CTR

  WisdomContentUploader:
    Type: Custom::ConnectBootstrap
    DependsOn: [WisdomKnowledgeBase, KbSourceBucket]
    Properties:
      ServiceToken: !GetAtt ConnectBootstrapFunction.Arn
      Action: WisdomContentUpload
      KnowledgeBaseId: !GetAtt WisdomKnowledgeBase.KnowledgeBaseId
      SourceBucket: !Ref KbSourceBucket
      SourcePrefix: ''
      # CorpusVersion is a forcing field: bump it after every `aws s3 sync documents/`
      # so this custom resource re-fires and the Lambda picks up new docs.
      CorpusVersion: !Ref CorpusVersion

  WisdomDefaultAnswerAgent:
    Type: Custom::ConnectBootstrap
    DependsOn: [WisdomAnswerAgent, ConnectBootstrapFunction]
    Properties:
      ServiceToken: !GetAtt ConnectBootstrapFunction.Arn
      Action: WisdomDefaultAIAgent
      AssistantId: !GetAtt WisdomAssistant.AssistantId
      AIAgentId: !GetAtt WisdomAnswerAgent.AIAgentId
      AIAgentType: ANSWER_RECOMMENDATION

  GeoFlowAssoc:
    Type: Custom::PhoneFlowAssoc
    DependsOn: [GeoNumber, MainContactFlow]
    Properties:
      ServiceToken: !GetAtt PhoneFlowAssocFunction.Arn
      PhoneNumberId: !Ref GeoNumber
      InstanceId: !Ref ConnectInstance
      ContactFlowId: !Ref MainContactFlow

  # ============================================================
  # PHASE 10: Contact Lens streaming
  # ============================================================
  ContactLensStream:
    Type: AWS::Kinesis::Stream
    Properties:
      Name: !Sub 'ndx-try-aicc-cl-${AWS::Region}'
      ShardCount: 1
      RetentionPeriodHours: 24
      StreamEncryption:
        EncryptionType: KMS
        KeyId: alias/aws/kinesis

  ContactLensDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'ndx-try-aicc-cl-dlq-${AWS::Region}'
      MessageRetentionPeriod: 1209600
      KmsMasterKeyId: alias/aws/sqs

  ContactLensDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'ndx-try-aicc-cl-dlq-depth-${AWS::Region}'
      MetricName: ApproximateNumberOfMessagesVisible
      Namespace: AWS/SQS
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - { Name: QueueName, Value: !GetAtt ContactLensDlq.QueueName }
      TreatMissingData: notBreaching

  # AWS::Connect::InstanceStorageConfig.ResourceType doesn't include
  # REAL_TIME_CONTACT_ANALYSIS_SEGMENTS in CFN (the connect API supports it).
  # Use a custom resource that calls AssociateInstanceStorageConfig directly.
  ConnectStorageConfigFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'ndx-try-aicc-storage-cr-${AWS::Region}'
      CodeUri: lambdas/connect-storage-config/
      Handler: index.handler
      Timeout: 60
      Role: !GetAtt CustomResourceLambdaRole.Arn

  ConnectKinesisStreamConfig:
    Type: Custom::ConnectStorageConfig
    DependsOn: [ConnectInstanceActiveWait, ContactLensStream]
    Properties:
      ServiceToken: !GetAtt ConnectStorageConfigFunction.Arn
      InstanceId: !Ref ConnectInstance
      ResourceType: REAL_TIME_CONTACT_ANALYSIS_SEGMENTS
      StorageConfig:
        StorageType: KINESIS_STREAM
        KinesisStreamConfig: { StreamArn: !GetAtt ContactLensStream.Arn }

  RecordingsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'ndx-try-aicc-recordings-${AWS::AccountId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - { Id: ExpireRecordings, Status: Enabled, ExpirationInDays: 7 }

  RecordingsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref RecordingsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowConnectServicePut
            Effect: Allow
            Principal: { Service: connect.amazonaws.com }
            Action: [s3:PutObject, s3:PutObjectAcl, s3:GetBucketLocation]
            Resource:
              - !Sub '${RecordingsBucket.Arn}/*'
              - !GetAtt RecordingsBucket.Arn
            Condition:
              StringEquals: { 'aws:SourceAccount': !Ref 'AWS::AccountId' }
              ArnEquals: { 'aws:SourceArn': !GetAtt ConnectInstance.Arn }

  ConnectCallRecordingStorage:
    Type: AWS::Connect::InstanceStorageConfig
    DependsOn: [ConnectInstanceActiveWait, RecordingsBucket, RecordingsBucketPolicy]
    Properties:
      InstanceArn: !GetAtt ConnectInstance.Arn
      ResourceType: CALL_RECORDINGS
      StorageType: S3
      S3Config:
        BucketName: !Ref RecordingsBucket
        BucketPrefix: recordings

  # Real-time customer audio is streamed into KVS while a call is in
  # progress. The language-detect Lambda reads from the per-contact stream
  # during turn 1 so we can run Transcribe with IdentifyLanguage and tell what
  # language the caller is speaking (Lex's ASR is locale-locked and produces
  # phonetic-English nonsense for non-English audio, so the en_US Lex
  # transcript can't be used for language detection on its own).
  #
  # Connect creates one KVS stream per contact under the configured Prefix.
  ConnectMediaStreamsStorage:
    Type: AWS::Connect::InstanceStorageConfig
    DependsOn: ConnectInstanceActiveWait
    Properties:
      InstanceArn: !GetAtt ConnectInstance.Arn
      ResourceType: MEDIA_STREAMS
      StorageType: KINESIS_VIDEO_STREAM
      KinesisVideoStreamConfig:
        Prefix: ndx-try-aicc
        RetentionPeriodHours: 24
        EncryptionConfig:
          EncryptionType: KMS
          KeyId: alias/aws/kinesisvideo

  ContactLensCacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'ndx-try-aicc-contact-lens-cache-${AWS::Region}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: contactId,        AttributeType: S }
        - { AttributeName: segmentTimestamp, AttributeType: N }
      KeySchema:
        - { AttributeName: contactId,        KeyType: HASH }
        - { AttributeName: segmentTimestamp, KeyType: RANGE }
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }
      SSESpecification: { SSEEnabled: true }

  # ============================================================
  # PHASE 10b: Companion SPA deploy (index.html, app.js, styles.css)
  # ============================================================
  DeploySpaFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'ndx-try-aicc-deploy-spa-${AWS::Region}'
      CodeUri: lambdas/deploy-spa/
      Handler: index.handler
      Timeout: 60
      Role: !GetAtt CustomResourceLambdaRole.Arn

  DeploySpaInvocation:
    Type: Custom::DeploySpa
    DependsOn: [SpaBucket, SpaBucketPolicy]
    Properties:
      ServiceToken: !GetAtt DeploySpaFunction.Arn
      SpaBucket: !Ref SpaBucket

  # ============================================================
  # PHASE 11: Companion UI hosting + WAF
  # ============================================================
  SpaBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'ndx-try-aicc-spa-${AWS::AccountId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  UploadBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'ndx-try-aicc-uploads-${AWS::AccountId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - { Id: ExpireUploads, Status: Enabled, ExpirationInDays: 1, Prefix: uploads/ }
      CorsConfiguration:
        CorsRules:
          # AllowedOrigins is static (CloudFront wildcard) to avoid circular
          # dependency on Cdn. The Companion API Lambda re-validates the origin
          # at runtime against the same CloudFront pattern.
          - AllowedHeaders: ["*"]
            AllowedMethods: [GET, PUT]
            AllowedOrigins: ["https://*.cloudfront.net"]
            ExposedHeaders: [ETag]
            MaxAge: 3000

  ShareBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'ndx-try-aicc-share-${AWS::AccountId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - { Id: ExpireSharePdfs, Status: Enabled, ExpirationInDays: 1, Prefix: share-pdfs/ }

  Oac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub 'ndx-try-aicc-oac-${AWS::AccountId}'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  OacFunctionUrl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub 'ndx-try-aicc-oac-fn-${AWS::AccountId}'
        OriginAccessControlOriginType: lambda
        SigningBehavior: always
        SigningProtocol: sigv4

  WebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub 'ndx-try-aicc-waf-${AWS::AccountId}'
      Scope: CLOUDFRONT
      DefaultAction: { Allow: {} }
      VisibilityConfig: { CloudWatchMetricsEnabled: true, MetricName: aicc-acl, SampledRequestsEnabled: true }
      Rules:
        - Name: AWS-AWSManagedRulesCommonRuleSet
          Priority: 0
          OverrideAction: { None: {} }
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          VisibilityConfig: { CloudWatchMetricsEnabled: true, MetricName: aicc-common, SampledRequestsEnabled: true }
        - Name: RateLimit
          Priority: 1
          Action: { Block: {} }
          Statement:
            RateBasedStatement:
              Limit: 1000
              EvaluationWindowSec: 300
              AggregateKeyType: IP
          VisibilityConfig: { CloudWatchMetricsEnabled: true, MetricName: aicc-rate, SampledRequestsEnabled: true }

  Cdn:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        WebACLId: !GetAtt WebAcl.Arn
        PriceClass: PriceClass_100
        HttpVersion: http2
        Origins:
          - Id: spa
            DomainName: !GetAtt SpaBucket.RegionalDomainName
            S3OriginConfig: { OriginAccessIdentity: '' }
            OriginAccessControlId: !GetAtt Oac.Id
          - Id: api
            DomainName: !Select [2, !Split ['/', !GetAtt CompanionApiFunctionUrl.FunctionUrl]]
            CustomOriginConfig: { OriginProtocolPolicy: https-only, OriginSSLProtocols: [TLSv1.2] }
            OriginAccessControlId: !GetAtt OacFunctionUrl.Id
        DefaultCacheBehavior:
          TargetOriginId: spa
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # CachingOptimized
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # AllViewerExceptHostHeader

  SpaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SpaBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub '${SpaBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Cdn}'

  # CompanionApiFunctionUrl is created implicitly by SAM via FunctionUrlConfig
  # on CompanionApiFunction (logical ID: CompanionApiFunctionUrl).

  CorsPinnerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'ndx-try-aicc-cors-pinner-${AWS::Region}'
      CodeUri: lambdas/cors-pinner/
      Handler: index.handler
      Timeout: 30
      Role: !GetAtt CustomResourceLambdaRole.Arn

  UploadBucketCors:
    Type: Custom::CorsPinner
    DependsOn: [UploadBucket, Cdn]
    Properties:
      ServiceToken: !GetAtt CorsPinnerFunction.Arn
      Bucket: !Ref UploadBucket
      CdnDomain: !GetAtt Cdn.DomainName

  # ============================================================
  # AC18 deploy-time verification
  # ============================================================
  DeployVerification:
    Type: Custom::DeployTimeVerification
    DependsOn:
      - SeedKbInvocation
      - CustomerProfilesDomain
      - IaCasesDomain
    Properties:
      ServiceToken: !GetAtt DeployTimeVerificationFunction.Arn
      ModelId: !Ref GenerationModelId
      KnowledgeBaseId: !Ref KnowledgeBase
      CustomerProfilesDomain: !Ref CustomerProfilesDomain
      ConnectInstanceId: !Ref ConnectInstance

Outputs:
  CompanionUrl:
    Description: CloudFront URL for the three-pane companion SPA
    Value: !Sub 'https://${Cdn.DomainName}'
  ConnectInstanceId:
    Description: Connect instance ID (use for AWS console live monitoring)
    Value: !Ref ConnectInstance
  PstnNumber:
    Description: Inbound PSTN geographic DID number (+44 20...)
    Value: !GetAtt GeoNumber.Address
  PstnNumberId:
    Description: Connect DID PhoneNumber resource ID (for console linkage)
    Value: !Ref GeoNumber
  KnowledgeBaseId:
    Description: Bedrock Knowledge Base ID
    Value: !Ref KnowledgeBase
  CasesDomainId:
    Description: Connect Cases domain ID
    Value: !Ref CasesDomain
  KbSourceBucket:
    Description: S3 bucket where KB documents must be staged via aws s3 sync
    Value: !Ref KbSourceBucket
