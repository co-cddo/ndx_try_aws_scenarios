  CouncilWorkspaceApp:
    Type: AWS::AppIntegrations::Application
    Properties:
      # Name pattern doesn't allow `:`; the colon-form lives in the agent UI
      # title bar instead (rendered client-side from the council querystring).
      Name: !Sub 'NDX-Try ${CouncilName}'
      Description: !Sub 'Bespoke agent-workspace app branded for ${CouncilName} (NDX:Try demo)'
      Namespace: !Sub 'ndxtry${AWS::AccountId}'
      ApplicationSourceConfig:
        ExternalUrlConfig:
          AccessUrl: !Sub
            - 'https://${Domain}/agent.html?council=${CouncilName}'
            - Domain: !GetAtt Cdn.DomainName
          ApprovedOrigins:
            - !Sub
              - 'https://${Domain}'
              - Domain: !GetAtt Cdn.DomainName
      Permissions:
        - User.Details.View

  IaCouncilWorkspaceApp:
    Type: AWS::Connect::IntegrationAssociation
    DependsOn: [ConnectInstanceActiveWait, CouncilWorkspaceApp]
    Properties:
      InstanceId: !Ref ConnectInstance
      IntegrationType: APPLICATION
      IntegrationArn: !GetAtt CouncilWorkspaceApp.ApplicationArn

  # ============================================================
  # PHASE 9: Contact flows
  # ============================================================
  MainContactFlow:
    Type: AWS::Connect::ContactFlow
    DependsOn: [IaLexBot, IaRagFn, IaMultiIntentFn, IaMultimodalFn, IaCasesDomain, IaOutboundCallbackFn, IaLandlineCallbackFn, IaProfileBuilderTriggerFn, IaPhotoWatcherFn, HoldMusicPromptLookup]
    Properties:
      InstanceArn: !GetAtt ConnectInstance.Arn
      Name: ndx-try-aicc-main-flow
      Type: CONTACT_FLOW
      Content: !Sub
        - |
          {
            "Version": "2019-10-30",
            "StartAction": "Enable flow logging",
          "Metadata": {
            "entryPointPosition": { "x": 20, "y": 20 },
            "ActionMetadata": {
              "Enable flow logging": { "isFriendlyName": true, "position": { "x": 20, "y": 80 } },
              "Enable call recording": { "isFriendlyName": true, "position": { "x": 340, "y": 80 } },
              "Build customer profile async": { "isFriendlyName": true, "position": { "x": 660, "y": 80 } },
              "Set en GB language": { "isFriendlyName": true, "position": { "x": 980, "y": 80 } },
              "Set Amy en GB voice": { "isFriendlyName": true, "position": { "x": 1300, "y": 80 } },
              "Greet and get intent via Lex": { "isFriendlyName": true, "position": { "x": 1620, "y": 80 } },
              "Bedrock RAG fulfilment": { "isFriendlyName": true, "position": { "x": 1940, "y": 80 } },
              "Should disconnect": { "isFriendlyName": true, "position": { "x": 2260, "y": 80 } },
              "Awaiting photo upload": { "isFriendlyName": true, "position": { "x": 2580, "y": 80 } },
              "Tell caller to use simulator": { "isFriendlyName": true, "position": { "x": 2580, "y": 280 } },
              "Hold music poll 1 of 3": { "isFriendlyName": true, "position": { "x": 2580, "y": 480 } },
              "Poll for photo 1 of 3": { "isFriendlyName": true, "position": { "x": 2580, "y": 680 } },
              "Photo received 1 of 3": { "isFriendlyName": true, "position": { "x": 2580, "y": 880 } },
              "Hold music poll 2 of 3": { "isFriendlyName": true, "position": { "x": 2580, "y": 1080 } },
              "Poll for photo 2 of 3": { "isFriendlyName": true, "position": { "x": 2580, "y": 1280 } },
              "Photo received 2 of 3": { "isFriendlyName": true, "position": { "x": 2580, "y": 1480 } },
              "Hold music poll 3 of 3": { "isFriendlyName": true, "position": { "x": 2580, "y": 1680 } },
              "Poll for photo 3 of 3": { "isFriendlyName": true, "position": { "x": 2580, "y": 1880 } },
              "Photo received 3 of 3": { "isFriendlyName": true, "position": { "x": 2580, "y": 2080 } },
              "Read back photo case": { "isFriendlyName": true, "position": { "x": 2580, "y": 2280 } },
              "Photo timeout message": { "isFriendlyName": true, "position": { "x": 2900, "y": 2280 } },
              "Safeguarding flag set": { "isFriendlyName": true, "position": { "x": 2900, "y": 80 } },
              "Acknowledge urgent intent": { "isFriendlyName": true, "position": { "x": 2900, "y": 280 } },
              "Set basic queue": { "isFriendlyName": true, "position": { "x": 2900, "y": 480 } },
              "Any agent available": { "isFriendlyName": true, "position": { "x": 2900, "y": 680 } },
              "Tell caller transferring": { "isFriendlyName": true, "position": { "x": 3220, "y": 680 } },
              "Transfer to queue": { "isFriendlyName": true, "position": { "x": 3220, "y": 880 } },
              "Needs landline fallback": { "isFriendlyName": true, "position": { "x": 2900, "y": 880 } },
              "Ask for landline number": { "isFriendlyName": true, "position": { "x": 2900, "y": 1080 } },
              "Trigger landline callback": { "isFriendlyName": true, "position": { "x": 2900, "y": 1280 } },
              "Promise callback": { "isFriendlyName": true, "position": { "x": 3220, "y": 1080 } },
              "Trigger outbound callback": { "isFriendlyName": true, "position": { "x": 3220, "y": 1280 } },
              "Read back answer": { "isFriendlyName": true, "position": { "x": 3540, "y": 1280 } },
              "Speak and re listen via Lex": { "isFriendlyName": true, "position": { "x": 3220, "y": 80 } },
              "Fallback acknowledgement": { "isFriendlyName": true, "position": { "x": 1940, "y": 280 } },
              "Goodbye message": { "isFriendlyName": true, "position": { "x": 3540, "y": 80 } },
              "Disconnect": { "isFriendlyName": true, "position": { "x": 3860, "y": 80 } }
            }
          },
            "Actions": [
              {
                "Identifier": "Enable flow logging",
                "Type": "UpdateFlowLoggingBehavior",
                "Parameters": { "FlowLoggingBehavior": "Enabled" },
                "Transitions": { "NextAction": "Enable call recording" }
              },
              {
                "Identifier": "Enable call recording",
                "Type": "UpdateContactRecordingAndAnalyticsBehavior",
                "Parameters": {
                  "VoiceBehavior": {
                    "VoiceRecordingBehavior": {
                      "RecordedParticipants": ["Customer", "Agent"],
                      "IVRRecordingBehavior": "Enabled"
                    },
                    "VoiceAnalyticsBehavior": {
                      "Enabled": "True",
                      "AnalyticsLanguage": "en-GB",
                      "ConversationalAnalyticsRedactionConfiguration": {
                        "Enabled": "True",
                        "RedactionResults": "RedactedAndOriginal",
                        "RedactionMaskMode": "EntityType"
                      },
                      "AnalyticsModes": ["RealTime"]
                    }
                  }
                },
                "Transitions": {
                  "NextAction": "Build customer profile async",
                  "Errors": [
                    { "ErrorType": "NoMatchingError", "NextAction": "Build customer profile async" },
                    { "ErrorType": "ChannelMismatch", "NextAction": "Build customer profile async" }
                  ]
                }
              },
              {
                "Identifier": "Build customer profile async",
                "Type": "InvokeLambdaFunction",
                "Parameters": {
                  "LambdaFunctionARN": "${ProfileBuilderTriggerArn}",
                  "InvocationTimeLimitSeconds": "5"
                },
                "Transitions": {
                  "NextAction": "Set en GB language",
                  "Errors": [{ "ErrorType": "NoMatchingError", "NextAction": "Set en GB language" }]
                }
              },
              {
                "Identifier": "Set en GB language",
                "Type": "UpdateContactAttributes",
                "Parameters": {
                  "Attributes": { "LanguageCode": "en_US" },
                  "TargetContact": "Current"
                },
                "Transitions": {
                  "NextAction": "Set Amy en GB voice",
                  "Errors": [{ "ErrorType": "NoMatchingError", "NextAction": "Set Amy en GB voice" }]
                }
              },
              {
                "Identifier": "Set Amy en GB voice",
                "Type": "UpdateContactTextToSpeechVoice",
                "Parameters": { "TextToSpeechEngine": "neural", "TextToSpeechVoice": "Amy" },
                "Transitions": {
                  "NextAction": "Greet and get intent via Lex",
                  "Errors": [{ "ErrorType": "NoMatchingError", "NextAction": "Greet and get intent via Lex" }]
                }
              },
              {
                "Identifier": "Greet and get intent via Lex",
                "Type": "ConnectParticipantWithLexBot",
                "Parameters": {
                  "Text": "Hello, you've reached Aldershire District Council. This is an NDX:Try session. What can I help with?",
                  "LexV2Bot": { "AliasArn": "${LexBotAliasArn}" }
                },
                "Transitions": {
                  "NextAction": "Bedrock RAG fulfilment",
                  "Errors": [
                    { "ErrorType": "NoMatchingError", "NextAction": "Bedrock RAG fulfilment" },
                    { "ErrorType": "NoMatchingCondition", "NextAction": "Bedrock RAG fulfilment" }
                  ]
                }
              },
              {
                "Identifier": "Bedrock RAG fulfilment",
                "Type": "InvokeLambdaFunction",
                "Parameters": {
                  "LambdaFunctionARN": "${RagArn}",
                  "InvocationTimeLimitSeconds": "8",
                  "LambdaInvocationAttributes": {
                    "user_utterance": "$.Lex.SessionAttributes.lex_input_transcript",
                    "matched_intent": "$.Lex.IntentName",
                    "decomposed_json": "$.Lex.SessionAttributes.decomposed_intents_json",
                    "safeguarding": "$.Lex.SessionAttributes.safeguarding_flag"
                  }
                },
                "Transitions": {
                  "NextAction": "Should disconnect",
                  "Errors": [{ "ErrorType": "NoMatchingError", "NextAction": "Fallback acknowledgement" }]
                }
              },
              {
                "Identifier": "Should disconnect",
                "Type": "Compare",
                "Parameters": { "ComparisonValue": "$.External.should_disconnect" },
                "Transitions": {
                  "NextAction": "Awaiting photo upload",
                  "Conditions": [
                    {
                      "NextAction": "Read back answer",
                      "Condition": { "Operator": "Equals", "Operands": ["true"] }
                    }
                  ],
                  "Errors": [{ "ErrorType": "NoMatchingCondition", "NextAction": "Awaiting photo upload" }]
                }
              },
              {
                "Identifier": "Awaiting photo upload",
                "Type": "Compare",
                "Parameters": { "ComparisonValue": "$.External.awaits_photo" },
                "Transitions": {
                  "NextAction": "Safeguarding flag set",
                  "Conditions": [
                    {
                      "NextAction": "Tell caller to use simulator",
                      "Condition": { "Operator": "Equals", "Operands": ["true"] }
                    }
                  ],
                  "Errors": [{ "ErrorType": "NoMatchingCondition", "NextAction": "Safeguarding flag set" }]
                }
              },
              {
                "Identifier": "Tell caller to use simulator",
                "Type": "MessageParticipant",
                "Parameters": { "Text": "$.External.answer" },
                "Transitions": { "NextAction": "Hold music poll 1 of 3" }
              },
              {
                "Identifier": "Hold music poll 1 of 3",
                "Type": "MessageParticipant",
                "Parameters": { "PromptId": "${HoldMusicPromptArn}" },
                "Transitions": {
                  "NextAction": "Poll for photo 1 of 3",
                  "Errors": [{ "ErrorType": "NoMatchingError", "NextAction": "Poll for photo 1 of 3" }]
                }
              },
              {
                "Identifier": "Poll for photo 1 of 3",
                "Type": "InvokeLambdaFunction",
                "Parameters": {
                  "LambdaFunctionARN": "${PhotoWatcherArn}",
                  "InvocationTimeLimitSeconds": "8",
                  "LambdaInvocationAttributes": {
                    "customer_phone": "$.CustomerEndpoint.Address"
                  }
                },
                "Transitions": {
                  "NextAction": "Photo received 1 of 3",
                  "Errors": [{ "ErrorType": "NoMatchingError", "NextAction": "Hold music poll 2 of 3" }]
                }
              },
              {
                "Identifier": "Photo received 1 of 3",
                "Type": "Compare",
                "Parameters": { "ComparisonValue": "$.External.found" },
                "Transitions": {
                  "NextAction": "Hold music poll 2 of 3",
                  "Conditions": [
                    {
                      "NextAction": "Read back photo case",
                      "Condition": { "Operator": "Equals", "Operands": ["true"] }
                    }
                  ],
                  "Errors": [{ "ErrorType": "NoMatchingCondition", "NextAction": "Hold music poll 2 of 3" }]
                }
              },
              {
                "Identifier": "Hold music poll 2 of 3",
                "Type": "MessageParticipant",
                "Parameters": { "PromptId": "${HoldMusicPromptArn}" },
                "Transitions": {
                  "NextAction": "Poll for photo 2 of 3",
                  "Errors": [{ "ErrorType": "NoMatchingError", "NextAction": "Poll for photo 2 of 3" }]
                }
              },
              {
                "Identifier": "Poll for photo 2 of 3",
                "Type": "InvokeLambdaFunction",
                "Parameters": {
                  "LambdaFunctionARN": "${PhotoWatcherArn}",
                  "InvocationTimeLimitSeconds": "8",
                  "LambdaInvocationAttributes": {
                    "customer_phone": "$.CustomerEndpoint.Address"
                  }
                },
                "Transitions": {
                  "NextAction": "Photo received 2 of 3",
                  "Errors": [{ "ErrorType": "NoMatchingError", "NextAction": "Hold music poll 3 of 3" }]
                }
              },
              {
                "Identifier": "Photo received 2 of 3",
                "Type": "Compare",
                "Parameters": { "ComparisonValue": "$.External.found" },
                "Transitions": {
                  "NextAction": "Hold music poll 3 of 3",
                  "Conditions": [
                    {
                      "NextAction": "Read back photo case",
                      "Condition": { "Operator": "Equals", "Operands": ["true"] }
                    }
                  ],
                  "Errors": [{ "ErrorType": "NoMatchingCondition", "NextAction": "Hold music poll 3 of 3" }]
                }
              },
              {
                "Identifier": "Hold music poll 3 of 3",
                "Type": "MessageParticipant",
                "Parameters": { "PromptId": "${HoldMusicPromptArn}" },
                "Transitions": {
                  "NextAction": "Poll for photo 3 of 3",
                  "Errors": [{ "ErrorType": "NoMatchingError", "NextAction": "Poll for photo 3 of 3" }]
                }
              },
              {
                "Identifier": "Poll for photo 3 of 3",
                "Type": "InvokeLambdaFunction",
                "Parameters": {
                  "LambdaFunctionARN": "${PhotoWatcherArn}",
                  "InvocationTimeLimitSeconds": "8",
                  "LambdaInvocationAttributes": {
                    "customer_phone": "$.CustomerEndpoint.Address"
                  }
                },
                "Transitions": {
                  "NextAction": "Photo received 3 of 3",
                  "Errors": [{ "ErrorType": "NoMatchingError", "NextAction": "Photo timeout message" }]
                }
              },
              {
                "Identifier": "Photo received 3 of 3",
                "Type": "Compare",
                "Parameters": { "ComparisonValue": "$.External.found" },
                "Transitions": {
                  "NextAction": "Photo timeout message",
                  "Conditions": [
                    {
                      "NextAction": "Read back photo case",
                      "Condition": { "Operator": "Equals", "Operands": ["true"] }
                    }
                  ],
                  "Errors": [{ "ErrorType": "NoMatchingCondition", "NextAction": "Photo timeout message" }]
                }
              },
              {
                "Identifier": "Read back photo case",
                "Type": "MessageParticipant",
                "Parameters": { "Text": "$.External.acknowledgement" },
                "Transitions": { "NextAction": "Goodbye message" }
              },
              {
                "Identifier": "Photo timeout message",
                "Type": "MessageParticipant",
                "Parameters": { "Text": "I haven't received a photo yet. If you send one through the simulator later, I'll attach it to a case and a colleague will follow up. Thanks for calling." },
                "Transitions": { "NextAction": "Disconnect" }
              },
              {
                "Identifier": "Safeguarding flag set",
                "Type": "Compare",
                "Parameters": { "ComparisonValue": "$.External.safeguarding" },
                "Transitions": {
                  "NextAction": "Speak and re listen via Lex",
                  "Conditions": [
                    {
                      "NextAction": "Acknowledge urgent intent",
                      "Condition": { "Operator": "Equals", "Operands": ["true"] }
                    }
                  ],
                  "Errors": [{ "ErrorType": "NoMatchingCondition", "NextAction": "Speak and re listen via Lex" }]
                }
              },
              {
                "Identifier": "Acknowledge urgent intent",
                "Type": "MessageParticipant",
                "Parameters": { "Text": "$.External.answer" },
                "Transitions": { "NextAction": "Set basic queue" }
              },
              {
                "Identifier": "Set basic queue",
                "Type": "UpdateContactTargetQueue",
                "Parameters": { "QueueId": "${BasicQueueArn}" },
                "Transitions": {
                  "NextAction": "Any agent available",
                  "Errors": [{ "ErrorType": "NoMatchingError", "NextAction": "Needs landline fallback" }]
                }
              },
              {
                "Identifier": "Any agent available",
                "Type": "CheckMetricData",
                "Parameters": { "MetricType": "NumberOfAgentsAvailable" },
                "Transitions": {
                  "NextAction": "Needs landline fallback",
                  "Conditions": [
                    {
                      "NextAction": "Tell caller transferring",
                      "Condition": { "Operator": "NumberGreaterThan", "Operands": ["0"] }
                    }
                  ],
                  "Errors": [
                    { "ErrorType": "NoMatchingError", "NextAction": "Needs landline fallback" },
                    { "ErrorType": "NoMatchingCondition", "NextAction": "Needs landline fallback" }
                  ]
                }
              },
              {
                "Identifier": "Tell caller transferring",
                "Type": "MessageParticipant",
                "Parameters": { "Text": "Connecting you to a council officer now." },
                "Transitions": { "NextAction": "Transfer to queue" }
              },
              {
                "Identifier": "Transfer to queue",
                "Type": "TransferContactToQueue",
                "Parameters": {},
                "Transitions": {
                  "NextAction": "Disconnect",
                  "Errors": [
                    { "ErrorType": "NoMatchingError", "NextAction": "Needs landline fallback" },
                    { "ErrorType": "QueueAtCapacity", "NextAction": "Needs landline fallback" }
                  ]
                }
              },
              {
                "Identifier": "Needs landline fallback",
                "Type": "Compare",
                "Parameters": { "ComparisonValue": "$.External.needs_landline" },
                "Transitions": {
                  "NextAction": "Promise callback",
                  "Conditions": [
                    {
                      "NextAction": "Ask for landline number",
                      "Condition": { "Operator": "Equals", "Operands": ["true"] }
                    }
                  ],
                  "Errors": [{ "ErrorType": "NoMatchingCondition", "NextAction": "Promise callback" }]
                }
              },
              {
                "Identifier": "Ask for landline number",
                "Type": "ConnectParticipantWithLexBot",
                "Parameters": {
                  "Text": "We're temporarily unable to call mobile phones back. What's a landline number we can ring you on instead?",
                  "LexV2Bot": { "AliasArn": "${LexBotAliasArn}" }
                },
                "Transitions": {
                  "NextAction": "Trigger landline callback",
                  "Errors": [
                    { "ErrorType": "NoMatchingError", "NextAction": "Read back answer" },
                    { "ErrorType": "NoMatchingCondition", "NextAction": "Trigger landline callback" }
                  ]
                }
              },
              {
                "Identifier": "Trigger landline callback",
                "Type": "InvokeLambdaFunction",
                "Parameters": {
                  "LambdaFunctionARN": "${LandlineCallbackArn}",
                  "InvocationTimeLimitSeconds": "8",
                  "LambdaInvocationAttributes": {
                    "user_utterance": "$.Lex.SessionAttributes.lex_input_transcript"
                  }
                },
                "Transitions": {
                  "NextAction": "Read back answer",
                  "Errors": [{ "ErrorType": "NoMatchingError", "NextAction": "Read back answer" }]
                }
              },
              {
                "Identifier": "Promise callback",
                "Type": "MessageParticipant",
                "Parameters": { "Text": "A safeguarding-trained colleague will call you back on this number within the next four hours." },
                "Transitions": { "NextAction": "Trigger outbound callback" }
              },
              {
                "Identifier": "Trigger outbound callback",
                "Type": "InvokeLambdaFunction",
                "Parameters": {
                  "LambdaFunctionARN": "${OutboundCallbackArn}",
                  "InvocationTimeLimitSeconds": "3"
                },
                "Transitions": {
                  "NextAction": "Disconnect",
                  "Errors": [{ "ErrorType": "NoMatchingError", "NextAction": "Disconnect" }]
                }
              },
              {
                "Identifier": "Read back answer",
                "Type": "MessageParticipant",
                "Parameters": { "Text": "$.External.answer" },
                "Transitions": { "NextAction": "Disconnect" }
              },
              {
                "Identifier": "Speak and re listen via Lex",
                "Type": "ConnectParticipantWithLexBot",
                "Parameters": {
                  "Text": "$.External.prompt",
                  "LexV2Bot": { "AliasArn": "${LexBotAliasArn}" }
                },
                "Transitions": {
                  "NextAction": "Bedrock RAG fulfilment",
                  "Conditions": [
                    {
                      "NextAction": "Goodbye message",
                      "Condition": {
                        "Operator": "Equals",
                        "Operands": ["GoodbyeIntent"]
                      }
                    }
                  ],
                  "Errors": [
                    { "ErrorType": "NoMatchingError", "NextAction": "Goodbye message" },
                    { "ErrorType": "NoMatchingCondition", "NextAction": "Bedrock RAG fulfilment" }
                  ]
                }
              },
              {
                "Identifier": "Fallback acknowledgement",
                "Type": "MessageParticipant",
                "Parameters": { "Text": "Thank you. I have logged your enquiry and a council officer will be in touch within two working days." },
                "Transitions": { "NextAction": "Goodbye message" }
              },
              {
                "Identifier": "Goodbye message",
                "Type": "MessageParticipant",
                "Parameters": { "Text": "Thanks for calling Aldershire District Council. Goodbye." },
                "Transitions": { "NextAction": "Disconnect" }
              },
              {
                "Identifier": "Disconnect",
                "Type": "DisconnectParticipant",
                "Parameters": {},
                "Transitions": {}
              }
            ]
          }
        - LexBotAliasArn: !GetAtt LexBotAlias.Arn
          RagArn: !GetAtt RagFulfilmentFunction.Arn
          OutboundCallbackArn: !GetAtt OutboundCallbackFunction.Arn
          LandlineCallbackArn: !GetAtt LandlineCallbackFunction.Arn
          BasicQueueArn: !Sub
            - 'arn:aws:connect:${AWS::Region}:${AWS::AccountId}:instance/${InstanceGuid}/queue/6c5c3ee4-e30b-4d0f-8fa5-0eb4e23ce62a'
            - InstanceGuid: !Select [1, !Split ['/', !GetAtt ConnectInstance.Arn]]
          ProfileBuilderTriggerArn: !GetAtt ProfileBuilderTriggerFunction.Arn
          PhotoWatcherArn: !GetAtt PhotoWatcherFunction.Arn
          HoldMusicPromptArn: !GetAtt HoldMusicPromptLookup.Arn

  DisconnectContactFlow:
    Type: AWS::Connect::ContactFlow
    Properties:
      InstanceArn: !GetAtt ConnectInstance.Arn
      Name: ndx-try-aicc-disconnect-flow
      Type: CONTACT_FLOW
      Content: |
        {
          "Version": "2019-10-30",
          "StartAction": "Apologise for fault",
        "Metadata": {
          "entryPointPosition": { "x": 20, "y": 20 },
          "ActionMetadata": {
            "Apologise for fault": { "isFriendlyName": true, "position": { "x": 20, "y": 80 } },
            "Disconnect on error": { "isFriendlyName": true, "position": { "x": 340, "y": 80 } }
          }
        },
          "Actions": [
            {
              "Identifier": "Apologise for fault",
              "Type": "MessageParticipant",
              "Parameters": { "Text": "Sorry, something has gone wrong. Goodbye." },
              "Transitions": { "NextAction": "Disconnect on error" }
            },
            {
              "Identifier": "Disconnect on error",
              "Type": "DisconnectParticipant",
              "Parameters": {},
              "Transitions": {}
            }
          ]
        }

  CallbackSimulationFlow:
    Type: AWS::Connect::ContactFlow
    Properties:
      InstanceArn: !GetAtt ConnectInstance.Arn
      Name: ndx-try-aicc-callback-simulation
      Type: CONTACT_FLOW
      Content: |
        {
          "Version": "2019-10-30",
          "StartAction": "Set Amy en GB voice",
        "Metadata": {
          "entryPointPosition": { "x": 20, "y": 20 },
          "ActionMetadata": {
            "Set Amy en GB voice": { "isFriendlyName": true, "position": { "x": 20, "y": 80 } },
            "Speak callback message": { "isFriendlyName": true, "position": { "x": 340, "y": 80 } },
            "Disconnect": { "isFriendlyName": true, "position": { "x": 660, "y": 80 } }
          }
        },
          "Actions": [
            {
              "Identifier": "Set Amy en GB voice",
              "Type": "UpdateContactTextToSpeechVoice",
              "Parameters": { "TextToSpeechEngine": "neural", "TextToSpeechVoice": "Amy" },
              "Transitions": { "NextAction": "Speak callback message", "Errors": [{ "ErrorType": "NoMatchingError", "NextAction": "Speak callback message" }] }
            },
            {
              "Identifier": "Speak callback message",
              "Type": "MessageParticipant",
              "Parameters": { "Text": "Hello, this is Aldershire District Council calling you back. This is a simulation of what a callback from a real human could be like. If you log into the agent workspace, you can accept these calls there. Thanks for using NDX:Try. Goodbye." },
              "Transitions": { "NextAction": "Disconnect" }
            },
            {
              "Identifier": "Disconnect",
              "Type": "DisconnectParticipant",
              "Parameters": {},
              "Transitions": {}
            }
          ]
        }

  PhotoWatcherFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'ndx-try-aicc-photo-watcher-${AWS::Region}'
      CodeUri: lambdas/photo-watcher/
      Handler: index.lambda_handler
      # Long-poll: holds the line while caller uses the simulator. Contact-flow
      # InvokeLambda action caps at 8s per call so we set Lambda timeout slightly
      # above that to allow internal poll loops + Connect-side retries.
      Timeout: 9
      Role: !GetAtt CommonLambdaRole.Arn
      Environment:
        Variables:
          DDB_TABLE_NAME: !Ref ContactLensCacheTable

  OutboundCallbackFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'ndx-try-aicc-outbound-callback-${AWS::Region}'
      CodeUri: lambdas/outbound-callback/
      Handler: index.lambda_handler
      Timeout: 15
      Role: !GetAtt CommonLambdaRole.Arn
      Environment:
        Variables:
          INSTANCE_ID: !Ref ConnectInstance
          CALLBACK_FLOW_ID: !Ref CallbackSimulationFlow
          SOURCE_PHONE_NUMBER: !GetAtt GeoNumber.Address

  LandlineCallbackFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'ndx-try-aicc-landline-callback-${AWS::Region}'
      CodeUri: lambdas/landline-callback/
      Handler: index.lambda_handler
      Timeout: 15
      Role: !GetAtt CommonLambdaRole.Arn
      Environment:
        Variables:
          OUTBOUND_FN_NAME: !Ref OutboundCallbackFunction

  ProfileBuilderFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'ndx-try-aicc-profile-builder-${AWS::Region}'
      CodeUri: lambdas/profile-builder/
      Handler: index.lambda_handler
      Timeout: 90
      MemorySize: 1024
      Role: !GetAtt CommonLambdaRole.Arn
      Environment:
        Variables:
          CUSTOMER_PROFILES_DOMAIN: !Ref CustomerProfilesDomain
          PROFILE_MODEL_ID: !Ref GenerationModelId
          CASES_DOMAIN_ID: !Ref CasesDomain
          CASES_TEMPLATE_ID: !Ref CasesTemplate

  ProfileBuilderTriggerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'ndx-try-aicc-profile-trigger-${AWS::Region}'
      CodeUri: lambdas/profile-builder-trigger/
      Handler: index.lambda_handler
      Timeout: 6
      Role: !GetAtt CommonLambdaRole.Arn
      Environment:
        Variables:
          CUSTOMER_PROFILES_DOMAIN: !Ref CustomerProfilesDomain
          PROFILE_BUILDER_FN: !Ref ProfileBuilderFunction

  # ============================================================
  # PHASE 12: Q in Connect (Wisdom) Assistant + KB
  # ============================================================
  WisdomAssistant:
    Type: AWS::Wisdom::Assistant
    Properties:
      Name: !Sub 'ndx-try-aicc-assistant-${AWS::Region}'
      Type: AGENT
      Description: Aldershire DC AI agent assist (Q in Connect)

  WisdomKnowledgeBase:
    Type: AWS::Wisdom::KnowledgeBase
    Properties:
      Name: !Sub 'ndx-try-aicc-qkb-${AWS::Region}'
      KnowledgeBaseType: CUSTOM
      Description: Aldershire DC service docs for live agent suggestions

  WisdomAssistantAssociation:
    Type: AWS::Wisdom::AssistantAssociation
    Properties:
      AssistantId: !GetAtt WisdomAssistant.AssistantId
      AssociationType: KNOWLEDGE_BASE
      Association:
        KnowledgeBaseId: !GetAtt WisdomKnowledgeBase.KnowledgeBaseId

  WisdomAnswerAgent:
    Type: AWS::Wisdom::AIAgent
    DependsOn: WisdomAssistantAssociation
    Properties:
      AssistantId: !GetAtt WisdomAssistant.AssistantId
      Name: !Sub 'ndx-try-aicc-answer-agent-${AWS::Region}'
      Type: ANSWER_RECOMMENDATION
      Description: Answer generation agent over the Aldershire DC KB
      Configuration:
        AnswerRecommendationAIAgentConfiguration:
          AssociationConfigurations:
            - AssociationType: KNOWLEDGE_BASE
              AssociationId: !GetAtt WisdomKnowledgeBase.KnowledgeBaseId

  IaWisdomAssistant:
    Type: Custom::ConnectBootstrap
    DependsOn: [ConnectInstanceActiveWait, WisdomAssistant, ConnectBootstrapFunction]
    Properties:
      ServiceToken: !GetAtt ConnectBootstrapFunction.Arn
      Action: ConnectIntegrationAssociation
      InstanceId: !Ref ConnectInstance
      IntegrationType: WISDOM_ASSISTANT
      IntegrationArn: !GetAtt WisdomAssistant.AssistantArn

  IaWisdomKnowledgeBase:
    Type: Custom::ConnectBootstrap
    DependsOn: [ConnectInstanceActiveWait, WisdomKnowledgeBase, ConnectBootstrapFunction]
    Properties:
      ServiceToken: !GetAtt ConnectBootstrapFunction.Arn
      Action: ConnectIntegrationAssociation
      InstanceId: !Ref ConnectInstance
      IntegrationType: WISDOM_KNOWLEDGE_BASE
      IntegrationArn: !GetAtt WisdomKnowledgeBase.KnowledgeBaseArn

  # ============================================================
  # PHASE 13: Connect / Wisdom / CP bootstrap (custom resources)
  # ============================================================
  ConnectBootstrapFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'ndx-try-aicc-connect-bootstrap-${AWS::Region}'
      CodeUri: lambdas/connect-bootstrap/
      Handler: index.handler
      Timeout: 600
      MemorySize: 512
      Role: !GetAtt CustomResourceLambdaRole.Arn

  AgentSecurityProfilePermissions:
    Type: Custom::ConnectBootstrap
    DependsOn: [ConnectInstanceActiveWait, IaWisdomAssistant, IaWisdomKnowledgeBase, IaCustomerProfilesIntegration, IaCouncilWorkspaceApp]
    Properties:
      ServiceToken: !GetAtt ConnectBootstrapFunction.Arn
      Action: AgentSecurityProfilePermissions
      InstanceId: !Ref ConnectInstance
      SecurityProfileName: Agent
      Permissions:
        - BasicAgentAccess
        - OutboundCallAccess
        - OutboundEmail.Create
        - CustomerProfiles.View
        - CustomerProfiles.Edit
        - Cases.View
        - Cases.Create
        - Cases.Edit
        - Wisdom.View
        - ContentManagement.View
        - QConnectAIAgents.View
        - QConnectAIPrompts.View
      # Application-level permissions on a security profile use a different
      # permission vocabulary than the Application's own declared Permissions.
      # IntegrationAssociation alone exposes the app in the agent workspace
      # for users with BasicAgentAccess, which is sufficient for this demo.

  HoldMusicPromptLookup:
    Type: Custom::ConnectBootstrap
    DependsOn: ConnectInstanceActiveWait
    Properties:
      ServiceToken: !GetAtt ConnectBootstrapFunction.Arn
      Action: LookupPrompt
      InstanceId: !Ref ConnectInstance
      # AWS auto-creates this on every fresh Connect instance (queue music).
      PromptName: CustomerQueue.wav

  CustomerProfilesNoInferredObjectType:
    Type: Custom::ConnectBootstrap
    DependsOn: [CustomerProfilesDomain, ConnectBootstrapFunction]
    Properties:
      ServiceToken: !GetAtt ConnectBootstrapFunction.Arn
      Action: CustomerProfilesObjectType
      DomainName: !Ref CustomerProfilesDomain
      TemplateId: CTR-NoInferred
      ObjectTypeName: CTRNoInferred

  IaCustomerProfilesIntegration:
    Type: Custom::ConnectBootstrap
    DependsOn: [ConnectInstanceActiveWait, CustomerProfilesDomain]
    Properties:
      ServiceToken: !GetAtt ConnectBootstrapFunction.Arn
      Action: CustomerProfilesPutIntegration
      DomainName: !Ref CustomerProfilesDomain
      InstanceArn: !GetAtt ConnectInstance.Arn
      # The CCP / Agent Workspace Customer Profiles widget specifically requires
      # ObjectTypeName=CTR — anything else surfaces "feature hasn't been set up
      # for your organization" in the agent UI. Duplicate-prevention happens in
      # ProfileBuilder Lambda's _upsert_profile: it search_profiles by _phone
      # first, then updates the existing one rather than creating a second.
      # CTR fires post-call so by then the rich profile already exists.
      ObjectTypeName: CTR

  WisdomContentUploader:
    Type: Custom::ConnectBootstrap
    DependsOn: [WisdomKnowledgeBase, KbSourceBucket]
    Properties:
      ServiceToken: !GetAtt ConnectBootstrapFunction.Arn
      Action: WisdomContentUpload
      KnowledgeBaseId: !GetAtt WisdomKnowledgeBase.KnowledgeBaseId
      SourceBucket: !Ref KbSourceBucket
      SourcePrefix: ''
      # CorpusVersion is a forcing field: bump it after every `aws s3 sync documents/`
      # so this custom resource re-fires and the Lambda picks up new docs.
      CorpusVersion: !Ref CorpusVersion

  WisdomDefaultAnswerAgent:
    Type: Custom::ConnectBootstrap
    DependsOn: [WisdomAnswerAgent, ConnectBootstrapFunction]
    Properties:
      ServiceToken: !GetAtt ConnectBootstrapFunction.Arn
      Action: WisdomDefaultAIAgent
      AssistantId: !GetAtt WisdomAssistant.AssistantId
      AIAgentId: !GetAtt WisdomAnswerAgent.AIAgentId
      AIAgentType: ANSWER_RECOMMENDATION

  GeoFlowAssoc:
    Type: Custom::PhoneFlowAssoc
    DependsOn: [GeoNumber, MainContactFlow]
    Properties:
      ServiceToken: !GetAtt PhoneFlowAssocFunction.Arn
      PhoneNumberId: !Ref GeoNumber
      InstanceId: !Ref ConnectInstance
      ContactFlowId: !Ref MainContactFlow

  # ============================================================
  # PHASE 10: Contact Lens streaming
  # ============================================================
  ContactLensStream:
    Type: AWS::Kinesis::Stream
    Properties:
      Name: !Sub 'ndx-try-aicc-cl-${AWS::Region}'
      ShardCount: 1
      RetentionPeriodHours: 24
      StreamEncryption:
        EncryptionType: KMS
        KeyId: alias/aws/kinesis

  ContactLensDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'ndx-try-aicc-cl-dlq-${AWS::Region}'
      MessageRetentionPeriod: 1209600
      KmsMasterKeyId: alias/aws/sqs

  ContactLensDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'ndx-try-aicc-cl-dlq-depth-${AWS::Region}'
      MetricName: ApproximateNumberOfMessagesVisible
      Namespace: AWS/SQS
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - { Name: QueueName, Value: !GetAtt ContactLensDlq.QueueName }
      TreatMissingData: notBreaching

  # AWS::Connect::InstanceStorageConfig.ResourceType doesn't include
  # REAL_TIME_CONTACT_ANALYSIS_SEGMENTS in CFN (the connect API supports it).
  # Use a custom resource that calls AssociateInstanceStorageConfig directly.
  ConnectStorageConfigFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'ndx-try-aicc-storage-cr-${AWS::Region}'
      CodeUri: lambdas/connect-storage-config/
      Handler: index.handler
      Timeout: 60
      Role: !GetAtt CustomResourceLambdaRole.Arn

  ConnectKinesisStreamConfig:
    Type: Custom::ConnectStorageConfig
    DependsOn: [ConnectInstanceActiveWait, ContactLensStream]
    Properties:
      ServiceToken: !GetAtt ConnectStorageConfigFunction.Arn
      InstanceId: !Ref ConnectInstance
      ResourceType: REAL_TIME_CONTACT_ANALYSIS_SEGMENTS
      StorageConfig:
        StorageType: KINESIS_STREAM
        KinesisStreamConfig: { StreamArn: !GetAtt ContactLensStream.Arn }

  RecordingsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'ndx-try-aicc-recordings-${AWS::AccountId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - { Id: ExpireRecordings, Status: Enabled, ExpirationInDays: 7 }

  RecordingsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref RecordingsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowConnectServicePut
            Effect: Allow
            Principal: { Service: connect.amazonaws.com }
            Action: [s3:PutObject, s3:PutObjectAcl, s3:GetBucketLocation]
            Resource:
              - !Sub '${RecordingsBucket.Arn}/*'
              - !GetAtt RecordingsBucket.Arn
            Condition:
              StringEquals: { 'aws:SourceAccount': !Ref 'AWS::AccountId' }
              ArnEquals: { 'aws:SourceArn': !GetAtt ConnectInstance.Arn }

  ConnectCallRecordingStorage:
    Type: AWS::Connect::InstanceStorageConfig
    DependsOn: [ConnectInstanceActiveWait, RecordingsBucket, RecordingsBucketPolicy]
    Properties:
      InstanceArn: !GetAtt ConnectInstance.Arn
      ResourceType: CALL_RECORDINGS
      StorageType: S3
      S3Config:
        BucketName: !Ref RecordingsBucket
        BucketPrefix: recordings

  ContactLensCacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'ndx-try-aicc-contact-lens-cache-${AWS::Region}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: contactId,        AttributeType: S }
        - { AttributeName: segmentTimestamp, AttributeType: N }
      KeySchema:
        - { AttributeName: contactId,        KeyType: HASH }
        - { AttributeName: segmentTimestamp, KeyType: RANGE }
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }
      SSESpecification: { SSEEnabled: true }

  # ============================================================
  # PHASE 11: Companion UI hosting + WAF
  # ============================================================
  SpaBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'ndx-try-aicc-spa-${AWS::AccountId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  UploadBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'ndx-try-aicc-uploads-${AWS::AccountId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - { Id: ExpireUploads, Status: Enabled, ExpirationInDays: 1, Prefix: uploads/ }
      CorsConfiguration:
        CorsRules:
          # AllowedOrigins is static (CloudFront wildcard) to avoid circular
          # dependency on Cdn. The Companion API Lambda re-validates the origin
          # at runtime against the same CloudFront pattern.
          - AllowedHeaders: ["*"]
            AllowedMethods: [GET, PUT]
            AllowedOrigins: ["https://*.cloudfront.net"]
            ExposedHeaders: [ETag]
            MaxAge: 3000

  ShareBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'ndx-try-aicc-share-${AWS::AccountId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - { Id: ExpireSharePdfs, Status: Enabled, ExpirationInDays: 1, Prefix: share-pdfs/ }

  Oac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub 'ndx-try-aicc-oac-${AWS::AccountId}'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  OacFunctionUrl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub 'ndx-try-aicc-oac-fn-${AWS::AccountId}'
        OriginAccessControlOriginType: lambda
        SigningBehavior: always
        SigningProtocol: sigv4

  WebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub 'ndx-try-aicc-waf-${AWS::AccountId}'
      Scope: CLOUDFRONT
      DefaultAction: { Allow: {} }
      VisibilityConfig: { CloudWatchMetricsEnabled: true, MetricName: aicc-acl, SampledRequestsEnabled: true }
      Rules:
        - Name: AWS-AWSManagedRulesCommonRuleSet
          Priority: 0
          OverrideAction: { None: {} }
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          VisibilityConfig: { CloudWatchMetricsEnabled: true, MetricName: aicc-common, SampledRequestsEnabled: true }
        - Name: RateLimit
          Priority: 1
          Action: { Block: {} }
          Statement:
            RateBasedStatement:
              Limit: 1000
              EvaluationWindowSec: 300
              AggregateKeyType: IP
          VisibilityConfig: { CloudWatchMetricsEnabled: true, MetricName: aicc-rate, SampledRequestsEnabled: true }

  Cdn:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        WebACLId: !GetAtt WebAcl.Arn
        PriceClass: PriceClass_100
        HttpVersion: http2
        Origins:
          - Id: spa
            DomainName: !GetAtt SpaBucket.RegionalDomainName
            S3OriginConfig: { OriginAccessIdentity: '' }
            OriginAccessControlId: !GetAtt Oac.Id
          - Id: api
            DomainName: !Select [2, !Split ['/', !GetAtt CompanionApiFunctionUrl.FunctionUrl]]
            CustomOriginConfig: { OriginProtocolPolicy: https-only, OriginSSLProtocols: [TLSv1.2] }
            OriginAccessControlId: !GetAtt OacFunctionUrl.Id
        DefaultCacheBehavior:
          TargetOriginId: spa
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # CachingOptimized
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # AllViewerExceptHostHeader

  SpaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SpaBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub '${SpaBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Cdn}'

  # CompanionApiFunctionUrl is created implicitly by SAM via FunctionUrlConfig
  # on CompanionApiFunction (logical ID: CompanionApiFunctionUrl).

  CorsPinnerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'ndx-try-aicc-cors-pinner-${AWS::Region}'
      CodeUri: lambdas/cors-pinner/
      Handler: index.handler
      Timeout: 30
      Role: !GetAtt CustomResourceLambdaRole.Arn

  UploadBucketCors:
    Type: Custom::CorsPinner
    DependsOn: [UploadBucket, Cdn]
    Properties:
      ServiceToken: !GetAtt CorsPinnerFunction.Arn
      Bucket: !Ref UploadBucket
      CdnDomain: !GetAtt Cdn.DomainName

  # ============================================================
  # AC18 deploy-time verification
  # ============================================================
  DeployVerification:
    Type: Custom::DeployTimeVerification
    DependsOn:
      - SeedKbInvocation
      - CustomerProfilesDomain
      - IaCasesDomain
    Properties:
      ServiceToken: !GetAtt DeployTimeVerificationFunction.Arn
      ModelId: !Ref GenerationModelId
      KnowledgeBaseId: !Ref KnowledgeBase
      CustomerProfilesDomain: !Ref CustomerProfilesDomain
      ConnectInstanceId: !Ref ConnectInstance

Outputs:
  CompanionUrl:
    Description: CloudFront URL for the three-pane companion SPA
    Value: !Sub 'https://${Cdn.DomainName}'
  ConnectInstanceId:
    Description: Connect instance ID (use for AWS console live monitoring)
    Value: !Ref ConnectInstance
  PstnNumber:
    Description: Inbound PSTN geographic DID number (+44 20...)
    Value: !GetAtt GeoNumber.Address
  PstnNumberId:
    Description: Connect DID PhoneNumber resource ID (for console linkage)
    Value: !Ref GeoNumber
  KnowledgeBaseId:
    Description: Bedrock Knowledge Base ID
    Value: !Ref KnowledgeBase
  CasesDomainId:
    Description: Connect Cases domain ID
    Value: !Ref CasesDomain
  KbSourceBucket:
    Description: S3 bucket where KB documents must be staged via aws s3 sync
    Value: !Ref KbSourceBucket
