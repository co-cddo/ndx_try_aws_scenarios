AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: |
  NDX:Try - AI Contact Centre (Council Reception)
  Amazon Connect with claimed UK +44 800 toll-free, Lex v2 (en_GB), Bedrock KB
  + Guardrails, multimodal photo describe, Connect Cases, Customer Profiles,
  Contact Lens with PII redaction, Kinesis stream, three-pane companion SPA,
  CloudFront + WAF.
  Version: 0.1.0 (initial draft per tech-spec-ai-contact-centre.md)

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Scenario Configuration }
        Parameters: [Environment]
      - Label: { default: Bedrock model selection }
        Parameters: [GenerationModelId, EmbeddingModelId]
      - Label: { default: Companion SPA }
        Parameters: [SpaSourceBucket, SpaSourcePrefix]
      - Label: { default: Phone number country }
        Parameters: [PhoneNumberCountryCode, PhoneNumberType]

Parameters:
  Environment:
    Type: String
    Default: sandbox
    AllowedValues: [sandbox, development, production]
  GenerationModelId:
    Type: String
    Default: amazon.nova-pro-v1:0
    Description: Bedrock model ID for generation, multimodal describe, multi-intent
  EmbeddingModelId:
    Type: String
    Default: amazon.titan-embed-text-v2:0
    Description: Bedrock embedding model for KB
  PhoneNumberCountryCode:
    Type: String
    Default: GB
  PhoneNumberType:
    Type: String
    Default: DID
    AllowedValues: [TOLL_FREE, DID]
    Description: Default DID — toll-free GB numbers historically had unreliable inbound routing from UK mobile networks.
  MaxIntentsPerTurn:
    Type: Number
    Default: 4
  CorpusVersion:
    Type: String
    Default: v1
    Description: |
      Bump on every redeploy that changes the documents/ tree to force Bedrock
      KB re-ingestion AND Wisdom (Q in Connect) content re-upload. CFN custom
      resources only fire on Update if at least one property changes.
  CouncilName:
    Type: String
    Default: Aldershire
    Description: |
      Council name shown on the bespoke agent-workspace application
      ("NDX:Try {CouncilName}") and used to brand the agent dashboard page.

Globals:
  Function:
    Runtime: python3.12
    MemorySize: 512
    Timeout: 30
    Architectures: [x86_64]
    Tracing: Active
    Environment:
      Variables:
        LOG_LEVEL: INFO

Resources:

  # ============================================================
  # PHASE 3: Bedrock KB (S3 Vectors + KB + Guardrail)
  # ============================================================
  KbSourceBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'ndx-try-aicc-kb-${AWS::AccountId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration: { Status: Enabled }
      Tags:
        - { Key: Project, Value: ndx-try }
        - { Key: Scenario, Value: ai-contact-centre }
        - { Key: AutoCleanup, Value: 'true' }

  KbVectorBucket:
    Type: AWS::S3Vectors::VectorBucket
    DeletionPolicy: Delete
    Properties:
      VectorBucketName: !Sub 'ndx-try-aicc-vec-${AWS::AccountId}-${AWS::Region}'

  KbVectorIndex:
    Type: AWS::S3Vectors::Index
    DeletionPolicy: Delete
    DependsOn: KbVectorBucket
    Properties:
      VectorBucketName: !Sub 'ndx-try-aicc-vec-${AWS::AccountId}-${AWS::Region}'
      IndexName: aicc-kb-index-v3
      DataType: float32
      Dimension: 1024
      DistanceMetric: cosine
      MetadataConfiguration:
        NonFilterableMetadataKeys: [AMAZON_BEDROCK_TEXT_CHUNK, AMAZON_BEDROCK_METADATA]

  KbRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'InnovationSandbox-ndx-aicc-kb-${AWS::Region}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: bedrock.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: kb-permissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [bedrock:InvokeModel]
                Resource:
                  - !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/${EmbeddingModelId}'
                  - !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/${GenerationModelId}'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt KbSourceBucket.Arn
                  - !Sub '${KbSourceBucket.Arn}/*'
              - Effect: Allow
                Action: [s3vectors:*]
                Resource: '*'

  KnowledgeBase:
    Type: AWS::Bedrock::KnowledgeBase
    Properties:
      Name: !Sub 'ndx-try-aicc-kb-v3-${AWS::Region}'
      Description: AI Contact Centre KB, Aldershire DC services (en_GB)
      RoleArn: !GetAtt KbRole.Arn
      KnowledgeBaseConfiguration:
        Type: VECTOR
        VectorKnowledgeBaseConfiguration:
          EmbeddingModelArn: !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/${EmbeddingModelId}'
      StorageConfiguration:
        Type: S3_VECTORS
        S3VectorsConfiguration:
          IndexArn: !GetAtt KbVectorIndex.IndexArn

  KnowledgeBaseDataSource:
    Type: AWS::Bedrock::DataSource
    Properties:
      KnowledgeBaseId: !Ref KnowledgeBase
      Name: aicc-source
      DataSourceConfiguration:
        Type: S3
        S3Configuration:
          BucketArn: !GetAtt KbSourceBucket.Arn

  Guardrail:
    Type: AWS::Bedrock::Guardrail
    Properties:
      Name: !Sub 'ndx-try-aicc-guardrail-${AWS::Region}'
      Description: Contact-centre AI Guardrail (council services)
      BlockedInputMessaging: I can't help with that one. Let me get a colleague to call you back.
      BlockedOutputsMessaging: I can't give that kind of advice. A council officer will follow up.
      ContentPolicyConfig:
        FiltersConfig:
          - { Type: HATE,         InputStrength: HIGH, OutputStrength: HIGH }
          - { Type: VIOLENCE,     InputStrength: HIGH, OutputStrength: HIGH }
          - { Type: SEXUAL,       InputStrength: HIGH, OutputStrength: HIGH }
          - { Type: INSULTS,      InputStrength: MEDIUM, OutputStrength: HIGH }
          - { Type: MISCONDUCT,   InputStrength: HIGH, OutputStrength: HIGH }
          - { Type: PROMPT_ATTACK, InputStrength: HIGH, OutputStrength: NONE }
      SensitiveInformationPolicyConfig:
        PiiEntitiesConfig:
          - { Type: NAME, Action: ANONYMIZE }
          - { Type: ADDRESS, Action: ANONYMIZE }
          - { Type: PHONE, Action: ANONYMIZE }
          - { Type: EMAIL, Action: ANONYMIZE }
          - { Type: UK_NATIONAL_INSURANCE_NUMBER, Action: BLOCK }
          - { Type: UK_NATIONAL_HEALTH_SERVICE_NUMBER, Action: BLOCK }
          - { Type: CREDIT_DEBIT_CARD_NUMBER, Action: BLOCK }
      TopicPolicyConfig:
        TopicsConfig:
          - Name: LegalAdvice
            Definition: Specific legal advice such as advising a resident to sue, claim compensation, or pursue a tribunal action against the council.
            Type: DENY
            Examples:
              - "What grounds do I have to sue?"
              - "Am I entitled to compensation under the law?"
              - "Should I take this to a tribunal?"
          - Name: MedicalAdvice
            Definition: Specific medical advice or medication suggestions.
            Type: DENY
            Examples:
              - "What painkiller should I take?"
              - "Diagnose this rash for me"

  # ============================================================
  # PHASE 4: Connect instance + PSTN
  # ============================================================
  ConnectInstance:
    Type: AWS::Connect::Instance
    Properties:
      InstanceAlias: !Sub 'ndx-try-aicc-${AWS::AccountId}'
      IdentityManagementType: CONNECT_MANAGED
      Attributes:
        InboundCalls: true
        OutboundCalls: true
        ContactLens: true
        ContactflowLogs: true
        EarlyMedia: true
        AutoResolveBestVoices: true

  ConnectInstanceActiveWaitFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'ndx-try-aicc-connect-active-wait-${AWS::Region}'
      CodeUri: lambdas/connect-instance-active-wait/
      Handler: index.handler
      Timeout: 360
      Policies:
        - Statement:
            - Effect: Allow
              Action: [connect:DescribeInstance]
              Resource: '*'
      Role: !GetAtt CustomResourceLambdaRole.Arn

  ConnectInstanceActiveWait:
    Type: Custom::ConnectInstanceActiveWait
    Properties:
      ServiceToken: !GetAtt ConnectInstanceActiveWaitFunction.Arn
      InstanceId: !Ref ConnectInstance

  GeoNumber:
    Type: AWS::Connect::PhoneNumber
    Properties:
      TargetArn: !GetAtt ConnectInstance.Arn
      Type: DID
      CountryCode: GB
      Description: !Sub 'ndx-try-aicc inbound DID (${AWS::StackName})'

  # ============================================================
  # PHASE 5: Lex bot
  # ============================================================
  LexBotRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'InnovationSandbox-ndx-aicc-lex-${AWS::Region}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lex.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: lex-polly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [polly:SynthesizeSpeech]
                Resource: '*'

  LexBot:
    Type: AWS::Lex::Bot
    Properties:
      Name: !Sub 'ndx-try-aicc-bot-${AWS::Region}'
      Description: AI Contact Centre, Aldershire DC reception
      DataPrivacy: { ChildDirected: false }
      IdleSessionTTLInSeconds: 300
      AutoBuildBotLocales: true
      RoleArn: !GetAtt LexBotRole.Arn
      BotLocales:
        - LocaleId: en_US
          NluConfidenceThreshold: 0.4
          VoiceSettings: { VoiceId: Joanna, Engine: neural }
          Intents:
            - Name: WelcomeIntent
              FulfillmentCodeHook: { Enabled: true }
              SampleUtterances:
                - { Utterance: "Hello" }
                - { Utterance: "Hi" }
                - { Utterance: "Good morning" }
            - Name: BinCollection
              FulfillmentCodeHook: { Enabled: true }
              SampleUtterances:
                - { Utterance: "When is my bin collection day" }
                - { Utterance: "What day do I put my bins out" }
                - { Utterance: "When are my bins collected" }
                - { Utterance: "What day are my bins emptied" }
                - { Utterance: "Bin day" }
            - Name: MissedCollection
              FulfillmentCodeHook: { Enabled: true }
              SampleUtterances:
                - { Utterance: "My bins haven't been collected" }
                - { Utterance: "The bin lorry didn't come this week" }
                - { Utterance: "Missed collection" }
                - { Utterance: "My bin was not emptied" }
                - { Utterance: "Bins were not picked up" }
                - { Utterance: "Refuse collection missed" }
            - Name: FlyTip
              FulfillmentCodeHook: { Enabled: true }
              SampleUtterances:
                - { Utterance: "There's fly tipping" }
                - { Utterance: "Someone's dumped rubbish" }
                - { Utterance: "Rubbish has been dumped" }
                - { Utterance: "Fly tip on the corner" }
                - { Utterance: "Mattress dumped on the street" }
                - { Utterance: "I want to report fly tipping" }
                - { Utterance: "I'd like to report fly tipping" }
                - { Utterance: "Want to report fly tipping" }
                - { Utterance: "Report fly tipping" }
                - { Utterance: "Reporting fly tipping" }
                - { Utterance: "I need to report fly tipping" }
                - { Utterance: "There's been some fly tipping" }
                - { Utterance: "Someone has been fly tipping" }
                - { Utterance: "I want to report some fly tipping" }
                - { Utterance: "Illegal dumping" }
                - { Utterance: "There is illegal dumping" }
                - { Utterance: "Someone dumped a sofa" }
                - { Utterance: "Sofa dumped on the street" }
                - { Utterance: "Pile of rubbish" }
            - Name: PotholeReport
              FulfillmentCodeHook: { Enabled: true }
              SampleUtterances:
                - { Utterance: "There's a pothole" }
                - { Utterance: "Pothole on the road" }
                - { Utterance: "Damaged road surface" }
            - Name: BrokenPaving
              FulfillmentCodeHook: { Enabled: true }
              SampleUtterances:
                - { Utterance: "The pavement is broken" }
                - { Utterance: "Broken paving slab" }
                - { Utterance: "Pavement is damaged" }
            - Name: ParkedVehicle
              FulfillmentCodeHook: { Enabled: true }
              SampleUtterances:
                - { Utterance: "There's a car parked across my driveway" }
                - { Utterance: "Someone is blocking my drive" }
                - { Utterance: "Car parked illegally" }
            - Name: DampMould
              FulfillmentCodeHook: { Enabled: true }
              SampleUtterances:
                - { Utterance: "There's damp in my home" }
                - { Utterance: "Mould on the wall" }
                - { Utterance: "Damp coming through my ceiling" }
                - { Utterance: "Black mould in the bathroom" }
                - { Utterance: "Wet patch on the wall" }
            - Name: AntiSocialBehaviour
              FulfillmentCodeHook: { Enabled: true }
              SampleUtterances:
                - { Utterance: "Anti social behaviour" }
                - { Utterance: "My neighbour has been shouting" }
                - { Utterance: "Loud music every night" }
                - { Utterance: "ASB problem" }
                - { Utterance: "Threatening behaviour from neighbour" }
            - Name: Safeguarding
              FulfillmentCodeHook: { Enabled: true }
              SampleUtterances:
                - { Utterance: "I'm worried about a vulnerable person" }
                - { Utterance: "I think someone is being abused" }
                - { Utterance: "I don't know what to do" }
                - { Utterance: "I'm at the end of my tether" }
                - { Utterance: "Concerned about a vulnerable adult" }
            - Name: CouncilTax
              FulfillmentCodeHook: { Enabled: true }
              SampleUtterances:
                - { Utterance: "Council tax" }
                - { Utterance: "I can't afford to pay my council tax" }
                - { Utterance: "I am struggling to pay my council tax" }
                - { Utterance: "Question about my council tax bill" }
                - { Utterance: "Council tax is too high" }
                - { Utterance: "Council tax enforcement" }
            - Name: BenefitsSupport
              FulfillmentCodeHook: { Enabled: true }
              SampleUtterances:
                - { Utterance: "Housing benefit" }
                - { Utterance: "Council Tax Reduction" }
                - { Utterance: "Benefits help" }
                - { Utterance: "I want to apply for benefits" }
            - Name: PlanningEnquiry
              FulfillmentCodeHook: { Enabled: true }
              SampleUtterances:
                - { Utterance: "Planning permission" }
                - { Utterance: "Planning application" }
                - { Utterance: "Do I need planning permission" }
                - { Utterance: "Building extension" }
            - Name: MultiIntentTriage
              FulfillmentCodeHook: { Enabled: true }
              SampleUtterances:
                - { Utterance: "I have multiple things" }
                - { Utterance: "Several issues" }
            - Name: GoodbyeIntent
              FulfillmentCodeHook: { Enabled: true }
              SampleUtterances:
                - { Utterance: "No" }
                - { Utterance: "No thanks" }
                - { Utterance: "No thank you" }
                - { Utterance: "That is all" }
                - { Utterance: "Nothing else" }
                - { Utterance: "Goodbye" }
                - { Utterance: "Bye" }
                - { Utterance: "Thanks bye" }
                - { Utterance: "I'm done" }
                - { Utterance: "All done" }
            - Name: FallbackIntent
              ParentIntentSignature: AMAZON.FallbackIntent
              FulfillmentCodeHook: { Enabled: true }

  LexBotVersionV6:
    Type: AWS::Lex::BotVersion
    Properties:
      BotId: !Ref LexBot
      BotVersionLocaleSpecification:
        - LocaleId: en_US
          BotVersionLocaleDetails: { SourceBotVersion: DRAFT }

  LexBotAlias:
    Type: AWS::Lex::BotAlias
    Properties:
      BotId: !Ref LexBot
      BotAliasName: prod
      BotVersion: !GetAtt LexBotVersionV6.BotVersion
      BotAliasLocaleSettings:
        - LocaleId: en_US
          BotAliasLocaleSetting:
            Enabled: true
            CodeHookSpecification:
              LambdaCodeHook:
                LambdaArn: !GetAtt MultiIntentFunction.Arn
                CodeHookInterfaceVersion: '1.0'

  # ============================================================
  # PHASE 6: Lambda functions (one role hub, then per-function)
  # ============================================================
  CustomResourceLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'InnovationSandbox-ndx-aicc-cr-${AWS::Region}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - { Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: sts:AssumeRole }
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: cr-broad
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - connect:*
                  - bedrock:*
                  - bedrock-agent:*
                  - bedrock-agent-runtime:*
                  - customer-profiles:*
                  # AWS IAM uses 'profile:' prefix for Customer Profiles actions,
                  # not 'customer-profiles:'. Both are needed defensively.
                  - profile:*
                  - cases:*
                  - cases-domain:*
                  - wisdom:*
                  - qconnect:*
                  # AssociateInstanceStorageConfig validates the caller has
                  # access to the resource being attached.
                  - kinesis:DescribeStream
                  - kinesis:DescribeStreamSummary
                  - kinesis:PutRecord
                  - kinesis:PutRecords
                  - kinesis:GetShardIterator
                  - kinesis:GetRecords
                  - kinesis:ListShards
                Resource: '*'
              - Effect: Allow
                # AssociateInstanceStorageConfig grants the Connect service-linked
                # role access to the Kinesis stream by adding an inline policy.
                Action:
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:CreateServiceLinkedRole
                Resource:
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/aws-service-role/connect.amazonaws.com/*'
              - Effect: Allow
                Action: [s3:PutBucketCors, s3:GetBucketCors]
                Resource: !Sub 'arn:aws:s3:::ndx-try-aicc-uploads-${AWS::AccountId}-${AWS::Region}'
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:ListBucketVersions
                  - s3:DeleteObjectVersion
                Resource:
                  - !Sub 'arn:aws:s3:::ndx-try-aicc-kb-${AWS::AccountId}-${AWS::Region}'
                  - !Sub 'arn:aws:s3:::ndx-try-aicc-kb-${AWS::AccountId}-${AWS::Region}/*'
              # Customer Profiles encrypts ObjectType data with this CMK; the
              # PutProfileObjectType call from connect-bootstrap fails without it.
              - Effect: Allow
                Action:
                  - kms:GenerateDataKey
                  - kms:GenerateDataKeyWithoutPlaintext
                  - kms:Decrypt
                  - kms:DescribeKey
                  - kms:Encrypt
                  - kms:CreateGrant
                Resource: !GetAtt CustomerProfilesKey.Arn

  CommonLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'InnovationSandbox-ndx-aicc-fn-${AWS::Region}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - { Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: sts:AssumeRole }
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: fn-permissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                  - bedrock:Retrieve
                  - bedrock:RetrieveAndGenerate
                  - bedrock:ApplyGuardrail
                  - bedrock-agent-runtime:Retrieve
                  - bedrock-agent-runtime:RetrieveAndGenerate
                Resource: '*'
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource:
                  - !Sub '${UploadBucket.Arn}/*'
                  - !Sub '${ShareBucket.Arn}/*'
              - Effect: Allow
                Action: [s3:ListBucket]
                Resource:
                  - !GetAtt UploadBucket.Arn
                  - !GetAtt ShareBucket.Arn
              - Effect: Allow
                Action: [cases:*, profile:*, customer-profiles:*]
                Resource: '*'
              - Effect: Allow
                Action:
                  - connect:StartChatContact
                  - connect:StartOutboundVoiceContact
                  - connect:StartWebRTCContact
                  - connect:StopContact
                  - connect:DescribeContact
                  - connect:DescribePhoneNumber
                  - connect:GetCurrentMetricData
                  - connect:DescribeQueue
                Resource: '*'
              - Effect: Allow
                Action: [lex:RecognizeText, lex:RecognizeUtterance]
                Resource: '*'
              - Effect: Allow
                Action: [kms:GenerateDataKey, kms:Decrypt, kms:DescribeKey]
                Resource: !GetAtt CustomerProfilesKey.Arn
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:Query, dynamodb:UpdateItem]
                Resource: !GetAtt ContactLensCacheTable.Arn
              - Effect: Allow
                Action: [lambda:InvokeFunction]
                Resource: '*'
              - Effect: Allow
                Action:
                  - kinesis:GetRecords
                  - kinesis:GetShardIterator
                  - kinesis:DescribeStream
                  - kinesis:DescribeStreamSummary
                  - kinesis:ListShards
                  - kinesis:SubscribeToShard
                Resource: !GetAtt ContactLensStream.Arn
              - Effect: Allow
                Action: [sqs:SendMessage]
                Resource: !GetAtt ContactLensDlq.Arn

  RagFulfilmentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'ndx-try-aicc-rag-${AWS::Region}'
      CodeUri: lambdas/rag-fulfilment/
      Handler: index.lambda_handler
      Timeout: 25
      MemorySize: 1024
      Role: !GetAtt CommonLambdaRole.Arn
      Environment:
        Variables:
          KB_ID: !Ref KnowledgeBase
          GUARDRAIL_ID: !Ref Guardrail
          MODEL_ARN: !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.nova-lite-v1:0'
          DDB_TABLE_NAME: !Ref ContactLensCacheTable
          MULTI_INTENT_FN_NAME: !Ref MultiIntentFunction
          CASES_DOMAIN_ID: !Ref CasesDomain

  MultiIntentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'ndx-try-aicc-multi-intent-${AWS::Region}'
      CodeUri: lambdas/multi-intent-decomposer/
      Handler: index.lambda_handler
      Timeout: 15
      Role: !GetAtt CommonLambdaRole.Arn
      Environment: { Variables: { MULTI_INTENT_MODEL_ID: !Ref GenerationModelId } }

  MultiIntentLexInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt MultiIntentFunction.Arn
      Action: lambda:InvokeFunction
      Principal: lex.amazonaws.com
      SourceArn: !Sub 'arn:aws:lex:${AWS::Region}:${AWS::AccountId}:bot-alias/*'

  MultimodalDescribeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'ndx-try-aicc-multimodal-${AWS::Region}'
      CodeUri: lambdas/multimodal-describe/
      Handler: index.lambda_handler
      Timeout: 30
      MemorySize: 1024
      Role: !GetAtt CommonLambdaRole.Arn
      Environment:
        Variables:
          MULTIMODAL_MODEL_ID: !Ref GenerationModelId
          CASES_DOMAIN_ID: !Ref CasesDomain
          CASES_TEMPLATE_ID: !GetAtt CasesTemplate.TemplateId
          IMAGE_BUCKET: !Ref UploadBucket
          PROFILES_DOMAIN: !Ref CustomerProfilesDomain
          DDB_TABLE_NAME: !Ref ContactLensCacheTable

  CompanionApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'ndx-try-aicc-companion-api-${AWS::Region}'
      CodeUri: lambdas/companion-api/
      Handler: index.lambda_handler
      Role: !GetAtt CommonLambdaRole.Arn
      Environment:
        Variables:
          UPLOAD_BUCKET: !Ref UploadBucket
          MULTIMODAL_LAMBDA_ARN: !GetAtt MultimodalDescribeFunction.Arn
          MULTI_INTENT_LAMBDA_ARN: !GetAtt MultiIntentFunction.Arn
          SHARE_PDF_LAMBDA_ARN: !GetAtt SharePdfFunction.Arn
          CASES_DOMAIN_ID: !Ref CasesDomain
          DDB_TABLE_NAME: !Ref ContactLensCacheTable
          CONNECT_INSTANCE_ID: !Ref ConnectInstance
          CONNECT_CONTACT_FLOW_ID: !Ref MainContactFlow
          CASES_TEMPLATE_ID: !GetAtt CasesTemplate.TemplateId
          PROFILES_DOMAIN: !Ref CustomerProfilesDomain
          LEX_BOT_ID: !Ref LexBot
          LEX_BOT_ALIAS_ID: !GetAtt LexBotAlias.BotAliasId
          KB_ID: !Ref KnowledgeBase
          GUARDRAIL_ID: !Ref Guardrail
          GENERATION_MODEL_ARN: !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/${GenerationModelId}'
          # Static CloudFront wildcard, the CDN-specific domain check happens in
          # the Lambda via regex on request origin. Avoids a circular dependency
          # between CompanionApiFunction -> Cdn -> CompanionApiFunctionUrl.
          ALLOWED_ORIGIN_PATTERN: '^https:\/\/[a-z0-9]+\.cloudfront\.net$'
      FunctionUrlConfig:
        # AuthType: NONE because CloudFront OAC for Lambda Function URLs has a
        # signing-mismatch bug on POST + body requests as of 2026-04. We rely on
        # CloudFront's path-based routing + AWS WAF rate limiting + the Lambda's
        # internal CORS check (ALLOWED_ORIGIN_PATTERN) for protection.
        # No URL-level CORS: the Lambda handles OPTIONS preflights itself, so a
        # forged origin gets a hard 403 instead of an auto-200 from the URL layer.
        AuthType: NONE
        InvokeMode: BUFFERED

  ContactLensConsumerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'ndx-try-aicc-contact-lens-consumer-${AWS::Region}'
      CodeUri: lambdas/contact-lens-consumer/
      Handler: index.lambda_handler
      Role: !GetAtt CommonLambdaRole.Arn
      Environment: { Variables: { DDB_TABLE_NAME: !Ref ContactLensCacheTable, TTL_SECONDS: '1800' } }
      Events:
        ContactLensStream:
          Type: Kinesis
          Properties:
            Stream: !GetAtt ContactLensStream.Arn
            BatchSize: 100
            MaximumBatchingWindowInSeconds: 1
            StartingPosition: LATEST
            MaximumRetryAttempts: 2
            BisectBatchOnFunctionError: true
            FunctionResponseTypes: [ReportBatchItemFailures]
            DestinationConfig:
              OnFailure: { Destination: !GetAtt ContactLensDlq.Arn }

  PhoneFlowAssocFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'ndx-try-aicc-phone-flow-assoc-${AWS::Region}'
      CodeUri: lambdas/phone-number-flow-association/
      Handler: index.handler
      Role: !GetAtt CustomResourceLambdaRole.Arn

  SharePdfFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'ndx-try-aicc-share-pdf-${AWS::Region}'
      CodeUri: lambdas/share-pdf-builder/
      Handler: index.lambda_handler
      MemorySize: 1024
      Timeout: 60
      Role: !GetAtt CommonLambdaRole.Arn
      Environment:
        Variables:
          DDB_TABLE_NAME: !Ref ContactLensCacheTable
          SHARE_BUCKET: !Ref ShareBucket
          SHARE_PRESIGN_TTL: '86400'
          CASES_DOMAIN_ID: !Ref CasesDomain
      # Uses fpdf2 (pure Python) bundled into the Lambda zip via requirements.txt.

  DeployTimeVerificationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'ndx-try-aicc-deploy-verify-${AWS::Region}'
      CodeUri: lambdas/deploy-time-verification/
      Handler: index.handler
      Role: !GetAtt CustomResourceLambdaRole.Arn

  SeedKbFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'ndx-try-aicc-seed-kb-${AWS::Region}'
      CodeUri: lambdas/seed-kb/
      Handler: index.handler
      Timeout: 900
      Role: !GetAtt CustomResourceLambdaRole.Arn

  SeedKbInvocation:
    Type: Custom::SeedKb
    DependsOn: KnowledgeBaseDataSource
    Properties:
      ServiceToken: !GetAtt SeedKbFunction.Arn
      KnowledgeBaseId: !Ref KnowledgeBase
      DataSourceId: !GetAtt KnowledgeBaseDataSource.DataSourceId
      KbSourceBucket: !Ref KbSourceBucket
      # Forcing field: bumped via CorpusVersion parameter after `aws s3 sync` so
      # CFN re-fires this custom resource and the seed Lambda re-ingests.
      CorpusVersion: !Ref CorpusVersion

  # ============================================================
  # PHASE 7: Customer Profiles + ConnectCases
  # ============================================================
  # Connect-Customer Profiles binding is auto-discovery: when the
  # CustomerProfiles::Domain exists in the same account+region as the Connect
  # instance, the contact flow can call customer-profiles:SearchProfiles
  # directly from Lambda. No explicit association resource is required (no
  # IntegrationType: CUSTOMER_PROFILES exists on Connect::IntegrationAssociation).
  # Phase 0.6 spike output: spikes/customer-profiles-wiring.md.
  CustomerProfilesKey:
    Type: AWS::KMS::Key
    Properties:
      Description: Customer-managed CMK for AI Contact Centre Customer Profiles domain
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - { Sid: AllowAccountRoot, Effect: Allow,
              Principal: { AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root' },
              Action: 'kms:*', Resource: '*' }
          - { Sid: AllowCustomerProfiles, Effect: Allow,
              Principal: { Service: profile.amazonaws.com },
              Action: ['kms:Encrypt', 'kms:Decrypt', 'kms:GenerateDataKey*', 'kms:DescribeKey', 'kms:CreateGrant'],
              Resource: '*' }

  CustomerProfilesDomain:
    Type: AWS::CustomerProfiles::Domain
    DependsOn: ConnectInstanceActiveWait
    Properties:
      DomainName: !Sub 'ndx-try-aicc-${AWS::AccountId}'
      DefaultExpirationDays: 30
      DefaultEncryptionKey: !GetAtt CustomerProfilesKey.Arn

  # AWS::ConnectCases::* CFN types are not available in this region/account.
  # Use a Custom resource Lambda that calls the connectcases API.
  ConnectCasesResourcesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'ndx-try-aicc-cases-cr-${AWS::Region}'
      CodeUri: lambdas/connect-cases-resources/
      Handler: index.handler
      Timeout: 60
      Role: !GetAtt CustomResourceLambdaRole.Arn

  CasesDomain:
    Type: Custom::CasesDomain
    DependsOn: CustomerProfilesDomain
    Properties:
      ServiceToken: !GetAtt ConnectCasesResourcesFunction.Arn
      Kind: Domain
      Name: !Sub 'ndx-try-aicc-${AWS::AccountId}'

  CasesFieldPhone:
    Type: Custom::CasesField
    Properties:
      ServiceToken: !GetAtt ConnectCasesResourcesFunction.Arn
      Kind: Field
      DomainId: !Ref CasesDomain
      Name: customer_phone_number
      Type: Text
      Description: Caller's phone in E.164

  CasesFieldAddress:
    Type: Custom::CasesField
    Properties:
      ServiceToken: !GetAtt ConnectCasesResourcesFunction.Arn
      Kind: Field
      DomainId: !Ref CasesDomain
      Name: address
      Type: Text
      Description: Address (placeholder-redacted)

  CasesFieldIntentCategory:
    Type: Custom::CasesField
    Properties:
      ServiceToken: !GetAtt ConnectCasesResourcesFunction.Arn
      Kind: Field
      DomainId: !Ref CasesDomain
      Name: intent_category
      Type: Text

  CasesFieldIntents:
    Type: Custom::CasesField
    Properties:
      ServiceToken: !GetAtt ConnectCasesResourcesFunction.Arn
      Kind: Field
      DomainId: !Ref CasesDomain
      Name: intents
      Type: Text

  CasesFieldSafeguardingFlag:
    Type: Custom::CasesField
    Properties:
      ServiceToken: !GetAtt ConnectCasesResourcesFunction.Arn
      Kind: Field
      DomainId: !Ref CasesDomain
      Name: safeguarding_flag
      Type: Boolean

  CasesFieldMultimodalSummary:
    Type: Custom::CasesField
    Properties:
      ServiceToken: !GetAtt ConnectCasesResourcesFunction.Arn
      Kind: Field
      DomainId: !Ref CasesDomain
      Name: multimodal_summary
      Type: Text

  CasesFieldAttachmentsSummary:
    Type: Custom::CasesField
    Properties:
      ServiceToken: !GetAtt ConnectCasesResourcesFunction.Arn
      Kind: Field
      DomainId: !Ref CasesDomain
      Name: attachments_summary
      Type: Text

  CasesFieldSeverity:
    Type: Custom::CasesField
    Properties:
      ServiceToken: !GetAtt ConnectCasesResourcesFunction.Arn
      Kind: Field
      DomainId: !Ref CasesDomain
      Name: severity
      Type: Text

  CasesLayout:
    Type: Custom::CasesLayout
    Properties:
      ServiceToken: !GetAtt ConnectCasesResourcesFunction.Arn
      Kind: Layout
      DomainId: !Ref CasesDomain
      Name: aicc-default-layout
      ContentJson: !Sub
        - '{"basic":{"topPanel":{"sections":[{"fieldGroup":{"name":"header","fields":[{"id":"${PhoneId}"},{"id":"${IntentCatId}"},{"id":"${SgFlagId}"}]}}]},"moreInfo":{"sections":[{"fieldGroup":{"name":"details","fields":[{"id":"${AddressId}"},{"id":"${IntentsId}"},{"id":"${MultiSummaryId}"},{"id":"${SeverityId}"},{"id":"${AttachSumId}"}]}}]}}}'
        - PhoneId:        !GetAtt CasesFieldPhone.FieldId
          IntentCatId:    !GetAtt CasesFieldIntentCategory.FieldId
          SgFlagId:       !GetAtt CasesFieldSafeguardingFlag.FieldId
          AddressId:      !GetAtt CasesFieldAddress.FieldId
          IntentsId:      !GetAtt CasesFieldIntents.FieldId
          MultiSummaryId: !GetAtt CasesFieldMultimodalSummary.FieldId
          SeverityId:     !GetAtt CasesFieldSeverity.FieldId
          AttachSumId:    !GetAtt CasesFieldAttachmentsSummary.FieldId

  CasesTemplate:
    Type: Custom::CasesTemplate
    Properties:
      ServiceToken: !GetAtt ConnectCasesResourcesFunction.Arn
      Kind: Template
      DomainId: !Ref CasesDomain
      Name: aicc-default-template
      LayoutId: !GetAtt CasesLayout.LayoutId
      RequiredFieldIds:
        - !GetAtt CasesFieldPhone.FieldId

  # ============================================================
  # PHASE 8: IntegrationAssociations
  # ============================================================
  IaLexBot:
