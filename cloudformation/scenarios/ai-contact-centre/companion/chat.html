<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NDX:Try AI Contact Centre, Chat Test</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .chat-page { max-width: 760px; margin: 24px auto; padding: 0 24px;
      display: grid; grid-template-rows: auto 1fr auto auto; gap: 12px;
      height: calc(100vh - 48px); }
    .chat-header h1 { margin: 0 0 6px; font-size: 22px; }
    .chat-header p  { margin: 0; color: #555; font-size: 14px; }
    .chat-log { border: 1px solid var(--ndx-grey-2); border-radius: 6px;
      padding: 14px; background: white; overflow-y: auto; font-size: 14px; line-height: 1.4; }
    .chat-msg { margin-bottom: 10px; padding: 8px 12px; border-radius: 14px;
      max-width: 85%; word-wrap: break-word; }
    .chat-msg--system   { background: #eef4fa; border-bottom-left-radius: 4px; }
    .chat-msg--customer { background: #00703c; color: white; border-bottom-right-radius: 4px; margin-left: auto; }
    .chat-msg--event    { color: #6f777b; font-size: 12px; font-style: italic; text-align: center; }
    .chat-msg--multi    { background: #fff8e1; border-left: 4px solid #f0a020; border-radius: 6px; }
    .chat-multi-intent  { background: white; border: 1px solid var(--ndx-grey-2); border-radius: 6px;
      padding: 10px; margin-bottom: 8px; }
    .chat-multi-intent__head { font-weight: 700; font-size: 13px; margin-bottom: 4px; }
    .chat-meta { font-size: 11px; color: #6f777b; margin-top: 6px; }
    .chat-cite { display: inline-block; background: #fff8e1; border-radius: 12px; padding: 2px 8px; margin-right: 4px; font-size: 11px; }
    .chat-input { display: flex; gap: 8px; }
    .chat-input input { flex: 1; padding: 10px 12px; font: inherit;
      border: 2px solid var(--ndx-text); border-radius: 4px; }
    .chat-status { font-size: 12px; color: #565656; text-align: center; }
    .safeguarding-badge { display: inline-block; background: #d4351c; color: white;
      padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; margin-left: 6px; }
  </style>
</head>
<body>
  <div class="chat-page">
    <div class="chat-header">
      <h1>AI Contact Centre, chat test</h1>
      <p>Calls Lex (intent matching) + Bedrock multi-intent decomposer + Bedrock Knowledge Base + Guardrails. Try a single question or string several together with "and".</p>
    </div>
    <div class="chat-log" id="log">
      <div class="chat-msg chat-msg--event">Type a message below to start.</div>
      <div class="chat-msg chat-msg--system">Welcome to Aldershire District Council. How can I help?</div>
    </div>
    <form class="chat-input" id="form">
      <input type="text" id="input" placeholder="One issue, or several joined with 'and'..." autocomplete="off">
      <button type="submit" class="ndx-button ndx-button--primary" id="send">Send</button>
    </form>
    <div class="chat-status" id="status">Ready.</div>
    <div style="text-align:center; margin-top:6px;">
      <button type="button" class="ndx-button ndx-button--secondary" id="climax-btn" style="font-size: 13px; padding: 6px 12px;">I'd like an update on my case (+44 7700 900123)</button>
    </div>
  </div>

  <script>
  /* eslint-env browser */
  (() => {
    "use strict";
    const log = document.getElementById("log");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const statusEl = document.getElementById("status");
    const form = document.getElementById("form");
    const sessionId = "anon-" + Math.random().toString(36).slice(2, 12);

    function status(t) { statusEl.textContent = t; }

    function appendCustomer(text) {
      const div = document.createElement("div");
      div.classList.add("chat-msg", "chat-msg--customer");
      div.textContent = text;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    function citeHtml(cites) {
      return (cites && cites.length)
        ? "sources: " + cites.map(c => `<span class="chat-cite">${c}</span>`).join("")
        : "";
    }

    function caseHtml(caseId) {
      if (!caseId) return "";
      const ref = caseId.slice(0, 8).toUpperCase();
      return ` · case <strong>${ref}</strong>`;
    }

    function appendSingle(data) {
      const div = document.createElement("div");
      div.classList.add("chat-msg", "chat-msg--system");
      const meta = `intent: <strong>${data.intent}</strong> (confidence ${(data.intent_confidence||0).toFixed(2)})` +
                   caseHtml(data.case_id) +
                   (data.guardrail_intervened ? " · <span style='color:#d4351c'>guardrail intervened</span>" : "") +
                   (data.citations && data.citations.length ? " · " + citeHtml(data.citations) : "");
      div.innerHTML = `${escapeHtml(data.answer || "(no answer)")}<div class="chat-meta">${meta}</div>`;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    function appendMulti(data) {
      const wrapper = document.createElement("div");
      wrapper.classList.add("chat-msg", "chat-msg--multi");
      const sgBadge = data.requires_safeguarding_review
        ? '<span class="safeguarding-badge">SAFEGUARDING</span>' : "";
      const truncated = (data.truncated_intents && data.truncated_intents.length)
        ? `<div class="chat-meta">Held for follow-up: ${data.truncated_intents.join(", ")}</div>` : "";
      const caseRef = data.case_id ? `<div class="chat-meta">Single case opened: <strong>${data.case_id.slice(0,8).toUpperCase()}</strong></div>` : "";
      let html = `<div class="chat-multi-intent__head">I heard ${data.answers.length} thing(s) ${sgBadge}</div>${caseRef}`;
      data.answers.forEach((a) => {
        html += `<div class="chat-multi-intent">
          <div class="chat-multi-intent__head">${a.intent} (confidence ${(a.confidence||0).toFixed(2)})</div>
          <div>${escapeHtml(a.answer || "(no answer)")}</div>
          <div class="chat-meta">"${escapeHtml(a.verbatim || "")}" · ${citeHtml(a.citations)}${a.guardrail_intervened ? " · <span style='color:#d4351c'>guardrail intervened</span>" : ""}</div>
        </div>`;
      });
      html += truncated;
      wrapper.innerHTML = html;
      log.appendChild(wrapper);
      log.scrollTop = log.scrollHeight;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    document.getElementById("climax-btn").addEventListener("click", async () => {
      const r = await fetch("/api/climax", {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ sender_phone: "+447700900123" }),
      });
      const data = await r.json();
      const div = document.createElement("div");
      div.classList.add("chat-msg", "chat-msg--system");
      div.style.background = "#fff8e1";
      div.style.borderLeft = "6px solid #f0a020";
      div.style.fontWeight = "700";
      div.style.fontSize = "16px";
      div.style.padding = "16px";
      div.textContent = data.line || "(no climax available)";
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      appendCustomer(text);
      sendBtn.disabled = true;
      status("Thinking...");
      try {
        const r = await fetch("/api/ask", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ utterance: text, session_id: sessionId }),
        });
        const data = await r.json();
        if (data.mode === "multi_intent") appendMulti(data);
        else                              appendSingle(data);
        status("Ready.");
      } catch (err) {
        const div = document.createElement("div");
        div.classList.add("chat-msg", "chat-msg--event");
        div.textContent = "Error: " + err;
        log.appendChild(div);
        status("Error.");
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    });
    input.focus();
  })();
  </script>
</body>
</html>
