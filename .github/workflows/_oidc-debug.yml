name: _oidc-debug (one-shot)

# DELETE THIS FILE AFTER THE INVESTIGATION CLOSES.
#
# Decodes the GH Actions OIDC token to confirm which claims are present.
# Used to diagnose the "repository_owner condition fails OIDC assume" finding
# from the adversarial review of the smoke-pack tech-spec PR chain.

on:
  workflow_dispatch:
  push:
    branches: [feat/smoke-test-account-config-1b]
    paths: ['.github/workflows/_oidc-debug.yml']

permissions:
  id-token: write
  contents: read

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - name: Request OIDC token + decode middle segment
        run: |
          set -euo pipefail
          # Request a token with the same audience the smoke workflow uses.
          IDTOKEN=$(curl -sSL \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | jq -r .value)

          # JWT = header.payload.signature. Print the payload (middle segment).
          PAYLOAD=$(echo "$IDTOKEN" | cut -d. -f2 \
            | tr '_-' '/+' \
            | awk '{ pad = length($0) % 4; if (pad) printf "%s%s", $0, substr("===", 1, 4-pad); else print $0 }' \
            | base64 -d 2>/dev/null || echo '{"decode":"failed"}')
          echo "$PAYLOAD" | jq '.'

          # Confirm specific claims of interest for the trust policy.
          echo "---"
          echo "Claims relevant to the trust policy:"
          echo "  aud:               $(echo "$PAYLOAD" | jq -r '.aud // "MISSING"')"
          echo "  iss:               $(echo "$PAYLOAD" | jq -r '.iss // "MISSING"')"
          echo "  sub:               $(echo "$PAYLOAD" | jq -r '.sub // "MISSING"')"
          echo "  repository:        $(echo "$PAYLOAD" | jq -r '.repository // "MISSING"')"
          echo "  repository_owner:  $(echo "$PAYLOAD" | jq -r '.repository_owner // "MISSING"')"
          echo "  repository_id:     $(echo "$PAYLOAD" | jq -r '.repository_id // "MISSING"')"
          echo "  workflow:          $(echo "$PAYLOAD" | jq -r '.workflow // "MISSING"')"
          echo "  workflow_ref:      $(echo "$PAYLOAD" | jq -r '.workflow_ref // "MISSING"')"
          echo "  event_name:        $(echo "$PAYLOAD" | jq -r '.event_name // "MISSING"')"
