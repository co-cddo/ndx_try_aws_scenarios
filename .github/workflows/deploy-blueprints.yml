name: Deploy ISB Blueprints

on:
  push:
    branches: [main]
    paths:
      - 'cloudformation/scenarios/*/template.yaml'
      - 'cloudformation/scenarios/planning-ai/**'
      - 'cloudformation/scenarios/localgov-drupal/cdk/**'
      - 'cloudformation/scenarios/localgov-ims/**'
      - 'cloudformation/scenarios/simply-readable/cdk/**'
      - 'cloudformation/scenarios/simply-readable/scripts/**'
      - 'cloudformation/scenarios/minute/cdk/**'
      - 'cloudformation/scenarios/fixmystreet/cdk/**'
      - 'cloudformation/scenarios/paperless-ngx/cdk/**'
      - 'cloudformation/scenarios/ai-contact-centre/**'
      - 'cloudformation/scenarios/planx/cdk/**'
      - 'cloudformation/scenarios/bops-planning/cdk/**'
      - 'cloudformation/scenarios/digital-planning-register/cdk/**'
      - 'cloudformation/isb-hub/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-blueprints
  cancel-in-progress: false

jobs:
  # Standard CDK scenarios: TypeScript CDK in cloudformation/scenarios/<name>/cdk
  # producing one stack named in the matrix. Each entry's cdk.json sets
  # `output: ../cdk.out`, so `cdk synth` writes to the scenario root's cdk.out/
  # directory. The strip step reads from there and writes template.yaml at the
  # scenario root. `lint-retention-policies.sh` then enforces the retention bar,
  # bootstrap-residue check, and template-size limit (replacing per-job inline
  # validations).
  #
  # The matrix only varies on three knobs:
  #   - name:      scenario directory name
  #   - stack:     CDK stack name (used by the strip step to find the template)
  #   - run-tests: run `npm test` (only enabled where meaningful test files exist)
  #
  # Lockfile presence is detected at runtime (npm ci vs npm install) so the
  # matrix entries don't need a flag for it. simply-readable is special-cased
  # below (upstream clone, React build, Lambda asset packaging).
  synth-cdk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - name: localgov-drupal
            stack: LocalGovDrupalStack
            run-tests: true
          - name: localgov-ims
            stack: LocalGovImsStack
          - name: minute
            stack: MinuteStack
          - name: fixmystreet
            stack: FixMyStreetStack
          - name: paperless-ngx
            stack: PaperlessNgxStack
          - name: planx
            stack: PlanxStack
          - name: bops-planning
            stack: BopsPlanningStack
          - name: digital-planning-register
            stack: DigitalPlanningRegisterStack
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'

      - name: Install + build + synth (${{ matrix.scenario.name }})
        working-directory: cloudformation/scenarios/${{ matrix.scenario.name }}/cdk
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
          npm run build
          npx cdk synth

      - name: Test (${{ matrix.scenario.name }})
        if: matrix.scenario.run-tests
        working-directory: cloudformation/scenarios/${{ matrix.scenario.name }}/cdk
        run: npm test

      - name: Strip bootstrap cruft and write template
        working-directory: cloudformation/scenarios/${{ matrix.scenario.name }}
        env:
          STACK: ${{ matrix.scenario.stack }}
        run: node ../../../scripts/strip-cdk-template.cjs

      - name: Retention-policy lint
        run: ./scripts/lint-retention-policies.sh cloudformation/scenarios/${{ matrix.scenario.name }}/template.yaml

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.scenario.name }}-template
          path: cloudformation/scenarios/${{ matrix.scenario.name }}/template.yaml
          retention-days: 1

  synth-simply-readable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'

      - name: Clone upstream document-translation
        run: |
          git clone --depth 1 --branch v3.4.0 \
            https://github.com/aws-samples/document-translation.git \
            cloudformation/scenarios/simply-readable/.upstream

      - name: Build React website
        working-directory: cloudformation/scenarios/simply-readable
        run: node scripts/build-website.cjs

      - name: Install CDK dependencies
        run: |
          cd cloudformation/scenarios/simply-readable/cdk && npm install
          cd ../../../..
          cd cloudformation/scenarios/simply-readable/.upstream/infrastructure && npm install

      - name: CDK synth
        working-directory: cloudformation/scenarios/simply-readable/cdk
        run: npx cdk synth

      - name: Package template (rewrite bootstrap refs, zip Lambda assets)
        working-directory: cloudformation/scenarios/simply-readable
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const { execSync } = require('child_process');

            const CDK_OUT = 'cdk/cdk.out';
            const template = JSON.parse(fs.readFileSync(CDK_OUT + '/SimplyReadableStack.template.json', 'utf8'));
            const assets = JSON.parse(fs.readFileSync(CDK_OUT + '/SimplyReadableStack.assets.json', 'utf8'));

            // Strip CDK bootstrap metadata
            delete template.Parameters?.BootstrapVersion;
            delete template.Resources?.CDKMetadata;
            delete template.Rules?.CheckBootstrapVersion;

            // Zip Lambda assets
            const assetEntries = Object.entries(assets.files).filter(([, m]) => m.source.packaging === 'zip');
            fs.mkdirSync('dist/asset-zips', { recursive: true });

            for (const [hash, meta] of assetEntries) {
              const assetDir = path.join(CDK_OUT, meta.source.path);
              if (!fs.existsSync(assetDir)) continue;
              execSync('cd \"' + assetDir + '\" && zip -qr \"' + path.resolve('dist/asset-zips/' + hash + '.zip') + '\" .');
            }

            // Rewrite Lambda S3 references: CDK bootstrap bucket → BlueprintsBucketName param
            const ASSETS_PREFIX = 'scenarios/simply-readable/assets';
            for (const [, resource] of Object.entries(template.Resources)) {
              if (resource.Type !== 'AWS::Lambda::Function') continue;
              const code = resource.Properties?.Code;
              if (!code?.S3Bucket?.['Fn::Sub'] || !code.S3Bucket['Fn::Sub'].includes('cdk-hnb659fds-assets')) continue;
              code.S3Bucket = { Ref: 'BlueprintsBucketName' };
              code.S3Key = ASSETS_PREFIX + '/' + code.S3Key;
            }

            // Validate
            const str = JSON.stringify(template);
            if (str.includes('cdk-hnb659fds') || str.includes('AssetParameters')) {
              console.error('ERROR: Template still contains CDK bootstrap references');
              process.exit(1);
            }

            const content = '# Auto-generated from CDK synthesis. Do not edit.\n' + JSON.stringify(template, null, 2);
            fs.writeFileSync('template.yaml', content);
            const size = Buffer.byteLength(content);
            console.log('Wrote template.yaml (' + size + ' bytes, ' + Object.keys(template.Resources || {}).length + ' resources)');
            console.log('Zipped ' + assetEntries.length + ' Lambda assets');
          "

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: simply-readable-template
          path: cloudformation/scenarios/simply-readable/template.yaml
          retention-days: 1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: simply-readable-assets
          path: cloudformation/scenarios/simply-readable/dist/asset-zips/
          retention-days: 1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: simply-readable-website
          path: cloudformation/scenarios/simply-readable/website-build/
          retention-days: 1

  # Retention-policy lint over hand-authored CFN templates that don't pass
  # through a synth job. The lint script also catches oversize templates and
  # AssetParameters / cdk-bootstrap residue.
  lint-committed-templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install yq (for real-YAML template parsing)
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Lint committed scenario templates
        run: |
          # Scenarios whose template.yaml is committed (not synthesized in CI).
          # Synthesized scenarios are linted by their per-scenario synth job.
          ./scripts/lint-retention-policies.sh \
            cloudformation/scenarios/council-chatbot/template.yaml \
            cloudformation/scenarios/foi-redaction/template.yaml \
            cloudformation/scenarios/planning-ai/template.yaml \
            cloudformation/scenarios/smart-car-park/template.yaml \
            cloudformation/scenarios/text-to-speech/template.yaml \
            cloudformation/scenarios/quicksight-dashboard/template.yaml \
            cloudformation/scenarios/ai-contact-centre/template.yaml

  deploy:
    needs:
      - synth-cdk
      - synth-simply-readable
      - lint-committed-templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: localgov-drupal-template
          path: cloudformation/scenarios/localgov-drupal

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: localgov-ims-template
          path: cloudformation/scenarios/localgov-ims

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: minute-template
          path: cloudformation/scenarios/minute

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: fixmystreet-template
          path: cloudformation/scenarios/fixmystreet

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: paperless-ngx-template
          path: cloudformation/scenarios/paperless-ngx

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: simply-readable-template
          path: cloudformation/scenarios/simply-readable

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: simply-readable-assets
          path: cloudformation/scenarios/simply-readable/dist/asset-zips

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: simply-readable-website
          path: cloudformation/scenarios/simply-readable/website-build

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: planx-template
          path: cloudformation/scenarios/planx

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: bops-planning-template
          path: cloudformation/scenarios/bops-planning

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: digital-planning-register-template
          path: cloudformation/scenarios/digital-planning-register

      - name: Build planning-ai template (inject PDF + text into template)
        run: python3 cloudformation/scenarios/planning-ai/build-template.py -o cloudformation/scenarios/planning-ai/template.yaml

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: cloudformation/isb-hub/package-lock.json

      - uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6
        with:
          role-to-assume: arn:aws:iam::568672915267:role/isb-hub-github-actions-deploy
          aws-region: us-west-2

      - name: Upload Simply Readable assets and website to S3
        run: |
          BUCKET=ndx-try-isb-blueprints-568672915267
          aws s3 sync cloudformation/scenarios/simply-readable/dist/asset-zips/ \
            "s3://${BUCKET}/scenarios/simply-readable/assets/" --region us-east-1
          aws s3 sync cloudformation/scenarios/simply-readable/website-build/ \
            "s3://${BUCKET}/scenarios/simply-readable/website-build/" --region us-east-1 --delete

      # AI Contact Centre: SAM-style scenario. `sam package` zips each Lambda
      # CodeUri, uploads zips to the blueprints bucket, and writes a packaged
      # template (with absolute s3:// CodeUri values) to dist/template.yaml.
      # The hub CDK then uploads dist/template.yaml as the StackSet template.
      # No `sam build` needed: lambdas are pure Python with no native deps.
      - uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3
        with:
          use-installer: true

      - name: Package AI Contact Centre (sam package)
        working-directory: cloudformation/scenarios/ai-contact-centre
        run: |
          mkdir -p dist
          sam package \
            --template-file template.yaml \
            --output-template-file dist/template.yaml \
            --s3-bucket ndx-try-isb-blueprints-568672915267 \
            --s3-prefix scenarios/ai-contact-centre/assets \
            --region us-east-1

      - name: Verify AI Contact Centre packaged CodeUri targets the blueprints bucket
        run: ./scripts/verify-sam-package-bucket.sh cloudformation/scenarios/ai-contact-centre/dist/template.yaml ndx-try-isb-blueprints-568672915267

      - run: npm ci
        working-directory: cloudformation/isb-hub

      - name: Deploy ISB Hub stack
        working-directory: cloudformation/isb-hub
        run: >-
          npx cdk deploy --require-approval never
          --parameters GovUkPayApiKey=${{ secrets.GOVUKPAY_SANDBOX_API_KEY }}
          --parameters OSVectorTilesApiKey=${{ secrets.OS_VECTOR_TILES_API_KEY }}
        env:
          GOVUKPAY_SANDBOX_API_KEY: ${{ secrets.GOVUKPAY_SANDBOX_API_KEY }}
          OS_VECTOR_TILES_API_KEY: ${{ secrets.OS_VECTOR_TILES_API_KEY }}
