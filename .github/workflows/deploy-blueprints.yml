      - synth-localgov-drupal
      - synth-localgov-ims
      - synth-simply-readable
      - synth-minute
      - synth-fixmystreet
      - synth-paperless-ngx
      - synth-planx
      - synth-bops-planning
      - synth-digital-planning-register
      - lint-committed-templates
