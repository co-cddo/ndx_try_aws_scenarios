name: AICC Claim PSTN (one-shot)

# Operator-triggered: claims a UK +44 DID phone number in the smoke account
# against the currently-deployed ai-contact-centre Connect instance, then
# prints the ARN + number for the operator to record in
# docs/smoke-test-account-config.yml.
#
# Why workflow_dispatch (not a manual aws-cli call): the smoke account's
# Restrictions SCP denies connect:* on principals whose role name doesn't
# match InnovationSandbox-ndx-*. This workflow assumes the
# InnovationSandbox-ndx-SmokeTestDeployRole via GitHub OIDC, so the calls
# come from a prefix-matching principal and pass the SCP.
#
# Pre-conditions: an ai-contact-centre stack with an ACTIVE Connect instance
# must already exist in the smoke account.

on:
  workflow_dispatch:
    inputs:
      country:
        description: 'Phone number country (GB or US)'
        required: false
        default: 'GB'
        type: choice
        options: [GB, US]

permissions:
  id-token: write
  contents: read

jobs:
  claim:
    runs-on: ubuntu-latest
    environment: smoke-test-deploy
    steps:
      - uses: actions/checkout@v6

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.45.4/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Read smoke config
        id: cfg
        run: |
          echo "role_arn=$(yq -r '.smoke_test_deploy_role_arn' docs/smoke-test-account-config.yml)" >> "$GITHUB_OUTPUT"
          echo "region=$(yq -r '.smoke_test_region' docs/smoke-test-account-config.yml)" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ steps.cfg.outputs.role_arn }}
          aws-region: ${{ steps.cfg.outputs.region }}

      - name: Find the ai-contact-centre Connect instance
        id: instance
        run: |
          set -euo pipefail
          ID=$(aws connect list-instances \
            --query "InstanceSummaryList[?starts_with(InstanceAlias, 'ndx-try-aicc-') && InstanceStatus=='ACTIVE'] | [0].Id" \
            --output text)
          if [ -z "$ID" ] || [ "$ID" = "None" ]; then
            echo "ERROR: no ACTIVE ai-contact-centre Connect instance found" >&2
            exit 1
          fi
          ARN=$(aws connect describe-instance --instance-id "$ID" --query 'Instance.Arn' --output text)
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"
          echo "Instance: $ARN"

      - name: Search + claim a ${{ inputs.country }} DID
        id: claim
        run: |
          set -euo pipefail
          NUMBER=$(aws connect search-available-phone-numbers \
            --target-arn '${{ steps.instance.outputs.arn }}' \
            --phone-number-country-code '${{ inputs.country }}' \
            --phone-number-type DID \
            --max-results 1 \
            --query 'AvailableNumbersList[0].PhoneNumber' --output text)
          if [ -z "$NUMBER" ] || [ "$NUMBER" = "None" ]; then
            echo "ERROR: no available ${{ inputs.country }} DIDs" >&2
            exit 1
          fi
          echo "Claiming: $NUMBER"
          RESULT=$(aws connect claim-phone-number \
            --target-arn '${{ steps.instance.outputs.arn }}' \
            --phone-number "$NUMBER" \
            --output json)
          ARN=$(echo "$RESULT" | jq -r .PhoneNumberArn)
          ID=$(echo "$RESULT" | jq -r .PhoneNumberId)
          echo ""
          echo "==============================================="
          echo "CLAIMED — record these in docs/smoke-test-account-config.yml:"
          echo ""
          echo "  aicc_existing_phone_number_arn: \"$ARN\""
          echo "  aicc_existing_phone_number: \"$NUMBER\""
          echo "==============================================="
          echo "phone_arn=$ARN" >> "$GITHUB_OUTPUT"
          echo "phone_number=$NUMBER" >> "$GITHUB_OUTPUT"
          echo "phone_id=$ID" >> "$GITHUB_OUTPUT"
