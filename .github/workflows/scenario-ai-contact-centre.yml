name: Scenario / ai-contact-centre

# NAP-564: scenario-ci.yml runs `sam package` before deploy for SAM scenarios;
# CIDeployRole grants ds:*, kinesis:*, cases:*, voiceid:* for Connect.

on:
  pull_request:
    paths:
      - 'cloudformation/scenarios/ai-contact-centre/**'
      - '.github/workflows/scenario-ci.yml'
      - '.github/workflows/scenario-ai-contact-centre.yml'
      - 'scripts/isb/**'
      - 'tests/smoke/**'
  workflow_dispatch:
    inputs:
      reuse_account_id:
        description: 'DEBUG: reuse an already-leased account (set via `isb assign` locally). Skips acquire/release.'
        required: false
        type: string
        default: ''
concurrency:
  # Repo-wide group across ALL scenario callers because ISB caps ci-bot
  # at 1 active lease at a time (maxLeasesPerUser). Concurrent dispatches
  # would 409. Serialise here so each scenario gets a turn.
  # TEMPORARY (NAP-564): per-branch suffix to dodge a zombie pending run
  # from the 2026-05-26 GH Actions incident that we can neither cancel nor
  # garbage-collect. Revert to plain `scenario-ci-pool` before merge.
  group: scenario-ci-pool-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  smoke:
    uses: ./.github/workflows/scenario-ci.yml
    with:
      scenario: ai-contact-centre
      reuse_account_id: ${{ inputs.reuse_account_id || '' }}
    secrets: inherit
