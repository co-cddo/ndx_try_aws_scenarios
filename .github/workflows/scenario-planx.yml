name: Scenario / planx

on:
  pull_request:
    paths:
      - 'cloudformation/scenarios/planx/**'
      - '.github/workflows/scenario-ci.yml'
      - '.github/workflows/scenario-planx.yml'
      - 'scripts/isb/**'
      - 'tests/smoke/**'
  workflow_dispatch:

concurrency:
  group: scenario-planx-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    uses: ./.github/workflows/scenario-ci.yml
    with:
      scenario: planx
    secrets: inherit
