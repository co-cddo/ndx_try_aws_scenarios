name: Scenario / quicksight-dashboard

on:
  pull_request:
    paths:
      - 'cloudformation/scenarios/quicksight-dashboard/**'
      - '.github/workflows/scenario-ci.yml'
      - '.github/workflows/scenario-quicksight-dashboard.yml'
      - 'scripts/isb/**'
      - 'tests/smoke/**'
  workflow_dispatch:

concurrency:
  group: scenario-quicksight-dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    uses: ./.github/workflows/scenario-ci.yml
    with:
      scenario: quicksight-dashboard
    secrets: inherit
