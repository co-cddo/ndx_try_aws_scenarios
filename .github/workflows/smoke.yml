name: Smoke Pack

# Scenario-regression smoke pack. Deploys all-demo (or a scoped subset) into
# the long-lived smoke-test AWS account, runs the per-scenario Playwright
# smoke specs, and tears the deploy down again. Phase 3 / T3.6 of the
# scenario-regression smoke-pack tech-spec.

on:
  # PR: scoped smoke — only scenarios whose paths changed run. Keeps the PR
  # feedback loop under 20 min.
  pull_request:
    paths:
      - 'cloudformation/scenarios/**'
      - 'tests/smoke/**'
      - 'scripts/smoke.sh'
      - 'playwright.config.ts'
      - 'docs/smoke-test-account-config.yml'
      - '.github/workflows/smoke.yml'
      - 'package.json'

  # Nightly full smoke at 02:00 UTC.
  schedule:
    - cron: '0 2 * * *'

  # Merge-verification full smoke.
  push:
    branches: [main]

  # Ad-hoc full smoke for manual rails verification.
  workflow_dispatch:

permissions:
  id-token: write    # OIDC role assumption
  contents: read     # repo checkout
  issues: write      # failure notifications, drift tracking
  pull-requests: read

# Only one smoke run at a time to keep the account's quota envelope sane and
# avoid pre-deploy state-check thrash. PRs cancel each other; nightly + main
# do not cancel each other or PRs (cancel-in-progress: false for cron/push).
concurrency:
  group: smoke-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || format('global-{0}', github.event_name) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  STACK_NAME: all-demo
  AWS_REGION: us-east-1

jobs:
  # Phase 3 / T3.6 — Decide which scenarios to deploy. Rails-changes (paths
  # under tests/smoke/fixtures, scripts/smoke.sh, playwright.config.ts,
  # all-demo/template.yaml, etc.) force a full deploy because they affect
  # every scenario. Per-scenario path changes deploy that scenario only.
  scope:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.decide.outputs.mode }}   # 'full' | 'scoped' | 'none'
      scenarios: ${{ steps.decide.outputs.scenarios }}   # JSON array
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: decide
        run: |
          set -euo pipefail
          EVENT="${{ github.event_name }}"
          if [ "$EVENT" = "schedule" ] || [ "$EVENT" = "workflow_dispatch" ] || [ "$EVENT" = "push" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo 'scenarios=["all-demo"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # PR scope: compare against base ref.
          git fetch origin "${{ github.base_ref }}" --depth 1
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)
          echo "Changed paths:"
          echo "$CHANGED" | sed 's/^/  /'

          # Rails paths force full smoke.
          if echo "$CHANGED" | grep -qE '^(scripts/smoke\.sh|playwright\.config\.ts|tests/smoke/fixtures/|cloudformation/scenarios/all-demo/|\.github/workflows/smoke\.yml|docs/smoke-test-account-config\.yml|package\.json)'; then
            echo "Rails change detected — full smoke"
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo 'scenarios=["all-demo"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Per-scenario paths.
          SCENARIOS=$(echo "$CHANGED" \
            | grep -oE '(cloudformation/scenarios/[a-z0-9-]+|tests/smoke/[a-z0-9-]+)' \
            | sed -E 's#(cloudformation/scenarios/|tests/smoke/)##' \
            | grep -v -E '^(all-demo|fixtures)$' \
            | sort -u || true)

          if [ -z "$SCENARIOS" ]; then
            echo "No scenario paths changed — skipping smoke"
            echo "mode=none" >> "$GITHUB_OUTPUT"
            echo 'scenarios=[]' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          JSON=$(echo "$SCENARIOS" | jq -R . | jq -s .)
          echo "Scoped scenarios: $JSON"
          echo "mode=scoped" >> "$GITHUB_OUTPUT"
          echo "scenarios=$(echo "$JSON" | jq -c .)" >> "$GITHUB_OUTPUT"

  # The deploy/run/teardown is one job (not three) so any failure mid-flow
  # still reaches teardown (if: always() steps) and uploads partial artefacts.
  smoke:
    needs: scope
    if: needs.scope.outputs.mode != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # The deployment environment gate. CODEOWNERS-required reviewer must
    # approve any run from a non-main ref (configured in repo Settings →
    # Environments → smoke-test-deploy with deployment-branch-policy:
    # refs/heads/main = no-required-reviewer, all others = required).
    environment: smoke-test-deploy

    steps:
      - uses: actions/checkout@v6

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Read smoke-test-account-config.yml
        id: cfg
        run: |
          yq -e '.smoke_test_account_id != "000000000000" and .smoke_test_account_id != null' docs/smoke-test-account-config.yml > /dev/null || {
            echo "ERROR: docs/smoke-test-account-config.yml has placeholder values; Phase 1b not complete?" >&2
            exit 1
          }
          ACCOUNT_ID=$(yq -r '.smoke_test_account_id' docs/smoke-test-account-config.yml)
          ROLE_ARN=$(yq -r '.smoke_test_deploy_role_arn' docs/smoke-test-account-config.yml)
          REGION=$(yq -r '.smoke_test_region' docs/smoke-test-account-config.yml)
          echo "account_id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"
          echo "role_arn=$ROLE_ARN" >> "$GITHUB_OUTPUT"
          echo "region=$REGION" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ steps.cfg.outputs.role_arn }}
          role-session-name: smoke-${{ github.run_id }}
          aws-region: ${{ steps.cfg.outputs.region }}
          audience: sts.amazonaws.com

      - name: Configure GHCR pull credentials
        run: |
          # Some scenarios pull images from ghcr.io at deploy time. Logging in
          # avoids unauthenticated-pull rate limits on the smoke account.
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin || true

      # AC3.6 / AC3.6b — SCP drift detection. Compares the smoke account's
      # current SCP attachments against docs/smoke-test-account-config.yml
      # expected_scps. First detection opens an issue tagged scp-drift; the
      # GH issue body is the counter (no separate state store), and after 7
      # nightly detections the build flips to fail-on-mismatch.
      - name: SCP drift check
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          EXPECTED=$(yq -r '.expected_scps[]' docs/smoke-test-account-config.yml | sort -u)
          ACTUAL=$(aws organizations list-policies-for-target \
            --target-id "${{ steps.cfg.outputs.account_id }}" \
            --filter SERVICE_CONTROL_POLICY \
            --query 'Policies[].Id' --output text 2>/dev/null \
            | tr '\t' '\n' | sort -u || true)
          # If the deploy role can't read Organizations, this is fine — drift
          # check is informational, not gating. Don't fail on missing perms.
          if [ -z "$ACTUAL" ]; then
            echo "Could not enumerate live SCPs (likely missing organizations:ListPoliciesForTarget)"
            exit 0
          fi
          if [ "$EXPECTED" = "$ACTUAL" ]; then
            echo "SCP drift check: live attachments match expected_scps"
            exit 0
          fi
          echo "SCP drift detected"
          echo "Expected:" && echo "$EXPECTED" | sed 's/^/  /'
          echo "Actual:" && echo "$ACTUAL" | sed 's/^/  /'
          # Use the issue body as the counter (timestamped comments). Open if
          # missing; flip the build to fail at >= 7 comments.
          BODY="Live SCP attachments differ from docs/smoke-test-account-config.yml expected_scps. See AC3.6b."
          ISSUE_NUM=$(gh issue list --state open --label scp-drift --json number --jq '.[0].number' || true)
          if [ -z "$ISSUE_NUM" ]; then
            gh issue create --title "scp-drift detected on smoke-test account" --label scp-drift --body "$BODY"
            ISSUE_NUM=$(gh issue list --state open --label scp-drift --json number --jq '.[0].number')
          fi
          gh issue comment "$ISSUE_NUM" --body "Drift still present at $(date -u +%FT%TZ); run ${{ github.run_id }}"
          COUNT=$(gh issue view "$ISSUE_NUM" --json comments --jq '.comments | length')
          if [ "$COUNT" -ge 7 ]; then
            echo "scp-drift persisted >= 7 nightly runs (issue #$ISSUE_NUM); failing the build" >&2
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # AC3.7b / AC3.13 — Pre-deploy state check. If a previous run left the
      # stack in DELETE_FAILED / *_IN_PROGRESS, try to recover; if recovery
      # fails, proceed against a unique stack name so subsequent runs are not
      # blocked.
      - name: Pre-deploy state check
        id: predeploy
        run: |
          set -euo pipefail
          STACK="${STACK_NAME}"
          STATUS=$(aws cloudformation describe-stacks --stack-name "$STACK" \
            --query 'Stacks[0].StackStatus' --output text 2>/dev/null || echo "DOES_NOT_EXIST")
          echo "Current $STACK status: $STATUS"
          case "$STATUS" in
            DOES_NOT_EXIST|CREATE_COMPLETE|UPDATE_COMPLETE|UPDATE_ROLLBACK_COMPLETE|ROLLBACK_COMPLETE)
              echo "stack_name=$STACK" >> "$GITHUB_OUTPUT"
              ;;
            *_IN_PROGRESS)
              echo "Stack is mid-operation; attempt cancel + wait"
              aws cloudformation cancel-update-stack --stack-name "$STACK" 2>/dev/null || true
              # Fall through to recovery name if state doesn't clear in 5 min
              sleep 60
              STATUS_NOW=$(aws cloudformation describe-stacks --stack-name "$STACK" \
                --query 'Stacks[0].StackStatus' --output text 2>/dev/null || echo "DOES_NOT_EXIST")
              if [[ "$STATUS_NOW" =~ _IN_PROGRESS$ ]]; then
                RECOVERY="${STACK}-recovery-${{ github.run_id }}"
                echo "stack_name=$RECOVERY" >> "$GITHUB_OUTPUT"
                gh issue create --title "stranded-stack: $STACK stuck in $STATUS_NOW" \
                  --label stranded-stack \
                  --body "Run ${{ github.run_id }} proceeded against recovery name $RECOVERY. Manual cleanup needed." || true
              else
                echo "stack_name=$STACK" >> "$GITHUB_OUTPUT"
              fi
              ;;
            UPDATE_ROLLBACK_FAILED)
              echo "Attempting continue-update-rollback"
              aws cloudformation continue-update-rollback --stack-name "$STACK" || true
              echo "stack_name=$STACK" >> "$GITHUB_OUTPUT"
              ;;
            DELETE_FAILED)
              echo "Retrying delete-stack"
              aws cloudformation delete-stack --stack-name "$STACK"
              aws cloudformation wait stack-delete-complete --stack-name "$STACK" || {
                RECOVERY="${STACK}-recovery-${{ github.run_id }}"
                echo "stack_name=$RECOVERY" >> "$GITHUB_OUTPUT"
                gh issue create --title "stranded-stack: $STACK DELETE_FAILED" \
                  --label stranded-stack \
                  --body "Run ${{ github.run_id }} proceeded against recovery name $RECOVERY. Manual cleanup needed." || true
                exit 0
              }
              echo "stack_name=$STACK" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unhandled status $STATUS; proceeding with default name"
              echo "stack_name=$STACK" >> "$GITHUB_OUTPUT"
              ;;
          esac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy all-demo (or scoped subset)
        id: deploy
        run: |
          set -euo pipefail
          STACK="${{ steps.predeploy.outputs.stack_name }}"
          MODE="${{ needs.scope.outputs.mode }}"

          # Smoke account uses the blueprints bucket as the template source;
          # the all-demo template's defaults already point at the right
          # bucket / region, so we just need to pass --capabilities and run.
          aws cloudformation deploy \
            --stack-name "$STACK" \
            --template-file cloudformation/scenarios/all-demo/template.yaml \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND \
            --no-fail-on-empty-changeset \
            --tags "Project=ndx-try" "SmokeRun=${{ github.run_id }}" "SmokeMode=$MODE"
          echo "stack_name=$STACK" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Quarantine-expiry check
        run: |
          # Parse assertion-bar.ts for quarantine rows. Fail if any until-date
          # has passed, or if more than 3 scenarios are concurrently quarantined.
          node -e "
            const fs = require('fs');
            const src = fs.readFileSync('tests/smoke/fixtures/assertion-bar.ts', 'utf8');
            const re = /state:\s*'quarantined'[^}]*until:\s*'([0-9-]+)'[^}]*reason:\s*'([^']+)'/g;
            const today = new Date().toISOString().slice(0,10);
            let m, expired = [], total = 0;
            while ((m = re.exec(src)) !== null) {
              total++;
              if (m[1] < today) expired.push({date: m[1], reason: m[2]});
            }
            if (expired.length > 0) {
              console.error('FAILURE: quarantined tests have passed their until-date:');
              for (const e of expired) console.error('  - ' + e.date + ': ' + e.reason);
              process.exit(1);
            }
            if (total > 3) {
              console.error('FAILURE: ' + total + ' scenarios concurrently quarantined; cap is 3 (Phase 4 DoD).');
              process.exit(1);
            }
            console.log('Quarantine check: ' + total + ' active quarantine(s) within cap 3.');
          "

      - name: Run smoke pack
        id: run
        env:
          SMOKE_STACK_NAME: ${{ steps.deploy.outputs.stack_name }}
          SMOKE_AWS_REGION: ${{ steps.cfg.outputs.region }}
          CI: 'true'
        run: |
          MODE="${{ needs.scope.outputs.mode }}"
          if [ "$MODE" = "scoped" ]; then
            # JSON array of scenario slugs; Playwright --grep uses regex OR.
            PATTERN=$(echo '${{ needs.scope.outputs.scenarios }}' | jq -r 'join("|")')
            ./scripts/smoke.sh --grep "$PATTERN"
          else
            ./scripts/smoke.sh
          fi

      # AC3.9 — artefacts upload BEFORE teardown so live-stack state is
      # captured even when the smoke specs failed.
      - name: Capture CFN events (for the artefact bundle)
        if: always()
        run: |
          mkdir -p artefacts
          STACK="${{ steps.deploy.outputs.stack_name }}"
          aws cloudformation describe-stack-events --stack-name "$STACK" \
            --output json > "artefacts/${STACK}-events.json" || true
          aws cloudformation list-stack-resources --stack-name "$STACK" \
            --output json > "artefacts/${STACK}-resources.json" || true

      - name: Upload artefact bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-artefacts-${{ github.run_id }}
          path: |
            artefacts/
            playwright-report/
            test-results/
          retention-days: 30

      # AC3.7 — Teardown with retry. Up to 3 × 60s attempts before DELETE_FAILED.
      - name: Teardown
        if: always()
        run: |
          set +e
          STACK="${{ steps.deploy.outputs.stack_name }}"
          for ATTEMPT in 1 2 3; do
            echo "Teardown attempt $ATTEMPT for $STACK"
            aws cloudformation delete-stack --stack-name "$STACK"
            if aws cloudformation wait stack-delete-complete --stack-name "$STACK"; then
              echo "Teardown succeeded"
              exit 0
            fi
            sleep 60
          done
          echo "Teardown failed after 3 attempts; opening stranded-stack issue"
          BODY="Stack $STACK on smoke-test account failed delete after 3 attempts in run ${{ github.run_id }}. See artefacts for events."
          gh issue create --title "stranded-stack: $STACK DELETE_FAILED after teardown retry" \
            --label stranded-stack --body "$BODY" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # AC3.5 — failure notification on nightly cron only. PR / push failures
      # surface via the PR check already.
      - name: Open smoke-failed issue on cron failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --title "Nightly smoke failed (run ${{ github.run_id }})" \
            --label smoke-failed \
            --body "Smoke run ${{ github.run_id }} failed. Mode: ${{ needs.scope.outputs.mode }}. Artefacts: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/${{ github.run_id }}" || true
