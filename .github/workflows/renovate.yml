name: Renovate

on:
  schedule:
    - cron: '0 6,18 * * *'
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level (debug for verbose)'
        required: false
        default: 'info'
        type: choice
        options:
          - info
          - debug

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Run Renovate
        uses: renovatebot/github-action@693b9ef15eec82123529a37c782242f091365961   # v46.1.14
        with:
          # PAT (not GITHUB_TOKEN) so Renovate PRs trigger downstream workflows.
          # Rotation: docs/smoke-test-account-setup.md → Operational Notes.
          token: ${{ secrets.RENOVATE_TOKEN }}
          configurationFile: renovate.json
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: '["co-cddo/ndx_try_aws_scenarios"]'
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: 'required'
