name: Smoke Account Nuke

# One-shot manual cleanup of the smoke account: deletes every ndx-try-*
# stack (umbrella + nested), all S3Files file systems (with access points +
# mount targets), AppRegistry NDXTry_* apps, ndx-try-* Connect instances,
# and ndx-try-*${ACCOUNT_ID}* S3 buckets. Use when iterative pre-deploy
# cleanup has accumulated too much debris to recover from.
#
# Triggered manually via workflow_dispatch. Reuses the smoke-test-deploy
# role + concurrency group with smoke.yml so we can't run both at once.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type NUKE to confirm destructive cleanup of the smoke account'
        required: true
        type: string

permissions:
  id-token: write
  contents: read
  issues: write

concurrency:
  group: smoke
  cancel-in-progress: false

env:
  STACK_NAME: all-demo
  AWS_REGION: us-east-1

jobs:
  nuke:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: smoke-test-deploy
    steps:
      - name: Validate confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "NUKE" ]; then
            echo "::error::confirm input must be exactly 'NUKE' to proceed"
            exit 1
          fi
      - uses: actions/checkout@v6
      - name: Install yq
        run: |
          YQ_VERSION="v4.45.4"
          sudo wget -qO /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq
      - name: Read smoke-test-account-config.yml
        id: cfg
        run: |
          echo "role_arn=$(yq -r '.smoke_test_deploy_role_arn' docs/smoke-test-account-config.yml)" >> "$GITHUB_OUTPUT"
          echo "region=$(yq -r '.smoke_test_region' docs/smoke-test-account-config.yml)" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ steps.cfg.outputs.role_arn }}
          role-session-name: smoke-nuke-${{ github.run_id }}
          aws-region: ${{ steps.cfg.outputs.region }}
          role-duration-seconds: 21600

      - name: Nuke everything
        env:
          STACK_NAME: ${{ env.STACK_NAME }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: ./scripts/smoke-nuke.sh
