name: Smoke PSTN Setup

# One-shot operator workflow: creates a long-lived "holder" Amazon Connect
# instance in the smoke account and claims a UK geographic DID against it.
# Outputs the values you paste into docs/smoke-test-account-config.yml so
# every subsequent smoke deploy reuses this number (avoiding the 30-day
# release-cooldown that exhausts UK DID claim quota).
#
# Idempotent: re-running reuses an existing holder + number when present.
#
# Manually triggered only. Uses the same OIDC trust as smoke.yml because
# the smoke account's Restrictions SCP blocks connect:CreateInstance from
# any principal whose name doesn't start with InnovationSandbox-ndx-*.

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: smoke
  cancel-in-progress: false

jobs:
  pstn-setup:
    runs-on: ubuntu-latest
    environment: smoke-test-deploy
    steps:
      - uses: actions/checkout@v6

      - name: Install yq
        run: |
          YQ_VERSION="v4.45.4"
          sudo wget -qO /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq

      - name: Read smoke-test-account-config.yml
        id: cfg
        run: |
          echo "role_arn=$(yq -r '.smoke_test_deploy_role_arn' docs/smoke-test-account-config.yml)" >> "$GITHUB_OUTPUT"
          echo "region=$(yq -r '.smoke_test_region' docs/smoke-test-account-config.yml)" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ steps.cfg.outputs.role_arn }}
          role-session-name: pstn-setup-${{ github.run_id }}
          aws-region: ${{ steps.cfg.outputs.region }}

      - name: Run setup
        id: setup
        run: ./scripts/smoke-pstn-setup.sh

      - name: Summary
        run: |
          {
            echo "### PSTN setup result"
            echo ""
            echo "Update \`docs/smoke-test-account-config.yml\` with:"
            echo ""
            echo '```yaml'
            echo "aicc_existing_phone_number_arn: \"${{ steps.setup.outputs.phone_number_arn }}\""
            echo "aicc_existing_phone_number: \"${{ steps.setup.outputs.phone_number }}\""
            echo '```'
            echo ""
            echo "Holder instance: \`${{ steps.setup.outputs.holder_instance_id }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
