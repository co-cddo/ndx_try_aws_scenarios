# Smoke-Test Account Config (post-runbook state record)
# =====================================================
#
# This file records the post-execution state of the smoke-test AWS account that
# hosts the NDX:Try scenario-regression smoke pack. It is the committed,
# machine-readable companion to docs/smoke-test-account-setup.md (the runbook).
#
# Lifecycle:
#   - Phase 1a (this PR): committed in template form with placeholder values.
#   - Phase 1b: operator runs the runbook end-to-end and PRs this file with the
#     real values populated. PR reviewed by the same security/org-admin reviewer
#     who approved the runbook.
#   - Drift / SCP updates: PR to this file. The nightly SCP drift check in
#     .github/workflows/smoke.yml compares live state to expected_scps and
#     opens an issue tagged `scp-drift` on first mismatch.
#
# Consumers:
#   - .github/workflows/smoke.yml  reads smoke_test_account_id +
#                                  smoke_test_deploy_role_arn +
#                                  smoke_test_region + expected_scps (via yq)
#   - scripts/smoke.sh             same fields, locally via yq
#
# Public-repo disclosure note:
#   This repo is public by design. Account IDs, role ARNs, OU IDs, and SCP
#   policy IDs are NOT AWS secrets per AWS guidance. The security model relies
#   on (a) GitHub fork OIDC isolation (pull_request from forks does not pass
#   secrets/OIDC on public repos), (b) the trust-policy sub-pattern locked to
#   repo:co-cddo/ndx_try_aws_scenarios:* (an attacker would need a co-cddo-
#   owned different repo, of which there are none with this slug), (c) the
#   smoke-test-deploy deployment environment with branch policy + CODEOWNERS
#   approval for non-main refs, and (d) iterate-to-least-privilege IAM.
#
#   The original spec also called for a trust-policy repository_owner=co-cddo
#   claim condition as belt-and-braces; that condition reproducibly breaks
#   sts:AssumeRoleWithWebIdentity even though the OIDC token verifiably
#   contains the claim. See the runbook's Step 10 for the investigation
#   notes and the doctrinal explanation of why the remaining defences are
#   adequate.
#
#   Do NOT commit anything to this file that is materially secret (passwords,
#   API keys, internal hostnames not already published). If a future field
#   would carry secret material, use GitHub secrets or AWS Secrets Manager.
#
# Schema-allowlist enforcement:
#   A CI lint step on PRs touching this file validates that any added top-level
#   field appears in a static allowlist defined in the lint script. PRs adding
#   fields outside the allowlist fail CI. Adding to the allowlist requires a
#   separate PR with security/devops CODEOWNERS approval.

# --- Account placement -------------------------------------------------------

# The 12-digit AWS account ID returned by `aws organizations create-account`
# in Step 4 of the runbook.
smoke_test_account_id: "464453619983"
# The ARN of the GitHub Actions deploy role created in Step 10 of the runbook.
# Name must start with InnovationSandbox-ndx-* (Restrictions SCP requirement).
smoke_test_deploy_role_arn: "arn:aws:iam::464453619983:role/InnovationSandbox-ndx-SmokeTestDeployRole"
# Region for the smoke account and its deploys. us-east-1 per the global
# CLAUDE.md constraint and ADR-1 of the tech-spec.
smoke_test_region: "us-east-1"
# The OU containing the smoke account. Set by Step 3 (or by Step 7-fallback
# if the ProtectISB canary failed).
smoke_test_ou_id: "r-2laj"
# Records which placement branch the runbook took:
#   - "child-of-sandboxOu"                    primary branch; SCP inheritance
#                                             via sandboxOu's four parent SCPs
#   - "child-of-root-with-selective-scps"     fallback branch (ProtectISB
#                                             role-creation deadlock); SCPs
#                                             attached directly to the account.
#                                             Runbook records a 6-month review
#                                             cadence via the scp-fallback-revisit
#                                             issue.
smoke_test_ou_placement_branch: "child-of-root-with-selective-scps"
# --- Organizations context ---------------------------------------------------

# The sandboxOu ID discovered in Step 1 of the runbook. Stored here so the
# nightly drift check has a stable reference for "parent OU we are inheriting
# from" even if the ISB display name changes.
sandbox_ou_id: "ou-2laj-4dyae1oa"
# The SCP policy IDs attached DIRECTLY to the smoke-test account (NOT
# inherited). The nightly drift check compares live state to this list;
# mismatch opens an issue tagged `scp-drift`. Order does not matter; sets
# are compared (modulo p-FullAWSAccess which is excluded by the drift
# check — AWS-managed, always present).
#
# Current state reflects the fallback branch (smoke_test_ou_placement_branch
# = child-of-root-with-selective-scps):
# - p-6tw8eixp = InnovationSandboxRestrictionsScp (enforces role-name
#   prefix InnovationSandbox-ndx-* and various security restrictions)
# - p-FullAWSAccess = AWS-managed default (implicit on every account)
#
# Notably NOT attached:
# - p-gn4fu3co (ProtectISBResourcesScp) — would block role creation on
#   InnovationSandbox-* names from non-ISB principals (Step 7 canary
#   showed this blocks OrganizationAccountAccessRole's create-role call).
# - p-7pd0szg9 (AwsNukeSupportedServicesScp) — would block any
#   sts:AssumeRoleWithWebIdentity call because its NotAction allow-list
#   does not include sts:*. AwsNuke isn't relevant for the smoke account
#   (we use CFN delete + retention lint, ADR-4).
#
# If ISB is upgraded and adds new SCPs, capture and re-attach selectively
# per the runbook's Step 7-fallback guidance (verify sts:* is in any
# NotAction-Deny allow-list before attaching).
expected_scps:
  - p-6tw8eixp
  - p-FullAWSAccess
# --- ai-contact-centre PSTN holder -----------------------------------------
#
# Amazon Connect releases a phone number on stack-delete, but the released
# number is held in a 30-day cooldown and consumes claim quota during that
# window. Long-lived smoke deploys claim/release once per CI run, so we
# exhaust UK +44 DID quota in days. The fix: claim ONE number against a
# long-lived "holder" Connect instance and reuse it on every smoke deploy.
#
# Both values are non-empty placeholders today. When set to real values,
# the smoke deploy passes them to the all-demo umbrella, which passes them
# to ai-contact-centre, which uses ExistingPhoneNumberArn/ExistingPhoneNumber
# to skip claim+release. When the values are placeholders, ai-contact-centre
# stack still deploys (placeholder ARN routed through the conditional) but
# its smoke spec is quarantined and the deploy is effectively a no-op for
# the PSTN path.
#
# Operator setup (one-off): see docs/smoke-test-account-setup.md →
# "Step 13: pre-claim ai-contact-centre PSTN number".
aicc_existing_phone_number_arn: "arn:aws:connect:us-east-1:464453619983:phone-number/a74f4f80-0d6d-42e8-b2bd-e0f4c800e5b2"
aicc_existing_phone_number: "+442046424897"
