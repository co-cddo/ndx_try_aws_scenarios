# Phase Navigator Configuration (Story 12.1)
# Defines the three-phase journey structure for all scenarios

phases:
  - id: try
    label: "TRY"
    sublabel: "Deploy & Experience"
    time: "5 min"
    benefit: "See it work in your AWS account"
    order: 1
    optional: false
    fork: false
    icon: "rocket"
    description: "Request a session via NDX:Try and experience it working"

  - id: walkthrough
    label: "WALK THROUGH"
    sublabel: "Guided Demo"
    time: "10 min"
    benefit: "Follow step-by-step guidance"
    order: 2
    optional: false
    fork: false
    icon: "steps"
    description: "Follow our guided walkthrough to explore key features"

  - id: explore
    label: "EXPLORE"
    sublabel: "Go Deeper"
    time: "15+ min"
    benefit: "Experiment and understand"
    order: 3
    optional: true
    fork: true
    icon: "magnifying-glass"
    description: "Dig deeper with hands-on exploration activities"

# Cost reassurance message (AC-4)
costReassurance: "This demo costs nothing to deploy"

# Session expiration threshold (90 minutes in milliseconds)
sessionExpiryMs: 5400000

# Branching configuration (AC-7)
branching:
  postWalkthroughOptions:
    - id: evidence-pack
      label: "Generate Evidence Pack"
      description: "Create your business case documentation"
      primary: true
      icon: "document"

    - id: explore
      label: "Go Deeper"
      description: "Explore more activities and features"
      primary: false
      icon: "magnifying-glass"
      fork: true

# Transition CTA messages (AC-8)
transitionMessages:
  tryComplete:
    title: "Great! You've deployed the demo"
    body: "Now let's walk through what you just deployed and see it in action."
    cta: "Start Walkthrough"

  walkthroughComplete:
    title: "Walkthrough complete"
    body: "You've seen the key features. Generate an evidence pack or explore deeper."
    cta: "Choose Next Step"

  exploreComplete:
    title: "Exploration complete"
    body: "You've completed the essential activities. Ready to build your business case?"
    cta: "Generate Evidence Pack"

# Parallel entry prompts (AC-9)
parallelEntry:
  missingTryPhase:
    title: "Start from the beginning"
    message: "To get the full experience, start by requesting a session via NDX:Try."
    cta: "Go to Deploy"
    allowBypass: true
    bypassText: "Continue without deployment (screenshots only)"

  missingWalkthroughPhase:
    title: "Complete the walkthrough first"
    message: "The walkthrough provides essential context for exploration activities."
    cta: "Go to Walkthrough"
    allowBypass: true
    bypassText: "Skip to Explore"

# Stale session handling (AC-10)
staleSession:
  title: "Your demo environment has expired"
  message: "Your demo environment has expired. You can re-deploy or continue with screenshots."
  redeployText: "Re-deploy Demo"
  screenshotsText: "Continue with Screenshots"
  icon: "clock"
