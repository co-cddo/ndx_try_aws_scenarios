# Screenshot data for AI Contact Centre scenario
# Used by screenshot.njk component to display screenshots in walkthrough steps
# Images stored in src/screenshots/ai-contact-centre/

scenario: ai-contact-centre
scenarioTitle: "AI Contact Centre (Council Reception)"
awsService: "Amazon Connect"
totalSteps: 5

steps:
  - step: 1
    title: "Dial in"
    screenshots:
      - id: connect-instance-overview
        filename: 11-connect-instance-overview.png
        alt: "Amazon Connect Account overview screen showing Access URL, Emergency access link, Instance ARN, and Service-linked role"
        caption: "Find your instance in the Amazon Connect console and click the access URL or 'Log in for emergency access'"
        width: 1440
        height: 900

      - id: connect-home
        filename: 12-connect-home.png
        alt: "Amazon Connect admin home page after emergency access login, showing welcome cards, latest announcements, and recent blog posts"
        caption: "Emergency access drops you on the Amazon Connect admin home"
        width: 1440
        height: 900

      - id: companion-spa
        filename: 20-companion-spa.png
        alt: "Three-pane companion web app: chat transcript on the left with welcome from Aldershire DC and NDX:Try greeting, empty Connect Case in the middle, and photo upload simulator on the right with phone field and Choose photo button"
        caption: "Open the companion web app from the CompanionUrl stack output. Chat works; web call and photo upload simulator are visible side by side."
        width: 1200
        height: 900

  - step: 2
    title: "Distress and multi-intent triage"
    screenshots:
      - id: agent-workspace-landing
        filename: 14-agent-workspace-default.png
        alt: "Amazon Connect Agent Workspace with the Contact Control Panel on the left, Customer Profile and Cases tabs in the centre, and the Connect assistant pane on the right"
        caption: "The agent workspace, ready to take a call. Connect assistant (Q in Connect) is on the right."
        width: 1440
        height: 900

  - step: 3
    title: "Send a photo through the simulator"
    screenshots:
      - id: companion-spa
        filename: 20-companion-spa.png
        alt: "Companion web app in step-3 mode: photo upload simulator pane is bright; left and middle panes are dimmed"
        caption: "Open the photo upload simulator pane and attach a photo"
        width: 1200
        height: 900

  - step: 4
    title: "One case, two channels (the headline moment)"
    screenshots:
      - id: agent-workspace-apps
        filename: 15-agent-workspace-apps-menu.png
        alt: "Apps dropdown in the Agent Workspace showing Performance metrics and Worklist"
        caption: "The Apps menu in the agent workspace exposes built-in views. The bespoke NDX:Try Aldershire app is registered with the instance."
        width: 1200
        height: 900

      - id: custom-agent-dashboard
        filename: 16-custom-agent-dashboard.png
        alt: "Bespoke NDX:Try Aldershire agent dashboard with About-this-session card, Caller lookup form, and Quick links"
        caption: "The bespoke NDX:Try Aldershire app: a branded dashboard with caller lookup and quick links to chat, web call, and the photo upload simulator"
        width: 1200
        height: 1000

  - step: 5
    title: "Sentiment and safeguarding deep-dive"
    screenshots: []
