# Screenshot data for Paperless-ngx scenario
# Used by screenshot.njk component to display screenshots in walkthrough steps
# Images stored in src/assets/images/screenshots/paperless-ngx/

scenario: paperless-ngx
scenarioTitle: "Paperless-ngx with AI"
awsService: "Amazon Bedrock"
totalSteps: 4

steps:
  - step: 1
    title: "Sign in and see the dashboard"
    screenshots:
      - id: login
        filename: 01-login.png
        alt: "Paperless-ngx login screen with the green 'Please sign in' panel and username/password fields"
        caption: "The Paperless-ngx login page — credentials come from the AdminUsername and AdminPassword stack outputs"
        width: 1280
        height: 800
      - id: dashboard
        filename: 02-dashboard.png
        alt: "Paperless-ngx dashboard with inbox tag, saved views and recent documents"
        caption: "After signing in, the dashboard surfaces the inbox tag and recent saved views"
        width: 1280
        height: 800

  - step: 2
    title: "Browse the AI-classified archive"
    screenshots:
      - id: documents-list
        filename: 03-documents-list.png
        alt: "Document list showing AI-rewritten titles, AI-generated tags, AI document types and AI-extracted correspondents"
        caption: "Every document arrives with an AI-rewritten title, AI tags, AI document type and AI-extracted correspondent — all generated by Amazon Nova Pro at consume time"
        width: 1280
        height: 800
      - id: tags
        filename: 05-tags.png
        alt: "Tags page listing AI-generated tags: agenda, application, asset register, audit, correspondence, council, finance, grant, insurance, invoice"
        caption: "Tags were created automatically as Bedrock classified each document"
        width: 1280
        height: 800
      - id: document-types
        filename: 07-document-types.png
        alt: "Document types page showing Invoice, Letter, Minutes, Planning Notice, Agenda, Report, Receipt"
        caption: "Every document is classified into one of seven types — created on first use by Bedrock"
        width: 1280
        height: 800
      - id: correspondents
        filename: 06-correspondents.png
        alt: "Correspondents page showing AI-extracted senders such as Anglia Water Services, Dunbar Grounds Maintenance, Highways East, Information Commissioner's Office, Meadowbrook Parish Council"
        caption: "Senders and issuing bodies were pulled out of the OCR'd text and linked to each document"
        width: 1280
        height: 800

  - step: 3
    title: "Open a document and search"
    screenshots:
      - id: document-detail
        filename: 04-document-detail.png
        alt: "Document detail view showing OCR'd email content from Highways East about a footpath query"
        caption: "Every document is OCR'd by Tesseract; .docx and .odt go via Gotenberg, .eml via Apache Tika — the full text becomes searchable"
        width: 1280
        height: 800
      - id: search
        filename: 08-search.png
        alt: "Search results filtered to the term 'planning' showing several planning notices"
        caption: "Full-text search combines Paperless's text index over OCR'd content with the AI-generated metadata"
        width: 1280
        height: 800

  - step: 4
    title: "Chat with the archive"
    screenshots:
      - id: chat-empty
        filename: 09-chat-empty.png
        alt: "Chat-with-archive UI with the welcome message and three example questions"
        caption: "Open the ChatUrl from the stack outputs — a vanilla chat UI backed by Amazon Bedrock Knowledge Base over S3 Vectors with Bedrock Guardrails applied"
        width: 1280
        height: 800
      - id: chat-answered
        filename: 10-chat-answered.png
        alt: "Chat answer listing six planning applications under consideration with citations to specific source documents and {ADDRESS} placeholders where addresses were anonymised"
        caption: "The model retrieves relevant documents from the archive, cites them, and Bedrock Guardrails anonymise names and addresses in the response (you can see the {ADDRESS} placeholders)"
        width: 1280
        height: 800

# Console screenshots reserved for the future explore section
console: []
