      - title: "Planning flows browsed"
        description: "Explore the NDX Demo Council team and its flows"
        time: "3 minutes"
      - title: "Flow edited"
        description: "Open and edit a flow in the drag-and-drop node editor"
        time: "5 minutes"
      - title: "Applicant experience previewed"
        description: "Use the preview to see the citizen-facing application journey"
        time: "3 minutes"
      - title: "Data layer explored"
        description: "Browse Hasura console tables and the GraphQL API"
