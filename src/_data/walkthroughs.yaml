    category: "finance"
    steps:
      - title: "Payment processed"
        description: "Use the payment portal and GOV.UK Pay sandbox to make a test Council Tax payment"
        time: "5 minutes"
      - title: "Transactions reviewed"
        description: "Log into the admin portal to search accounts and view payment receipts"
        time: "4 minutes"
      - title: "Suspense item resolved"
        description: "Find an unallocated payment and allocate it to the correct account"
        time: "4 minutes"
