        time: "2 minutes"
      - title: "Log in to Minute AI"
        description: "Access the Minute AI interface and explore the dashboard"
        time: "2 minutes"
      - title: "Upload a meeting recording"
        description: "Upload an audio file and choose a minute template"
        time: "3 minutes"
      - title: "View the transcription"
        description: "See the AI-generated transcript with speaker identification"
        time: "3 minutes"
      - title: "Review AI-generated minutes"
        description: "Explore the structured meeting minutes generated by Amazon Nova Pro"
        time: "5 minutes"
      - title: "Edit and export"
        description: "Use the AI editor, download, and explore templates"
