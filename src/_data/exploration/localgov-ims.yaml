# LocalGov IMS Exploration Data
# Initial draft — subject-matter review welcome.

scenario_id: localgov-ims
scenario_title: LocalGov IMS
total_time_estimate: "40 minutes"
description: "Take LocalGov IMS beyond the walkthrough — process payments, work suspense items, run eReturns, and look inside the Windows container."

personas:
  finance:
    id: finance
    title: "Finance Officer / Income Manager"
    description: "Focus on the workflow — payments, account holders, suspense, eReturns."
    time_estimate: "25 minutes"
  technical:
    id: technical
    title: "Developer / Technical Lead"
    description: "Focus on the Windows-on-Fargate hosting, SQL Server, and GOV.UK Pay integration."
    time_estimate: "35 minutes"

activities:
  - id: exp-payment-success
    title: "Take a successful test payment through GOV.UK Pay"
    category: experiments
    persona: finance
    time_estimate: "5 min"
    learning: "End-to-end payment lifecycle, from invoice through GOV.UK Pay sandbox back to a reconciled receipt."
    safe_badge: true
    input_text: |
      Use a GOV.UK Pay sandbox test card:
      - Number: 4444 3333 2222 1111
      - Expiry: any future date
      - CVC: any 3 digits
    expected_output: "Payment captured by GOV.UK Pay, callback updates the IMS record, receipt visible against the account holder."

  - id: exp-payment-failure
    title: "Watch a failed payment and the suspense workflow"
    category: experiments
    persona: finance
    time_estimate: "6 min"
    learning: "How the system handles declined or partial payments, and where suspense items live until resolved."
    safe_badge: true
    input_text: |
      Use a GOV.UK Pay sandbox decline card:
      - Number: 4000 0000 0000 0002
    expected_output: "Payment declined, no reconciliation, the unmatched amount lands in suspense for an officer to action."

  - id: exp-account-holder
    title: "Look up an account holder and their transaction history"
    category: experiments
    persona: finance
    time_estimate: "5 min"
    learning: "Account holders aggregate transactions across multiple funds — a single resident may have parking, council tax and licensing entries."
    safe_badge: true
    expected_output: "Filtered transaction history showing recent payments, suspense items and balances per fund."

  - id: exp-ereturns
    title: "Run an eReturns batch"
    category: experiments
    persona: finance
    time_estimate: "5 min"
    learning: "eReturns is how IMS reconciles batches of digital receipts (e.g. from a payment gateway) against expected income."
    safe_badge: true
    expected_output: "A reconciliation summary listing matched and unmatched lines — the unmatched lines feed into suspense."

  - id: exp-roles
    title: "Try the system as different roles"
    category: experiments
    persona: both
    time_estimate: "4 min"
    learning: "Officer vs administrator views differ — administrators configure funds and cashiers, officers do day-to-day reconciliation."
    safe_badge: true
    expected_output: "Each role sees a different navigation and permitted actions."

  - id: arch-console
    title: "Look inside the Windows container hosting"
    category: architecture
    persona: technical
    time_estimate: "12 min"
    learning: "Windows .NET Framework on ECS Fargate with SQL Server on RDS — see what 'lift and shift Windows to AWS' really looks like."
    steps:
      - title: "ECS Cluster (Windows tasks)"
        console_url: "https://console.aws.amazon.com/ecs/v2/clusters"
        what_to_look_for: "Fargate tasks running the Windows platform variant. Open a task to see the platform version and image."
      - title: "RDS SQL Server"
        console_url: "https://console.aws.amazon.com/rds/home#databases:"
        what_to_look_for: "SQL Server instance with encryption at rest, automated backups."
      - title: "Application Load Balancer"
        console_url: "https://console.aws.amazon.com/ec2/home#LoadBalancers:"
        what_to_look_for: "Two target groups — admin portal and payment portal — both on IIS-served HTTP behind the ALB."
      - title: "CloudFront"
        console_url: "https://console.aws.amazon.com/cloudfront/v4/home#/distributions"
        what_to_look_for: "HTTPS termination and caching policy in front of the ALB."
      - title: "Secrets Manager"
        console_url: "https://console.aws.amazon.com/secretsmanager/listsecrets"
        what_to_look_for: "Database credentials and the GOV.UK Pay API key stored as secrets, not in the task definition."

  - id: limit-windows-coldstart
    title: "Windows Fargate cold-start time"
    category: limits
    persona: technical
    time_estimate: "4 min"
    learning: "Windows containers start more slowly than Linux ones — provisioning the platform is more expensive."
    challenge_description: "Stop the ECS service, start it again, and time how long until the load balancer reports healthy targets."
    expected_behavior: "Tens of seconds to a minute, depending on image size. Not great for rapid auto-scaling."
    business_implication: "Keep one task always running, scale out using target tracking with conservative cool-down. For a small council the demo's single-task setup is fine."

  - id: limit-data
    title: "Sample data only"
    category: limits
    persona: both
    time_estimate: "3 min"
    learning: "The demo ships with 200+ synthetic account holders and 500+ transactions. Real production has different data volume and integration shape."
    challenge_description: "Search for high-volume edge cases (e.g. an account with hundreds of transactions)."
    expected_behavior: "Demo loads quickly because the data set is small."
    business_implication: "Production sizing depends on transaction volume and concurrent cashier sessions. Aurora-compatible alternatives reduce cost; staying on SQL Server keeps existing tooling."

production_guidance:
  - id: customisation
    title: "Customising for your council"
    topics:
      - "Configure your own fund codes, cashier permissions, and account holder fields."
      - "Set the GOV.UK Pay live API key when you're ready to leave the sandbox."
      - "Integrate with your existing finance system via the IMS API."
  - id: scale
    title: "What would change at scale"
    topics:
      - "ECS auto-scaling on CPU or request count for busy periods."
      - "RDS SQL Server instance sizing — start with db.t3.medium, scale up if reconciliation jobs slow."
      - "Multi-AZ RDS for HA in production."
      - "Read replica for reporting if eReturns or batch jobs hurt foreground performance."
  - id: costs
    title: "Indicative production cost"
    demo_costs:
      note: "FREE as part of NDX:Try programme"
      total: "No cost to your council"
    production_costs:
      ecs_fargate: "£150 to £400 per month (single task, always-on, Windows platform)"
      aurora: "£100 to £300 per month (SQL Server RDS, db.t3.medium with Multi-AZ)"
      cloudfront: "£15 to £40 per month"
      total: "£300 to £750 per month"
  - id: security
    title: "Security checklist for going live"
    items:
      - "GOV.UK Pay live API key in Secrets Manager, not in the task definition."
      - "WAF rules on the CloudFront distribution."
      - "SQL Server encryption at rest (default on) plus encrypted automated backups."
      - "CloudTrail and CloudWatch alarms on cashier login failures."
      - "Network — IMS lives in private subnets behind the ALB; database is not internet-routable."
